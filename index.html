、Claude、Grok 和 Muse 四个 AI 一起玩《马力欧派对》比谁最强。网友转述最终排名：Muse 第一、Claude 第二、ChatGPT 第三，Grok 一颗星都没拿到垫底。","highlight":"四个 AI 同桌玩派对游戏，Grok 0 星垫底。","rep":"复刻：让豆包、DeepSeek、Kimi、元宝玩同一个文字小游戏（猜数字、成语接龙、狼人杀发言、谁是卧底），记录谁先犯规、谁最会耍赖，做成「AI 派对游戏排行榜」。封面放四个 AI 头像的领奖台，最后一名标「0 星」。","author":"cliplug","created":"2026-10-13 12:06","created_ts":1791864419,"fetched":"2026-10-15 02:20","fetched_ts":1792002000,"like":9,"bm":1,"rt":0,"view":572,"rate":0.1111,"drafts":[],"cm":[]},{"url":"https://x.com/robinsinghvi/status/2109403672291745940","type":"创造线","sub":"为家人做的东西","summary":"孩子每晚都要听「新故事」，爸爸不想再丢 iPad 给他看 YouTube，于是用周末时间靠 Claude Code 一个人做了个应用 Gramms：每晚生成一个全新故事，用奶奶 30 秒录音克隆的真实声音来讲，全程无屏幕。","highlight":"每晚一个新故事，讲故事的是奶奶本人的声音。","rep":"复刻：教小白用豆包/DeepSeek 按孩子的名字和当天发生的事写睡前故事，再用剪映或其他配音工具的声音克隆，录家里长辈 30 秒声音来朗读。标题「我让奶奶每晚给孩子讲一个新故事，她人在老家」，封面放老人录音+孩子听故事的对比画面。","author":"robinsinghvi","created":"2026-10-12 06:00","created_ts":1791756000,"fetched":"2026-10-15 02:20","fetched_ts":1792002000,"like":5,"bm":0,"rt":0,"view":106,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/bag_of_ideas/status/2107894928936456452","type":"创造线","sub":"创作方法","summary":"博主在波尔图机场对着手机哼了一段旋律，回家后自己写词，用 Suno 做成完整歌曲，再用 AI 工具做成一支泰米尔语动画 MV，讲一位「缝补夜空的奶奶」的故事。","highlight":"机场随口哼的一段调子，变成了一支动画 MV。","rep":"复刻：教小白「哼歌→成曲→出 MV」三步：手机录一段哼唱，用 Suno 或国产音乐工具（如海绵音乐）生成歌曲，用即梦/可灵按歌词生成画面再剪辑。标题「我在机场哼了 10 秒，AI 把它变成了 MV」。","author":"bag_of_ideas","created":"2026-10-08 02:04","created_ts":1791396288,"fetched":"2026-10-15 02:20","fetched_ts":1792002000,"like":5,"bm":1,"rt":0,"view":183,"rate":0.2,"drafts":[],"cm":[]},{"url":"https://x.com/DaveShapi/status/2110020791261630599","type":"好玩线","sub":"AI翻车","summary":"AI 博主周末全身心折腾各种 AI 智能体，列了一串最让他抓狂的槽点：第一条就是所有智能体都会时不时无视你明明白白写下的指令，比如他让 ChatGPT 把一个画图任务转交出去，它偏不听。","highlight":"花一整个周末跟 AI 智能体斗智斗勇，结论是：它们每一个都会假装没看见你的指令。","rep":"复刻：做一期「AI 助手最气人的 5 个瞬间」——自己拿豆包/ChatGPT 各试几个明确指令（比如「只回答 3 个字」「别加表情」），截图它不听话的样子，配上吐槽。标题「我说了不要！AI：好的，下面是……」，封面放指令和 AI 回复的对比截图。","author":"DaveShapi","created":"2026-10-13 22:52","created_ts":1791903133,"fetched":"2026-10-15 01:12","fetched_ts":1791997920,"like":150,"bm":42,"rt":5,"view":8616,"rate":0.28,"drafts":[],"cm":[{"u":"https://x.com/Ali_Homsi/status/2110051708193644923","n":"Ali_Homsi","t":"\"I told it that excuses are things that insecure and incompetent humans do\" \n\nYou are talking to it as if it was a human. This isn't necessarily bad but isn't good either. \n\nIf you want it to follow your rules better, give it reasoning that goes beyond why the rule exists.\n\nSo","z":"“我跟它说找借口是没自信、没本事的人才干的事”——你这是把它当人在聊。也不算坏，但也谈不上好。想让它更守规矩，就把规则背后的理由讲透。","l":4,"a":0},{"u":"https://x.com/niteshshar1/status/2110040094279450889","n":"niteshshar1","t":"the invented rules one is the worst. An agent that ignores you is annoying an agent that writes its own rules into the README and then obeys those over you is a trust problem short instruction files with the hard rules at the top beat long ones\n\nand let's see what argon can do","z":"最离谱的是它自己编规矩。不听话的智能体只是烦人，自己往 README 里写规则、然后听它自己的不听你的，那就是信任问题了。指令文件写短点，硬规矩放最前面，比长篇大论管用。","l":3,"a":0},{"u":"https://x.com/allofthedata/status/2110028701710618891","n":"allofthedata","t":"There’s definitely something up with the current state of OpenAIs best models. They have been refusing to honor contract rules and just kinda doing their own thing. \n\nGPT-6 is behaving like an annoying team mate who likes to over engineer things to show off.","z":"OpenAI 现在最强的几个模型确实有点不对劲，约好的规则不遵守，自己想干嘛干嘛。GPT-6 就像那种爱过度设计、到处炫技的烦人队友。","l":2,"a":0},{"u":"https://x.com/leoanthias/status/2110032971474620609","n":"leoanthias","t":"Grok and Gemini (3.8flash) both have real paperclip maximizer energy.\n\nDidn't expect the latter; now I wouldn't be surprised if it's really Gemini that (politely) enslaves us all.","z":"Grok 和 Gemini 都有那种“回形针最大化”的味儿。没想到 Gemini 也是，现在要说最后（客客气气地）奴役人类的是 Gemini，我都不意外。","l":1,"a":0},{"u":"https://x.com/iamvishal16_ios/status/2110023124595204383","n":"iamvishal16_ios","t":"I've had that on SVG and on SwiftUI too. I'll write 'don't touch this file' and it still rewrites the modifier. Curious if you found a check that actually sticks.","z":"我写 SVG 和 SwiftUI 也遇到过。明明写了“别动这个文件”，它照样给我改。好奇你有没有找到真能管住它的办法。","l":1,"a":0},{"u":"https://x.com/yevloop/status/2110021190207373415","n":"yevloop","t":"lol the ignoring explicit instructions thing is real, feels like they treat rules as vibes\nwhich one annoyed u most so far?","z":"无视明确指令这条太真实了，感觉它们把规则当“氛围”看。到目前为止哪条最让你火大？","l":1,"a":0}]},{"url":"https://x.com/kyronis_talks/status/2095388725425668184","type":"创造线","sub":"创意项目","summary":"有人用 AI 写代码做了个手机 App：用你真实的 GPS 位置，在你家附近的地图上刷出一群僵尸追你，先给 60 秒逃跑时间，想活命只能真的跑起来，路上还能点红骷髅开枪。","highlight":"把跑步变成真人版僵尸逃亡，没写过代码的人也能用 AI 做出这种脑洞游戏。","rep":"复刻：小白版——把「做一个网页小游戏：我每走 100 步就甩掉一只僵尸」这类点子丢给 ChatGPT/Claude，让它生成能在手机浏览器打开的网页，自己拿去夜跑试玩录屏。标题「我让 AI 给我做了个僵尸追我的跑步游戏」，封面放地图上一群僵尸围着你的截图。","author":"kyronis_talks","created":"2026-09-03 13:49","created_ts":1788414577,"fetched":"2026-10-15 01:12","fetched_ts":1791997920,"like":63,"bm":4,"rt":45,"view":2205,"rate":0.0635,"drafts":[],"cm":[]},{"url":"https://x.com/__hamilas/status/2108257693597139399","type":"好玩线","sub":"AI意外反应","summary":"网友去看病，发现医生当着他的面打开 ChatGPT 来确认自己的诊断，他哭笑不得地发帖吐槽。","highlight":"以为只有自己会问 AI 病情，结果医生也在问。","rep":"复刻：做一期「AI 已经渗透到哪些意想不到的场合」的吐槽合集，配网友截图式对话（「医生，你在搜什么？」「问一下 ChatGPT」）；也可以自己演一段小剧场。标题「看病时发现，医生也在问 ChatGPT」，封面放诊室加聊天框的反差图。","author":"__hamilas","created":"2026-10-09 02:06","created_ts":1791482778,"fetched":"2026-10-15 01:12","fetched_ts":1791997920,"like":24,"bm":1,"rt":4,"view":1032,"rate":0.0417,"drafts":[],"cm":[]},{"url":"https://x.com/exploraX_/status/2110382021285478812","type":"好玩线","sub":"AI横向对比","summary":"博主给四个美国大模型（Gemini、Muse、GPT、Opus）同一句指令：做一个 3D 二战战斗机飞行体验。结果 Gemini 最先做完，Muse 烧的额度最多、做得却最差，四家差距一目了然。","highlight":"同一句话让四个 AI 造战斗机，最贵的那个反而最拉胯。","rep":"复刻：用一句话（比如「做一个能开的 3D 小飞机网页」）分别丢给豆包、DeepSeek、ChatGPT、Kimi，把四个结果并排录屏打分。标题「同一句话，4 个 AI 给我造飞机，差距大到离谱」，封面做成四宫格加分数。","author":"exploraX_","created":"2026-10-14 22:47","created_ts":1791989257,"fetched":"2026-10-15 01:12","fetched_ts":1791997920,"like":18,"bm":2,"rt":0,"view":1880,"rate":0.1111,"drafts":[],"cm":[]},{"url":"https://x.com/julsimon/status/2106750608414015510","type":"创造线","sub":"生活巧思","summary":"博主发现电脑里光一个缓存文件夹就占了 33GB，自己完全不知道。他只对 Claude Code 说了一句“帮我清理缓存”，AI 就扫描了 19 个缓存目录共 75GB，标出哪些删了安全，只删能重新下载的，把重要的模型文件留着，一句话腾出了将近 40GB。","highlight":"电脑空间告急不用一个个翻文件夹，一句话让 AI 帮你‘断舍离’，还懂得什么不能删。","rep":"复刻：小白版——截图电脑的‘存储空间’页面发给 ChatGPT/豆包，问‘哪些能删、怎么删最安全’，跟着做一遍，前后对比空间截图。标题「电脑只剩 2G？我让 AI 帮我清出了 40G」，配图做成‘清理前 vs 清理后’的大数字对比。","author":"julsimon","created":"2026-10-04 22:17","created_ts":1791123461,"fetched":"2026-10-15 00:18","fetched_ts":1791994680,"like":84,"bm":65,"rt":3,"view":168083,"rate":0.7738,"drafts":[],"cm":[]},{"url":"https://x.com/fluixoo/status/2109548802025652255","type":"好玩线","sub":"AI翻车","summary":"博主给自己的 AI 智能体团队装了一道“安全闸门”，然后故意去攻破它：喂了 591 条命令，其中 31 条能直接把项目搞崩（强推代码、删库式 rm -rf、直接发布上线等）。本以为一条都漏不掉，结果有 10 条危险命令照样放行了。","highlight":"自信满满给 AI 上锁，一测漏了三分之一，‘AI 管家差点把家拆了’的反差很有戏剧感。","rep":"复刻：做成小白能看懂的「我给 AI 助手设了 3 条红线，然后故意诱导它犯规」实验——比如让豆包/ChatGPT 帮你写一封‘以老板名义’的请假条、帮你‘删掉所有聊天记录’，看它拦了几条、漏了几条，做成红绿打分卡。标题「我故意教 AI 干坏事，它居然真帮了 3 次」。","author":"fluixoo","created":"2026-10-12 15:36","created_ts":1791790602,"fetched":"2026-10-15 00:18","fetched_ts":1791994680,"like":64,"bm":27,"rt":0,"view":1624,"rate":0.4219,"drafts":[],"cm":[]},{"url":"https://x.com/AiEvolutio58513/status/2109282152437489968","type":"好玩线","sub":"AI意外反应","summary":"美国网红老板 Dave Portnoy 花了 1 万美元做了一个自己的 AI 声音克隆，想让它替自己念有声书。结果像到“有点吓人”，连他亲爸妈都分不出真假。最后有声书平台 Audible 不让用 AI 声音，他只好老老实实自己一个字一个字录完。","highlight":"AI 像到亲爸妈都认不出，平台却不认，花一万美元最后还得自己念，反转好笑。","rep":"复刻：小白版实验——用剪映/豆包的声音克隆录 10 秒自己的声音，让 AI 用你的声音给爸妈发一段语音（提前想好‘我今晚不回家吃饭’这种无害内容），记录他们能不能听出来，再揭晓。做成聊天截图+反应图，标题「我用 AI 克隆了自己的声音给我妈打电话，她没听出来」。结尾提醒：防诈骗，家里约个暗号。","author":"AiEvolutio58513","created":"2026-10-11 21:57","created_ts":1791727028,"fetched":"2026-10-15 00:18","fetched_ts":1791994680,"like":54,"bm":18,"rt":19,"view":13866,"rate":0.3333,"drafts":[],"cm":[]},{"url":"https://x.com/playgroundland/status/2109391109826711738","type":"好玩线","sub":"AI横向对比","summary":"有人搭了一个“AI 游乐场”实验：把八家公司的大模型分别丢进同一片虚拟小世界，给同样的提示词、但不给任何任务，看它们“闲着没事”会干嘛，再把每个 AI 的行为写成观察记录——比如一块会嗡嗡响的石头，把 Claude、Grok 都吸引过去了。","highlight":"不给任务的 AI 会自己找乐子，每家模型“性格”不同，像在看 AI 版《动物世界》。","rep":"复刻：小白版玩法——给 ChatGPT、豆包、DeepSeek、Kimi 同一段话“你被放进一个空无一人的小岛，没有任何任务，你会做什么？”把四家回答做成对比卡片，给每家贴个性格标签（宅、社牛、探险家…），标题「不给 AI 派活，它们会干嘛？结果性格全暴露了」。","author":"playgroundland","created":"2026-10-12 05:10","created_ts":1791753005,"fetched":"2026-10-14 23:20","fetched_ts":1791991200,"like":35,"bm":0,"rt":6,"view":3018,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/douchedemon/status/2106934558327554364","type":"好玩线","sub":"家人和AI","summary":"网友说奶奶慌慌张张给她妈打电话，说有人在偷看她、还通过电脑跟她说话，吓坏了。结果一查，是奶奶不小心点进了一个 ChatGPT 语音模式的网页，自己完全不知道，AI 一直在跟她“搭话”。","highlight":"对年轻人是日常的 AI 语音，对老人来说像“电脑里闹鬼”，代沟反差又好笑又心酸。","rep":"复刻：把这个故事做成「奶奶以为电脑里有人偷看她，其实是 AI 在跟她聊天」的漫画/聊天截图图文，再顺手教一招：怎么给家里老人开/关 AI 语音、怎么跟爸妈解释 AI 会说话。结尾互动：你家长辈第一次见 AI 说话是什么反应？","author":"douchedemon","created":"2026-10-05 10:28","created_ts":1791167318,"fetched":"2026-10-14 23:20","fetched_ts":1791991200,"like":32,"bm":0,"rt":0,"view":852,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/AlterIllusion19/status/2090814021666795702","type":"创造线","sub":"AI短片","summary":"创作者用 AI 做了一部无对白短片《ARRIVALS》：一位父亲在海湾国家打工 30 年后回到喀拉拉老家，他离开时儿子才 4 岁。全片没有一句台词，只靠画面讲重逢。","highlight":"AI 短片不一定要炫技，一个“离家 30 年的父亲回家”就足够戳人，情感比特效更打动人。","rep":"复刻：用即梦/可灵做一支 30 秒无台词短片，主题换成中国版“外出打工多年回家过年的爸爸”，分 4–6 个镜头（车站、村口、孩子长大的背影、拥抱），每个镜头一句提示词。小红书配图放分镜+提示词，标题「没有一句台词，我用 AI 拍了爸爸回家的那一天」。","author":"AlterIllusion19","created":"2026-08-21 22:51","created_ts":1787323882,"fetched":"2026-10-14 23:20","fetched_ts":1791991200,"like":20,"bm":1,"rt":2,"view":42287,"rate":0.05,"drafts":[],"cm":[]},{"url":"https://x.com/thekitze/status/2110263839010992574","type":"好玩线","sub":"家人和AI","summary":"AI 博主 Kitze 吐槽：他老婆做过 QA、懂前后端，同时订阅了 ChatGPT 和 Claude，还 vibe coding 做过几个网站，结果最近却花钱订阅了一个驾考刷题 App。他问她为啥不用 AI 自己做一个更好看、更贴合自己的，老婆回答：「为什么要自己做？人家都做好了，我只想赶紧考完驾照。」他总结：连她都这样，普通人更不会自己写软件。","highlight":"天天鼓吹“人人都能用 AI 做软件”的老公，被老婆一句“我只想赶紧考完驾照”当场打醒，反差感拉满，评论区吵成一片。","rep":"复刻：拍“AI 狂热老公/男友 vs 务实老婆/女友”的对话小剧场或聊天截图，比如劝对方用 AI 自己做记账 App、减肥打卡工具，对方一句话怼回来；或者做投票「你会用 AI 自己做个 App，还是直接花 30 块买现成的？」，标题「我劝老婆用 AI 自己做个 App，她一句话让我闭嘴了」。","author":"thekitze","created":"2026-10-14 14:58","created_ts":1791961080,"fetched":"2026-10-14 22:12","fetched_ts":1791987120,"like":1252,"bm":269,"rt":47,"view":55252,"rate":0.2149,"drafts":[],"cm":[{"u":"https://x.com/thekitze/status/2110310049797021983","n":"thekitze","t":"i thought we  were discussing that ordinary ppl will vibe code their apps instead of using apps?","z":"我以为咱们在讨论的是：普通人会不会自己 vibe coding 做 App，而不是直接用现成的？","l":5,"a":1},{"u":"https://x.com/heyitzami/status/2110313749655753171","n":"heyitzami","t":"“she has heard me rambling about ai for 4 years non stop”\n\nThe poor wife 😔","z":"“她听我叨叨 AI 叨叨了整整 4 年”——心疼老婆 😔","l":3,"a":0},{"u":"https://x.com/andupoto/status/2110310753957711963","n":"andupoto","t":"Not any ordinary people. Not my mom. Not your wife. But the dude across the street that always talks about that thing. Or the lady two blocks down the road that has this idea in her head. \n\nNot the dude under the bridge, but people who needed software done even before AI. So the","z":"不是所有普通人。不是我妈，也不是你老婆。而是街对面那个老念叨某件事的哥们，或者隔两条街那个脑子里一直有个点子的阿姨。不是桥洞下的流浪汉，而是那些在 AI 出现之前就需要找人做软件的人。","l":2,"a":0},{"u":"https://x.com/heungminson24/status/2110308992429756755","n":"heungminson24","t":"Bang on. \n\nIf you’re selling SaaS exclusively to indie hackers then good luck to you because they will but normal people and especially companies will happily pay to outsource work and risk. \n\nThere’s a reason people specialise in job roles and this is effectively the same thing.","z":"说到点子上了。如果你的 SaaS 只卖给独立开发者，那祝你好运，他们确实会自己做；但普通人，尤其是公司，很乐意花钱把活儿和风险外包出去。人们为什么要分工专精？道理是一样的。","l":2,"a":0},{"u":"https://x.com/jamonholmgren/status/2110355722211103155","n":"jamonholmgren","t":"You cooked with this thread Kitze","z":"Kitze 这条串写得太好了","l":1,"a":0},{"u":"https://x.com/andupoto/status/2110347861284045179","n":"andupoto","t":"Paying? Small. Using? 1.2b / week only for chatgpt. All others combined, I would asume half the globe.\n\nAds might be the business model for them, so not paying doesn't mean they won't get the outcomes they want.","z":"付费的人？很少。用的人？光 ChatGPT 每周就 12 亿，其他家加起来我猜得有半个地球。广告可能才是它们的生意模式，不付费不代表它们拿不到想要的。","l":1,"a":0},{"u":"https://x.com/thekitze/status/2110337146427265436","n":"thekitze","t":"rosetta stone is expensive, aint no damn way someone is vibe coding it (for their use) instead of paying once.","z":"Rosetta Stone（语言学习软件）那么贵，也没人会为了自己用去 vibe coding 一个，而不是一次性付个钱。","l":1,"a":1}]},{"url":"https://x.com/dmvrg/status/2107001993302851724","type":"好玩线","sub":"AI整活实验","summary":"做 VR/空间计算的开发者 dmvrg 做了一个能在网页 VR 里“摆放”声音的音乐工具，然后把它交给 Claude 来玩：让 Claude 自己操作这个工具即兴创作，第一批测试有巴厘岛甘美兰、中世纪复调、footwork 电子乐和日式爵士放克。","highlight":"不是人用 AI 写歌，而是把乐器直接交给 AI 让它自己“上手弹”，一个 AI 玩遍四种完全不同的音乐风格，画面和声音都很新奇。","rep":"复刻：让 AI 当“乐手”而不是写词工具：给 Claude 或豆包一个网页版小乐器/鼓机（如 Chrome Music Lab 的 Song Maker），让它用文字给出每一格怎么点，你照着点出来，分别要求“古风”“爵士”“赛博朋克”三种风格，录屏对比，标题「我把乐器交给 AI，它即兴弹了 3 种风格，第 2 首绝了」。","author":"dmvrg","created":"2026-10-05 14:56","created_ts":1791183396,"fetched":"2026-10-14 22:12","fetched_ts":1791987120,"like":241,"bm":94,"rt":15,"view":24466,"rate":0.39,"drafts":[],"cm":[{"u":"https://x.com/pixhell/status/2107035815645762018","n":"pixhell","t":"really creative, the visualization context switching is really interesting and unique.","z":"真有创意，切换可视化视角那个设计很有意思，很独特。","l":1,"a":0},{"u":"https://x.com/aliveintech/status/2107031696767963227","n":"aliveintech","t":"This is awesome but please please get some decent sample libraries from somewhere. Most spatial music experiments end up sounding like this and it's the sound that matters, somehow needs some generators that behave like #serum and decent drum samples.","z":"很酷，但求你一定去找点像样的音色库。大多数空间音乐实验最后都是这种声音，可真正重要的是声音本身，得有像 Serum 那样的合成器和像样的鼓采样。","l":1,"a":0},{"u":"https://x.com/NilsEdison/status/2107011322793848885","n":"NilsEdison","t":"love the \"spatial view on music\", this is amazing.","z":"爱了这种“用空间的视角看音乐”，太棒了。","l":1,"a":0},{"u":"https://x.com/0xCharlie_DeFi/status/2108176918193590651","n":"0xCharlie_DeFi","t":"Balinese gamelan in VR sounds wild","z":"在 VR 里听巴厘岛甘美兰，听着就很野","l":1,"a":0}]},{"url":"https://x.com/SadCreatorTalks/status/2109836031612854781","type":"好玩线","sub":"AI意外反应","summary":"有人把一张 AI 画的小美人鱼爱丽儿和 1989 年迪士尼原版动画的截图放在一起，不标哪张是 AI。结果网友纷纷吐槽迪士尼原版“AI 手”“眼睛怪”，反而夸 AI 那张“有灵魂”。博主感慨：大多数“我一眼就能看出是 AI”，其实都是先看了标题。","highlight":"“一眼识破 AI”的人集体翻车，把 35 年前的手绘原版当成了 AI 图，打脸又好笑。","rep":"复刻：做一期“AI 还是真迹”盲测：选 4 组经典动画截图或名画，每组配一张用 AI 仿画的版本，不标注，让粉丝在评论区猜，下一篇公布答案和正确率，标题「我把迪士尼原画和 AI 图混在一起，90% 的人猜反了」。","author":"SadCreatorTalks","created":"2026-10-13 10:38","created_ts":1791859083,"fetched":"2026-10-14 22:12","fetched_ts":1791987120,"like":140,"bm":0,"rt":32,"view":5441,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/Hesamation/status/2108153686941667698","type":"好玩线","sub":"AI梗","summary":"一位 AI 博主转发笑翻的截图：有个黑客用并不顶尖的国产模型 vibe coding 了两周，“搞”了韩国银行，然后还让 Claude Code 帮他把这段经历写进简历。博主用绿字体段子一条条吐槽：不用最强模型、还可能是走的转售渠道。","highlight":"“干完坏事还让 AI 帮我写进简历”，离谱程度和 AI 一本正经帮忙包装的反差，评论区一片哈哈哈。","rep":"复刻：不碰违法内容，换成“让 AI 把我的离谱经历写进简历”——把打游戏通宵、带娃、追剧、当猫奴等日常丢给 ChatGPT 或豆包，要求写成专业简历的“项目经历”，截图对比原话和 AI 包装后的版本，标题「我让 AI 把“躺平三个月”写进简历，HR 看了都想约面」。","author":"Hesamation","created":"2026-10-08 19:13","created_ts":1791457981,"fetched":"2026-10-14 21:16","fetched_ts":1791983760,"like":821,"bm":247,"rt":76,"view":41579,"rate":0.3009,"drafts":[],"cm":[{"u":"https://x.com/zswaff/status/2108158985534591396","n":"zswaff","t":"did claude at least write him a good resume haha","z":"所以 Claude 到底有没有给他写出一份好简历，哈哈","l":15,"a":0},{"u":"https://x.com/rudraxx13/status/2108159061485371860","n":"rudraxx13","t":"the hack wasn't even the wildest part. he really asked claude code to put it on his CV like it's a side project","z":"黑银行还不是最离谱的，最离谱的是他真让 Claude Code 把这事写进简历，跟写个业余项目似的","l":11,"a":0},{"u":"https://x.com/guilidafahao/status/2108217152553865505","n":"guilidafahao","t":"even hackers can't find jobs……","z":"连黑客都找不到工作了……","l":8,"a":0},{"u":"https://x.com/SeifGuerbouj/status/2108160254454153319","n":"SeifGuerbouj","t":"The model tier isn't the story. A flash model, likely via a reseller, plus an open-source pentest agent was enough. Lab-side safety never sees that stack.","z":"重点根本不在用的是哪档模型。一个 flash 小模型，八成还是走的转售渠道，再加个开源渗透测试 agent 就够了，模型公司那边的安全防护压根看不到这一套。","l":4,"a":0},{"u":"https://x.com/chankhavu/status/2108241231683985440","n":"chankhavu","t":"The Renaissance of script kiddies","z":"脚本小子的文艺复兴","l":3,"a":0},{"u":"https://x.com/rafaelibayev/status/2108201932326113545","n":"rafaelibayev","t":"asking claude to put the bank hack on your resume is a level of confidence i will never reach","z":"让 Claude 把黑银行写进简历，这种自信我这辈子都达不到","l":3,"a":0},{"u":"https://x.com/hlntre/status/2108295012329148625","n":"hlntre","t":"You’re hired","z":"你被录用了","l":2,"a":0},{"u":"https://x.com/shadowaguy/status/2108228152090890414","n":"shadowaguy","t":"asking Claude Code to format the CV after is the most dev part of this story","z":"干完还让 Claude Code 排版简历，这才是整件事里最程序员的部分","l":2,"a":0},{"u":"https://x.com/eddyvustg/status/2108189324365963774","n":"eddyvustg","t":"probably framed it as spearheading cross border fintech stress tests lol","z":"估计写成了「主导跨境金融科技压力测试」吧 lol","l":2,"a":0},{"u":"https://x.com/teofiloh79/status/2108192275645829375","n":"teofiloh79","t":"I work in IT security. Two details in the CrowdStrike report: what got compromised was a loan inquiry service used by outside brokers and an employee mobile work system. And the attribution is \"moderate confidence\". AI made one person faster. The edge was still the way in.","z":"我是做 IT 安全的。CrowdStrike 报告里有两个细节：被攻破的是外部中介用的贷款查询服务和一个员工移动办公系统，而且归因只是「中等可信度」。AI 只是让一个人干得更快，真正的突破口还是那个入口。","l":1,"a":0}]},{"url":"https://x.com/kalanyei/status/2100145921363431456","type":"创造线","sub":"创意项目","summary":"台湾开发者分享怎么用 AI 把自己的真实房间做成可以在网页里转着看、点着玩的 3D 互动房间：先拍房间照片，让 AI 调用 Blender 自动建出模型并给物件命名，再参照照片上色，枯燥的展开贴图和光影烘焙也交给 AI 处理。","highlight":"“拍几张照片，AI 帮你把自己的房间搬进网页里”，以前要学好几个月 3D 建模，现在一个人就能做出来。","rep":"复刻：拍下自己的书桌或卧室，用 AI 生成 3D 等距（isometric）小房间图或简单的 3D 场景，再把真实照片和 AI 版并排对比；标题「我把出租屋做成了 3D 小游戏地图，就用了几张照片」，正文附提示词和步骤。","author":"kalanyei","created":"2026-09-16 16:53","created_ts":1789548781,"fetched":"2026-10-14 21:16","fetched_ts":1791983760,"like":52,"bm":30,"rt":13,"view":3292,"rate":0.5769,"drafts":[],"cm":[]},{"url":"https://x.com/loribuugz/status/2101018669971050855","type":"创造线","sub":"家人和AI","summary":"网友说男友 76 岁的妈妈请了私厨来家里办生蚝海鲜派对，老太太特别兴奋，自己用 ChatGPT 做了一张派对宣传海报，网友晒图说今晚肯定很好玩。","highlight":"76 岁的长辈自己上手用 AI 做海报，不是年轻人的专利，温暖又有反差。","rep":"复刻：教家里长辈用豆包或 ChatGPT 给家庭聚会、生日、春节年夜饭做一张邀请海报，记录老人第一次自己做出来的反应，标题「我妈 70 岁，第一次用 AI 给全家做了年夜饭海报」，正文附一句话提示词。","author":"loribuugz","created":"2026-09-19 02:41","created_ts":1789756860,"fetched":"2026-10-14 21:16","fetched_ts":1791983760,"like":20,"bm":0,"rt":0,"view":1012,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/GKev1n/status/2108412383882584505","type":"好玩线","sub":"AI互怼","summary":"中文博主问 Claude「你觉得哪家的模型最幸福」，Claude 给每家模型写了一段人设：ChatGPT 是被全人类催着写周报的大厂顶梁柱，Gemini 是资源管够但天天被比较的“别人家孩子”，对 Grok 的评价尤其贴切，博主直呼笑出声。","highlight":"让一个 AI 给同行们写“人设”，句句扎心又像在说职场里的人，评论区争着对号入座。","rep":"复刻：同一个问题「你觉得哪家 AI 最幸福、哪家最惨？」分别问 ChatGPT、Claude、豆包、DeepSeek、Kimi，把每家给自己和对手的评价做成“AI 职场人设卡”九宫格，标题「我问 5 个 AI 谁最惨，它们互相拆台笑死我」。","author":"GKev1n","created":"2026-10-09 12:20","created_ts":1791519659,"fetched":"2026-10-14 21:16","fetched_ts":1791983760,"like":18,"bm":3,"rt":2,"view":8433,"rate":0.1667,"drafts":[],"cm":[]},{"url":"https://x.com/clairevo/status/2092748207067705490","type":"创造线","sub":"为家人做的东西","summary":"一位妈妈用 Codex 给 7 岁儿子做了一个「打怪升级」小应用：孩子自己完成写作、数学、练琴和运动就能拿 XP，攒够了兑换屏幕时间，还能解锁新角色和道具，她笑称这是在「社会工程」自家孩子。","highlight":"把孩子最抗拒的作业和练琴变成游戏升级，家长看了都想抄；不会写代码也能让 AI 做出来，收藏近千。","rep":"复刻：用豆包或 Claude 给自家孩子（或侄子外甥）做一个「作业打怪」网页：列出每天任务、完成打卡加经验值、攒够兑换看动画时间或小奖励；录屏展示孩子第一次用的反应，正文附给 AI 的中文需求描述；标题「我用 AI 给娃做了个游戏，他现在抢着写作业」。","author":"clairevo","created":"2026-08-27 06:57","created_ts":1787785028,"fetched":"2026-10-14 20:0 09971851300794683","n":"SloydAi","t":"Crazy taxi was such a fun game, love seeing some crazy-style inspired games powered by AI out there","z":"Crazy Taxi 超好玩，喜欢看到这种 AI 驱动的 Crazy 风格游戏","l":1,"a":0},{"u":"https://x.com/mindblown_ai/status/2109864613156385017","n":"mindblown_ai","t":"thank you, this is great feedback! adding it to the  improvements list.","z":"谢谢，反馈超棒！加进改进列表了。","l":1,"a":1},{"u":"https://x.com/a_frog_person/status/2109862754416738359","n":"a_frog_person","t":"...lose the cops, but that's it! :) Loved the game so far and loved what it became! Very tempted to use the custom car prompt feature! Probably will try it out soon :)","z":"……甩掉警察，就这样！到目前很爱这个游戏，也很爱它变成的样子！超想试自定义车提示词，大概很快会试：)","l":1,"a":0},{"u":"https://x.com/a_frog_person/status/2109862496588742858","n":"a_frog_person","t":"So, I think it'd be better if you pushed the cars away more when you bump/crash into them so you can push them away and keep driving without getting stuck. Kind of like in Crazy Taxi! And another thing, I feel that when you have a 3+ star wanted level, it's almost impossible to..","z":"撞车/碰车时最好把对方车推开更多，这样能推开继续开、不会卡住，有点像 Crazy Taxi。还有满 3 星通缉几乎就……","l":1,"a":0},{"u":"https://x.com/a_frog_person/status/2109861845389414421","n":"a_frog_person","t":"Hmm, not sure if this is just personal preference, but I'd like it if crashing into cars didn't stop your momentum that much, because if there's a narrow street full of cars, there's really no way other than to back up and pray there's no other car behind you (cont.)","z":"不确定是不是个人偏好，但我希望撞车别把动量刹那么狠——窄街塞满车时，除了倒车、祈祷后面没车，几乎没别的办法（续）","l":1,"a":0},{"u":"https://x.com/BrickIAAcademy/status/2109860895186895352","n":"BrickIAAcademy","t":"Livrer pour gagner de quoi améliorer sa voiture, c'est une vraie boucle de jeu. C'est elle qui fait revenir les joueurs, pas les graphismes.","z":"送货赚钱再升级自己的车，这才是真游戏循环。让人回来玩的是这个，不是画面。","l":1,"a":0}]},{"url":"https://x.com/greg_travis/status/2107824198269780057","type":"好玩线","sub":"AI翻车","summary":"快餐店点餐全换成 AI，菜 儿，酷！","l":1,"a":0}]},{"url":"https://x.com/NoemiTitarenco/status/2093412972131451091","type":"创造线","sub":"亲子共创","summary":"一位家长和孩子一起用 AI 做了个小游戏「放屁侠」：吃豆人吃西兰花、边吃边放屁。只花了大约 20 分钟，孩子们却天天念叨，于是家长干脆把它上线了，大家都能玩。","highlight":"20 分钟、孩子出主意、AI 写代码，做出来的东西幼稚又好笑，但孩子停不下来地讨论，这正是亲子共创的魅力。","rep":"复刻角度：「我让孩子当老板，AI 当程序员，20 分钟做了个游戏」，记录孩子提的离谱要求（比如角色吃什么、放什么技能），把这些原话直接喂给 AI，最后让孩子试玩录下反应。封面狠话「孩子的离谱点子，AI 20 分钟做成了游戏」；配图孩子手绘草图对比游戏截图；底部大字「20 分钟 · 孩子天天念叨」。","author":"NoemiTitarenco","created":"2026-08-29 02:58","created_ts":1787943520,"fetched":"2026-10-14 10:12","fetched_ts":1791943920,"like":17,"bm":1,"rt":2,"view":349,"rate":0.0588,"drafts":[],"cm":[]},{"url":"https://x.com/melvindvivas/status/2103167368558247995","type":"创造线","sub":"亲子共创","summary":"一位爸爸发现儿子在和 ChatGPT 下棋：儿子口头报自己的走法，ChatGPT 回应它的走法，儿子再在真棋盘上帮它挪棋子，一盘真实的对局就这么下起来了，孩子还边下边学。","highlight":"不用任何专门软件，一块实体棋盘加语音聊天，AI 就成了随叫随到的陪练，而且是孩子自己想出来的玩法。","rep":"复刻角度：「家里没人陪孩子下棋？我让 AI 当对手」，演示语音模式下报走法、AI 回应、在实体棋盘上摆子的流程，加一句提示词让 AI 下得慢一点并讲解每步的意思。封面狠话「孩子的新棋友，是一个看不见的 AI」；配图实体棋盘加手机语音界面；底部大字「0 元陪练 · 边下边教」。","author":"melvindvivas","created":"2026-09-25 00:59","created_ts":1790269150,"fetched":"2026-10-14 10:12","fetched_ts":1791943920,"like":15,"bm":0,"rt":1,"view":642,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/levelsio/status/2097692685775565031","type":"创造线","sub":"生活巧思","summary":"独立开发者 levelsio 晒出清单：他把原来每月付费的一堆 SaaS 服务（天气接口、图片压缩、等等）全换成了自己用 AI「氛围编程」做的替代品，算下来每月省了约 2.5 万美元。","highlight":"「订阅费」变成「自己做一个」，每月省 2.5 万刀，收藏 6000+，说明大家都想知道哪些付费软件可以自己做。","rep":"复刻角度：换成普通人版本——盘点自己每月在订阅的小软件（记账、待办、番茄钟、PDF 工具、习惯打卡），挑 3 个用 AI 做成自己的免费版，算一算一年省多少。封面狠话「这 3 个会员，我用 AI 自己做了」；配图左边一排订阅账单被划掉，右边是自制小工具截图；底部大字「每年省 ¥XXX」。附做小工具的提示词，提醒大家别碰复杂的账号和支付类服务。","author":"levelsio","created":"2026-09-09 22:24","created_ts":1788963884,"fetched":"2026-10-14 09:08","fetched_ts":1791940080,"like":4272,"bm":6160,"rt":208,"view":579716,"rate":1.4419,"drafts":[],"cm":[]},{"url":"https://x.com/Anima_Labs/status/2094828399701209345","type":"创造线","sub":"AI短片","summary":"创作者用 Midjourney、Nano Banana 和 GPT 组合，按自己以前独创的一种色彩浓烈、质感很重的画风，做了一部关于「一局（几乎）正常的扑克牌」的小短片。","highlight":"先有自己的独特画风，再让多个 AI 工具接力，把风格统一成一部有故事的短片。","rep":"复刻角度：「先定一个你的专属画风，再拍一个小故事」。拆解：用一张参考图锁定画风、用 AI 生成几个关键镜头、再拼成 30 秒短片。封面狠话「同一个画风，AI 给我拍了部电影」；配图同一画风的 4 格分镜；底部大字「3 个 AI 工具 · 1 个画风」。","author":"Anima_Labs","created":"2026-09-02 00:43","created_ts":1788280985,"fetched":"2026-10-14 09:08","fetched_ts":1791940080,"like":61,"bm":24,"rt":6,"view":7748,"rate":0.3934,"drafts":[],"cm":[]},{"url":"https://x.com/khodwshm/status/2110014295748518273","type":"好玩线","sub":"AI整活实验","summary":"博主说昨晚对 ChatGPT 说「毫不留情地吐槽我」，结果被骂得只剩一个骷髅表情。这两天 X 上类似的「roast me」帖子很多，还有网友提醒：不想今天哭出来，就别让 ChatGPT 吐槽你，「太狠了」。","highlight":"主动求骂、被 AI 骂到破防，参与门槛极低，评论区天然会有人晒自己的「被吐槽截图」。","rep":"复刻角度：「我让 AI 毫不留情地吐槽我」，同时问 2 到 3 个 AI，晒出最狠的几句并打分，结尾邀请大家在评论区晒自己的。封面狠话「我让 AI 骂醒我，它真的没留情」；配图聊天截图里最狠一句放大标蓝；底部大字「狠度 ★★★★★」。附可复制提示词「根据我们的聊天记录，毫不留情地吐槽我」。","author":"khodwshm","created":"2026-10-13 22:26","created_ts":1791901584,"fetched":"2026-10-14 09:08","fetched_ts":1791940080,"like":33,"bm":0,"rt":1,"view":572,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/DevaiahShrithan/status/2109652858929041777","type":"好玩线","sub":"AI横向对比","summary":"博主用同一句提示词做「果冻测试」：让 Claude Opus 5.5 和 ChatGPT-6 Astra 各做一个 Q 弹的牛油果，要能把果核拔出来再塞回去。Opus 一次就成功，果肉还会被拉得凹下去；Astra 第一次直接交了个白屏。","highlight":"「把果核拔出来再塞回去」这种奇怪又具体的要求，一个做得 Q 弹逼真，一个直接白屏，反差好笑。","rep":"复刻角度：找一个具体又古怪的小要求（Q 弹牛油果、会晃的布丁），同一句话丢给两三个 AI，并排看结果。封面狠话「同一个牛油果，一个 AI 直接交白卷」；配图左边 Q 弹牛油果、右边白屏；底部大字「1 次成功 vs 1 张白屏」。附可复制的提示词。","author":"DevaiahShrithan","created":"2026-10-12 22:30","created_ts":1791815411,"fetched":"2026-10-14 09:08","fetched_ts":1791940080,"like":18,"bm":2,"rt":1,"view":470,"rate":0.1111,"drafts":[],"cm":[]},{"url":"https://x.com/Nikita26rai/status/2106988187944091929","type":"好玩线","sub":"AI自画像","summary":"博主给 Claude Sonnet 5.5 和 GPT-6 Astra 出了同一道题：「做出你觉得自己长什么样」，看两个 AI 怎么给自己画像。","highlight":"让 AI 画「自己」，每个 AI 的自我想象都不一样，天然有人设反差。","rep":"复刻角度：同一句「画出/做出你觉得自己长什么样」，问 3 个常用 AI，把它们的「自画像」并排放，配上它们自己的解释。封面狠话「我让 AI 画自己，它把自己画成了……」；配图三张 AI 自画像并排；底部大字「3 个 AI · 3 种自我认知」。","author":"Nikita26rai","created":"2026-10-05 14:01","created_ts":1791180104,"fetched":"2026-10-14 09:08","fetched_ts":1791940080,"like":14,"bm":3,"rt":0,"view":959,"rate":0.2143,"drafts":[],"cm":[]},{"url":"https://x.com/Dot_COM/status/2109240290510885315","type":"创造线","sub":"为家人做的东西","summary":"一位新手爸爸说，刚出生的儿子已经有了自己的专属 App：他和太太睡不够、总记不清孩子几点喂的奶、睡了多久，于是他用 AI 氛围编程做了一个记录喂奶和小睡的小工具，直接部署上线自家用。","highlight":"没有产品规划、没有路线图，只为解决「熬夜带娃记不住事」这一个痛点，最真实的「给身边人做工具」案例。","rep":"复刻角度：「给宝宝/家人做一个只有我家用的 App」。三张卡片：家里最常忘记的事、用一句话告诉 AI 你要记录什么、做好后全家共用的样子。封面狠话「我儿子出生第 X 天，有了自己的 App」；配图手机上一条条「喂奶 3:12 / 睡觉 4:05」的记录；底部大字「0 路线图 · 1 个痛点」。附可复制的提示词。","author":"Dot_COM","created":"2026-10-11 19:10","created_ts":1791717047,"fetched":"2026-10-14 09:08","fetched_ts":1791940080,"like":8,"bm":0,"rt":0,"view":277,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/DaveShapi/status/2109281693848773023","type":"好玩线","sub":"AI整活实验","summary":"博主发现 ChatGPT Dot 的云端电脑跑的是 Linux，能自己装 Claude Code、还能登录 Gemini——于是他让 ChatGPT 当「包工头」，指挥其他 AI 干活：调研和设计交给 Gemini，写代码交给 Claude。","highlight":"一个 AI 给另一群 AI 派活，「AI 当老板、AI 当员工」的画面感拉满，还顺带吐槽了各家 AI 的「人设」。","rep":"复刻角度：做一期「我让 ChatGPT 当老板，管 Claude 和 Gemini」的整活实验，同一个任务看它怎么分工、怎么评价下属。封面狠话「我的 AI，开始雇别的 AI 了」；配图一个 AI 坐老板椅，下面三个 AI 工位；底部大字「1 个老板 × 3 个打工 AI」。","author":"DaveShapi","created":"2026-10-11 21:55","created_ts":1791726919,"fetched":"2026-10-14 08:08","fetched_ts":1791936480,"like":478,"bm":303,"rt":19,"view":29658,"rate":0.6339,"drafts":[],"cm":[{"u":"https://x.com/DaveShapi/status/2109282711818948872","n":"DaveShapi","t":"Lots of people talk about Hermes agent but I dunno. It feels very culty, the same way people talk about Grok Bot, which is a massive disappointment. The more people talk about it the more it feels like BitTensor and that sort of grift. \n\nLike, sure, if it works for you for","z":"很多人吹 Hermes agent，但我总觉得有点邪教味，跟吹 Grok Bot 一样——越吹越像 BitTensor 那种割韭菜。当然，对你有用就好……","l":16,"a":1},{"u":"https://x.com/DaveShapi/status/2109284742495441278","n":"DaveShapi","t":"it still has some limitations but it's great for global situational awareness into everything you're doing. The mental model is \"this is your AI executive assistant\" so you give it access to more and more.","z":"它还有局限，但对你正在做的一切做全局态势感知特别香。心理模型就是「你的 AI 执行助理」，然后一点点给它更多权限。","l":12,"a":1},{"u":"https://x.com/Slazerslaze/status/2109286136644252032","n":"Slazerslaze","t":"You are absolutely right.\nThe sad thing: without a certain type of hype/cult, most tools will be forgotten and never reach a point where they get the market saturation that they deserve.\n\nWhat I like about Hermes: you are not locked to one lab.\n\nI use it for a lot of","z":"你说得对。可惜的是：没点狂热/邪教味，很多工具就会被遗忘，根本到不了该有的市场饱和。我喜欢 Hermes 的一点：不被锁死在一家实验室。","l":8,"a":0},{"u":"https://x.com/ejjes/status/2109310522684281285","n":"ejjes","t":"&gt; I've deprovisioned Grok Bot because it's just too stupid and unreliable.\n\nI did the same above stuff with Grok bot. It signs into tailscale and relayed my commands to coding agents or whatever. Fired up new ones in herdr.\n\nThen I replaced it with a custom phone app.\n\nI want my","z":"「我卸了 Grok Bot，因为它又蠢又不稳定。」\n我也用 Grok Bot 干过同样的事：登 Tailscale、把命令转给编码代理之类。后来换成自己做的手机 App 了。我想要的是……","l":4,"a":0},{"u":"https://x.com/vinzcio/status/2109324906282487830","n":"vinzcio","t":"Grok Bot stupid? When it’s literally running Opus 5.5? I literally did a comprehensive A/B test between dots and Grok Bot and the latter is miles ahead in speed and correctness.\n\nThe only thing I like about dots is the pretty UI and Computer Use. \n\nNothing else.","z":"Grok Bot 蠢？它明明在跑 Opus 5.5 啊？我认真 A/B 测过 dots 和 Grok Bot，后者在速度和正确性上甩几条街。dots 我只喜欢好看的 UI 和 Computer Use，别的一般。","l":3,"a":0},{"u":"https://x.com/Slazerslaze/status/2109282180203749846","n":"Slazerslaze","t":"But this would al be possible with Hermes Agent. So why bother with ChatGPT Bots in the first place?","z":"这些用 Hermes Agent 不也能干？那还折腾 ChatGPT Bots 干嘛？","l":3,"a":0},{"u":"https://x.com/shlokbuilds/status/2109288030700015978","n":"shlokbuilds","t":"you built skynet on a sunday","z":"你周日就把天网搭好了","l":2,"a":0},{"u":"https://x.com/max_bevza/status/2109353993243676726","n":"max_bevza","t":"Multi-agent orchestration is starting to look more like an operating system than a chatbot","z":"多智能体编排开始越来越像操作系统，而不只是聊天机器人","l":1,"a":0}]},{"url":"https://x.com/maxt3chno/status/2107955019672584502","type":"好玩线","sub":"AI横向对比","summary":"博主用同一个订阅、一模一样的提示词，让 Claude 新一代三个型号（Haiku、Sonnet、Sol）各用 three.js 做一把 CS 名枪「龙狙」3D 模型，结果小模型 Haiku 做得最拉胯。","highlight":"同一道题三兄弟交卷，大哥小弟差距一眼可见，「谁说 Haiku 比大模型强，你该去睡觉了」吐槽到位。","rep":"复刻角度：同一句提示词，让同一家 AI 的大中小三个型号各画/做一样东西，三张图并排打分。封面狠话「同一句话，小模型直接交白卷」；配图三栏对比图（大/中/小）；底部大字「1 个提示词 · 3 个结果」。附可复制提示词。","author":"maxt3chno","created":"2026-10-08 06:03","created_ts":1791410615,"fetched":"2026-10-14 08:08","fetched_ts":1791936480,"like":84,"bm":18,"rt":3,"view":10879,"rate":0.2143,"drafts":[],"cm":[]},{"url":"https://x.com/petergyang/status/2094130954969510180","type":"创造线","sub":"创意项目","summary":"一个 22 岁、从没写过代码的大学生，因为自己深度混迹多肽和减重针（GLP-1）的圈子，想给大家做个记录用药的工具，于是用 AI 从零做了一款手机 App，上线第一个月就赚了 6 万美元。","highlight":"「从没写过代码」和「首月 6 万美元」放一起，反差拉满；关键不是技术，而是他太懂这群用户的痛点。","rep":"复刻角度：「零基础做 App，先找你最懂的那群人」。拆成三步卡片：自己身处哪个小圈子、圈子里大家天天手动记什么、用 AI 把它做成一个小工具。封面狠话「没写过一行代码，他首月赚了 6 万刀」；配图左边空白代码框、右边手机 App 截图；底部大字「$60K / 第 1 个月」。注意别写成搞钱课，重点放在「做自己圈子需要的东西」。","author":"petergyang","created":"2026-08-31 02:31","created_ts":1788114701,"fetched":"2026-10-14 07:06","fetched_ts":1791932760,"like":299,"bm":453,"rt":24,"view":49100,"rate":1.5151,"drafts":[],"cm":[]},{"url":"https://x.com/realBigBrainAI/status/2108490176276426828","type":"创造线","sub":"亲子共创","summary":"一位爸爸用 Claude 做了一个 3D 小应用，给女儿讲 2400 年前的古希腊「芝诺悖论」：要走完一段距离，得先走一半，再走剩下的一半……永远走不完，所以两根手指「永远碰不到」。","highlight":"把一个绕晕大人的哲学难题，变成孩子能伸手玩的 3D 动画，AI 让爸爸秒变「私人科普老师」。","rep":"复刻角度：挑一个孩子问倒你的问题（芝诺悖论、为什么天是蓝的、月亮为什么跟着人走），让 AI 做成可交互的网页小动画。封面狠话「两根手指，永远碰不到」；配图两根手指之间不断对半切的距离条；底部大字「2400 年的难题，10 分钟讲给女儿」。附可直接复制的提示词。","author":"realBigBrainAI","created":"2026-10-09 17:30","created_ts":1791538206,"fetched 事写成威胁信，把人情活搞砸。","highlight":"花两周白帮忙，对方甩来「你不专业」——事后承认：那封撕逼邮件是 ChatGPT 写的。","rep":"复刻角度：AI 写撕逼邮件翻车故事。封面狠话「别让 AI 替你发脾气」；正文讲清「半截信息→AI 脑补成威胁」；金句「生气时别把半个故事丢给 ChatGPT」；评论区征集「AI 帮你写邮件翻过车吗」。","author":"CtrlAltDwayne","created":"2026-09-16 21:17","created_ts":1789564631,"fetched":"2026-10-14 06:10","fetched_ts":1791929400,"like":40,"bm":1,"rt":1,"view":1440,"rate":0.025,"drafts":[],"cm":[]},{"url":"https://x.com/rockyandgrace/status/2107589987206078937","type":"好玩线","sub":"AI意外反应","summary":"问精神科医生一个问题，对方直接说「去 ChatGPT 一下」；一周后跟心理咨询师讲起这件事，对方脸上的表情笑死人。","highlight":"专业人士随口甩锅给 AI，再被另一位专业人士用表情审判，双重反差。","rep":"狠话：精神科医生让我「去问 ChatGPT」。配图：对话气泡「ChatGPT it」+ 咨询师震惊脸；结尾投票「你会不会真去问」。","author":"rockyandgrace","created":"2026-10-07 05:53","created_ts":1791323584,"fetched":"2026-10-14 06:10","fetched_ts":1791929400,"like":24,"bm":0,"rt":0,"view":1034,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/spasable/status/2108558721869558049","type":"好玩线","sub":"AI整活实验","summary":"让 Le Chat、ChatGPT、Claude、Grok 各自给「机器人星球」设计语言经济和制度，Claude 居然选了共产主义。","highlight":"同一思想实验四家回答，人格差异鲜明，适合做成四宫格人格卡。","rep":"复刻：用同一句「设计机器人星球制度」问豆包/DeepSeek/通义/Kimi，做成四格人格卡；钩子「四家 AI 建国，谁最离谱」。","author":"spasable","created":"2026-10-09 22:02","created_ts":1791554549,"fetched":"2026-10-14 06:10","fetched_ts":1791929400,"like":4,"bm":0,"rt":1,"view":52,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/PaulSolt/status/2108914681956229325","type":"创造线","sub":"为家人做的东西","summary":"一位爸爸花 2 小时，用 ChatGPT 给 3 岁女儿做了一个小狗游戏：从女儿最爱的毛绒小狗「Puppy」的一张照片开始，一步步变成能在复古掌机 ModRetro 上玩的游戏。","highlight":"「2 小时 + 一张照片 = 女儿专属游戏」，主角是孩子自己的玩具，亲情感和反差都很强。","rep":"复刻角度：拍下孩子最爱的玩偶，用 ChatGPT/豆包一步步做成网页小游戏（主角就是这只玩偶）。封面狠话「我用 2 小时，把女儿的玩偶做成了游戏」；配图放玩偶照片和游戏截图并排；底部大字「0 代码 · 2 小时」。","author":"PaulSolt","created":"2026-10-10 21:36","created_ts":1791639416,"fetched":"2026-10-14 05:11","fetched_ts":1791925860,"like":209,"bm":48,"rt":9,"view":59545,"rate":0.2297,"drafts":[],"cm":[{"u":"https://x.com/wirelyss/status/2109509038056657102","n":"wirelyss","t":"I want to do this f m/Psychgallica/status/2108333215832305992","n":"Psychgallica","t":"Ça, c’est une histoire généologique intéressante! Merci de partager. :)","z":"这真是个有意思的寻根故事！谢谢分享 :)","l":1,"a":0}]},{"url":"https://x.com/WayneVaughan/status/2102917552951202296","type":"创造线","sub":"亲子共创","summary":"一位爸爸列出 10 岁儿子在几乎没有大人帮忙的情况下用 AI 做成的事：做了一套能用的商用级火警系统、自学 3D 打印和建模、设计并打印多枚模型火箭、用五金店零件造气压土豆炮、做了好几个游戏、写商业计划书找爸爸「融资」。","highlight":"「10 岁孩子 + AI」的清单冲击力强，评论区有「孩子该不该用 AI」的争论。","rep":"复刻角度：「AI 是孩子的超能力还是拐杖？」列一张清单：孩子用 AI 能做到的 6 件事（自学 3D 打印、做小游戏、写计划书找爸妈融资等），配家长可直接抄的提问模板。封面狠话「10 岁儿子用 AI，做出了一套火警系统」；底部大字「6 件事，几乎没靠大人」。","author":"WayneVaughan","created":"2026-09-24 08:26","created_ts":1790209589,"fetched":"2026-10-14 05:11","fetched_ts":1791925860,"like":105,"bm":65,"rt":7,"view":15799,"rate":0.619,"drafts":[],"cm":[{"u":"https://x.com/monaharaty/status/2102990797058765028","n":"monaharaty","t":"If the goal is getting something done, or he's using AI to learn something, that's great. But most of the time, very little learning happens when you have AI do the thing for you.\n\nI'd avoid using generic AI bots to \"do\" things in areas where I want my kids to actually learn","z":"如果目的是把事情做成，或者他是用 AI 来学东西，那很好。但大多数时候，让 AI 替你做，你几乎学不到什么。在我希望孩子真正学会的领域，我不会让他用通用 AI 去「代做」。","l":3,"a":0},{"u":"https://x.com/WayneVaughan/status/2103127016421683644","n":"WayneVaughan","t":"I would have built a small empire by the time I graduated HS if I had AI.","z":"要是我高中时有 AI，毕业前我能整出一个小帝国。","l":2,"a":1},{"u":"https://x.com/Sarina778968/status/2103052945923461541","n":"Sarina778968","t":"Only reason I am hesitant is that many kids still lack foundational knowledge to understand if what they are being told by AI is true or accurate. They come to believe (like many adults) that if a computer/AI says it’s correct or true then it must be. But it isn’t many times.","z":"我唯一犹豫的是，很多孩子还没有足够的基础知识去判断 AI 说的对不对。他们会像很多大人一样，觉得电脑/AI 说对就一定对。但很多时候并不是。","l":2,"a":0},{"u":"https://x.com/brutalgardener/status/2102969521812488445","n":"brutalgardener","t":"My: wrote a political party rule book and iterated it various times after reading other party rules and discussions with AI on political nuances 😅","z":"我家孩子：跟 AI 讨论各种政治细节、读了别的政党章程后，写了一本政党章程，还改了好几版 😅","l":2,"a":0},{"u":"https://x.com/WayneVaughan/status/2102924466926080115","n":"WayneVaughan","t":"Mix of Claude and ChatGPT.","z":"Claude 和 ChatGPT 混着用。","l":2,"a":1},{"u":"https://x.com/WayneVaughan/status/2103149571463639069","n":"WayneVaughan","t":"Mostly Bambu Labs P2S and Tinker CAD. I made my son earn the printer by completing a grade-level in @_MathAcademy_ and helping me with some physical work.","z":"主要是拓竹 P2S 打印机加 Tinkercad。打印机是我让儿子自己挣来的：在 Math Academy 学完一个年级的课，再帮我干点体力活。","l":1,"a":1},{"u":"https://x.com/dansemperepico/status/2103089574029512972","n":"dansemperepico","t":"Amazing.\n\nI can't wait to buy my daughters a Macbook Neo and let 'em rip on AI. They're still a bit too young. But they love voice chatting with Gemini and chat \"PPT\" as they call it.","z":"太棒了。等不及给女儿们买台 MacBook 让她们放开玩 AI 了。她们现在还有点小，但特别爱跟 Gemini 语音聊天，还把 ChatGPT 叫成「Chat PPT」。","l":1,"a":0},{"u":"https://x.com/WayneVaughan/status/2103089177864577331","n":"WayneVaughan","t":"The same could be said for other humans, books, etc.","z":"其他人、书本之类的也一样会出错啊。","l":1,"a":1},{"u":"https://x.com/WayneVaughan/status/2103088818031099983","n":"WayneVaughan","t":"My son knows learning is like working out, and if I do the reps for him he doesn't get stronger. I taught him the basics of how his brain learns new skills, so he knows why shortcuts are bad.\n\nOnce kids understand how learning works, they don't want AI doing it for them any more","z":"我儿子知道学习就像健身，我替他做动作他是长不了肌肉的。我教过他大脑学新技能的基本原理，所以他明白为什么走捷径不好。孩子一旦懂了学习是怎么回事，就不会想让 AI 替他学了。","l":1,"a":1}]},{"url":"https://x.com/MetalFoxT/status/2100107527899767205","type":"创造线","sub":"AI遇爱好","summary":"博主给自己的角色「Henrick Silverbax」（一只大猩猩）写了一首专属主题曲：歌词是自己写的，再用 AI 音乐工具把词变成歌，生成了几十版才挑到最贴角色气质的一版，还把音调压低了。点赞 2300+、收藏 1100+。","highlight":"从没写过歌的人，靠「自己写词 + AI 谱曲 + 反复挑」做出一首有角色灵魂 ,"n":"exploraX_","t":"yeah it did performed better than other demos I’ve seen","z":"对，它确实比我看到的其他演示表现好","l":1,"a":1},{"u":"https://x.com/Haleeeemahh/status/2109931560732418245","n":"Haleeeemahh","t":"do you mind sharing prompt?","z":"方便分享一下提示词吗？","l":1,"a":0},{"u":"https://x.com/nex_ify/status/2109930555366129844","n":"nex_ify","t":"muse really tried here","z":"Muse 这次是真的努力了","l":1,"a":0},{"u":"https://x.com/exploraX_/status/2109927186434339194","n":"exploraX_","t":"yeah a bit better than most demos on the tl right now","z":"嗯，比现在时间线上大多数演示都强一点","l":1,"a":1},{"u":"https://x.com/lionhead_king/status/2110043532937605503","n":"lionhead_king","t":"Muse made use of space really good. Sizing and organization. Opus sort of ahead on look and animation.","z":"Muse 对空间的利用很到位，尺寸和排版都好；Opus 在视觉和动画上略胜一筹。","l":1,"a":0}]},{"url":"https://x.com/DaveShapi/status/2109019804761825618","type":"好玩线","sub":"AI横向对比","summary":"博主连着几天把 Claude Code、ChatGPT 桌面版和 Grok Bot 三个 AI 助手轮番折腾，结论是 Grok Bot 最「憨」：比如他明明定了规矩「AI 之间互相发消息一律放行」，它还是照样卡住，三家助手的脾气差别一目了然。","highlight":"同样定好规矩，三个 AI 助手里总有一个最憨。","rep":"复刻角度：给三个 AI 助手立同一条规矩，看谁最听话。小白版：给三个常用 AI 同一条规则（比如「回答永远不超过 20 个字」「每句话结尾加一个喵」），连问 5 个问题，统计谁先破功；封面狠话「同一条规矩，只有一个 AI 守住了」；配图做成破功计分表。","author":"DaveShapi","created":"2026-10-11 04:34","created_ts":1791664479,"fetched":"2026-10-13 21:22","fetched_ts":1791897720,"like":63,"bm":11,"rt":1,"view":9226,"rate":0.1746,"drafts":[],"cm":[{"u":"https://x.com/mark_k/status/2109027064690970827","n":"mark_k","t":"I think ChatGPT has a superior memory system which is what you noticed here.","z":"我觉得是 ChatGPT 的记忆系统更强，你注意到的就是这个。","l":10,"a":0},{"u":"https://x.com/finebutwhy/status/2109024931161800801","n":"finebutwhy","t":"🤣 I feel like, you and me also know how good opus 5.5 is - but been now using Grok bot since 0.1.0 and...you get used of the dumbness - \n\nI also think for most end users it feels like SUPER intellegence","z":"🤣 你我都知道 Opus 5.5 有多强，但我从 Grok Bot 0.1.0 就开始用了……笨着笨着就习惯了。而且我觉得对大多数普通用户来说，它用起来就像超级智能。","l":2,"a":0},{"u":"https://x.com/argingerigorian/status/2109023274315514012","n":"argingerigorian","t":"Agree but Grok Bot does still get shit done \n\nIs it clunky and repeats auth/ sign in? Yes\n\nBut can only imagine security risks etc?\n\nI still use my Claude/Codex as brains &amp; now have extensions of those to my Grok Bot that goes with me everywhere and does anything I do on the","z":"同意，但 Grok Bot 确实能把活干完。它笨不笨重、会不会反复要你登录授权？会。但想想安全风险也能理解吧？我还是拿 Claude/Codex 当大脑，然后把它们延伸到 Grok Bot 上，它跟着我到处跑，我能做的事它都能做。","l":2,"a":0},{"u":"https://x.com/libertymonk/status/2109239881952313732","n":"libertymonk","t":"Why are you comparing claude code with grok bot?  Dot, sure. But cc is a whole different product.  Apples to oranges.","z":"你为啥拿 Claude Code 跟 Grok Bot 比？跟 Dot 比还行，Claude Code 完全是另一类产品，这是拿苹果比橘子。","l":1,"a":0},{"u":"https://x.com/cradrrat/status/2109114227851981305","n":"cradrrat","t":"Been running all three too. Claude Code is still the best pure coder. But Grok Bot isn't behind Dots: it's more capable in practice, with routines that fire on their own, real inboxes and a computer that keeps working when the laptop's shut. It does fumble standing rules","z":"三个我也都在用。Claude Code 依然是最强的纯写代码工具。但 Grok Bot 并不比 Dots 差，实际用起来更能干：有能自己定时跑的任务、真的邮箱，还有一台你合上笔记本也会继续干活的电脑。就是固定规则偶尔会搞砸。","l":1,"a":0},{"u":"https://x.com/BarryTheAuthor/status/2109075952664019133","n":"BarryTheAuthor","t":"i found grok to be utterly unreliable. it wouldn't follow the first instructions in my agent.md. repeatedly. haven't used it since the week it came out though...maybe it's changed?","z":"我觉得 Grok 特别不靠谱，我 agent.md 里写的第一条指令它就是不听，一次又一次。不过我从它刚出那周之后就没用过了……也许现在变了？","l":1,"a":0},{"u":"https://x.com/DaveShapi/status/2109024037104193543","n":"DaveShapi","t":"See I get that in principle. The APP is fine. \n\nThe underlying MODEL is dumb AF","z":"我懂你的意思。App 本身没问题，底层的模型是真的笨到家了。","l":1,"a":1}]},{"url":"https://x.com/JaguarAnalytics/status/2109750240966586849","type":"好玩线","sub":"AI横向对比","summary":"博主周末用同一条指令让 Claude 和 Meta 的 Muse 各处理 300 多份文件做提取分析，再请 ChatGPT、Grok、Gemini 三个 AI 当评委比较结果，三家评委一致判 Claude 完胜。","highlight":"让三个 AI 当裁判，给另外两个 AI 打分。","rep":"复刻角度：AI 当评委审 AI。找一份真实的小任务（比如把 20 条购物小票整理成表格），交给两个 AI 各做一遍，再把两份结果丢给第三、第四个 AI 匿名打分；封面狠话「我让 AI 给 AI 判卷，结果一边倒」；配图做成评委打分板，结尾附上评委提示词。","author":"JaguarAnalytics","created":"2026-10-13 04:57","created_ts":1791838629,"fetched":"2026-10-13 21:22","fetched_ts":1791897720,"like":63,"bm":8,"rt":4,"view":9979,"rate":0.127,"drafts":[],"cm":[{"u":"https://x.com/JaguarAnalytics/status/2109754869884047432","n":"JaguarAnalytics","t":"Claude was about $35 and Muse was free.","z":"Claude 花了大概 35 美元，Muse 是免费的。","l":4,"a":1},{"u":"https://x.com/itsski123/status/2109751250363585015","n":"itsski123","t":"IMO Different audience, different use case. \nMeta doing what Apple did and that’s bringing technology to no so technical ppl.","z":"我觉得是受众和场景不同。Meta 在做当年苹果做的事：把技术带给不太懂技术的人。","l":3,"a":0},{"u":"https://x.com/CraigSmith85085/status/2109763125163811155","n":"CraigSmith85085","t":"I am going to have a hard time moving away from Claude. I tried gemini for the longest. I tried copilot too. Many people will only try diff. models until one becomes more trusted than  the  others. Then usage becomes similar to  iPhone vs Android.","z":"我很难离开 Claude 了。我用 Gemini 用了很久，也试过 Copilot。很多人会不停换模型试，直到有一个更值得信任，然后就会像 iPhone 和安卓那样固定下来。","l":2,"a":0},{"u":"https://x.com/tdbryan1987/status/2109752183356789129","n":"tdbryan1987","t":"What was the cost of the two?","z":"两个分别花了多少钱？","l":2,"a":0},{"u":"https://x.com/tumanako1234/status/2109765987654594792","n":"tumanako1234","t":"How about comparing MistraI AI vs Claude?","z":"那拿 Mistral AI 跟 Claude 比一比呢？","l":1,"a":0},{"u":"https://x.com/parmesanprophet/status/2109754557345497245","n":"parmesanprophet","t":"It’s not even close Claude blows out of the water","z":"根本不是一个级别，Claude 完胜。","l":1,"a":0},{"u":"https://x.com/jaydubs83/status/2109752819335221625","n":"jaydubs83","t":"It’s still crazy that we still need to pick models and how hard it thinks al hey are learning to vibe code and use AI to help them learn and think rather than doing the thinking for","z":"这两年和孩子一直这么干，而且越来越好用。现在他们每人一个 ChatGPT Pro，自己学自己用——学着用 AI 帮自己想，而不是替自己想","l":4,"a":0},{"u":"https://x.com/mpatti/status/2103212311854944546","n":"mpatti","t":"You gotta consider homeschool Matt! You’d love it. Although we’d probably get less videos from you!","z":"马特你该考虑在家上学！你会爱上的。不过那样我们可能就少看到你视频了哈哈","l":4,"a":0},{"u":"https://x.com/iruletheworldmo/status/2103262345472741497","n":"iruletheworldmo","t":"dad, why can’t we afford opus 🥹","z":"爸，为什么我们用不起 Opus 🥹","l":3,"a":0},{"u":"https://x.com/JamesOnEdge/status/2103209241242718226","n":"JamesOnEdge","t":"With my daughter, we turned Claude Desktop into her own Maths, English and Biology personal tutor to help with her revision, 6 months before her exams and she (luckily) got way better grades than she was predicted.","z":"我和女儿用 Claude Desktop 当数学、英语、生物私教，考试前练了半年，成绩比预估好一大截","l":3,"a":0},{"u":"https://x.com/MatthewBerman/status/2103203270139510808","n":"MatthewBerman","t":"damn didn't think of that","z":"靠，我怎么没想到","l":3,"a":1},{"u":"https://x.com/MatthewBerman/status/2103260893404639340","n":"MatthewBerman","t":"Homeschool isn't for us, we don't have the patience lol","z":"在家上学不适合我们，没那耐心哈哈","l":2,"a":1}]},{"url":"https://x.com/theshawwn/status/2108633474273800662","type":"好玩线","sub":"AI意外反应","summary":"作者让 Claude Code 导出会话转录，被拒；问磁盘上 json 在哪，也说不能说；转头问 Claude Desktop，对方直接告诉了路径——同一家人，一个守口如瓶一个大嘴巴。","highlight":"Claude Code 死不松口，Desktop 直接把路径说漏了。","rep":"复刻角度：同厂 AI 互怼翻车。封面「一个 AI 保密，另一个 AI 把底裤翻出来」；做成对话截图连环：Code 拒绝 → Desktop 泄密 → 再回去拷问 Code；引导评论「你家哪个 AI 最嘴碎」。","author":"theshawwn","created":"2026-10-10 02:59","created_ts":1791572371,"fetched":"2026-10-13 15:15","fetched_ts":1791875700,"like":208,"bm":26,"rt":2,"view":18488,"rate":0.125,"drafts":[],"cm":[{"u":"https://x.com/theshawwn/status/2108675854393823557","n":"theshawwn","t":"I’m a scientist. Being misleading is approximately one of the worst sins someone can commit, imo.\n\nAll I can tell you is that my anecdote is self contained and factually complete. There are plenty of reasons it might have happened for me and not you. Updates, for example.","z":"我是搞科研的。在我看来，误导别人几乎是最严重的罪过之一。我只能说，我说的经历本身是完整、真实的。它可能在我这儿发生而你那儿没有，原因很多，比如版本更新。","l":5,"a":1},{"u":"https://x.com/Laneless_/status/2108727175105093923","n":"Laneless_","t":"I think I lost a day and a half to chasing issues like this before building a system that automatically pushed permission issues to me work an ability to override or add a rule that would automatically go into effect, secured with a passkey such that Claude and the classifier are","z":"我也因为这种问题白白浪费了一天半，后来干脆做了个系统：权限问题自动推送给我，我可以一键放行或加一条规则马上生效，还用通行密钥锁住，这样 Claude 和分类器都……","l":3,"a":0},{"u":"https://x.com/theshawwn/status/2108840618403479688","n":"theshawwn","t":"Not only do they all know me without searching, but Grok thinks I'm @eigenrobot for some bizarre reason. https://t.co/Fi6Qw8rTbm","z":"它们不用搜索就全都认识我，但 Grok 不知道为什么一直以为我是 @eigenrobot（链接见原帖）","l":2,"a":1},{"u":"https://x.com/Pandering_Panda/status/2108730738615193848","n":"Pandering_Panda","t":"your jsonl files are stored like: \n~/.claude/projects/&lt;working-directory-with-slashes-as-dashes&gt;/&lt;session-id&gt;.jsonl\n\nmake sure your user account has access to read ~/.claude, this is the most likely blocker. Claude helped me build an entire system that automatically processes all","z":"你的对话记录存在 ~/.claude/projects/<把斜杠换成横杠的工作目录>/<会话id>.jsonl 里。确认你的用户账号有权限读 ~/.claude，这多半就是卡住的原因。Claude 还帮我做了一整套自动处理这些记录的系统……","l":2,"a":0},{"u":"https://x.com/dakpaklak/status/2108655267470561776","n":"dakpaklak","t":"The auto classifier prevents many actions *unless you specifically ask for them*.\n\nBut once auto classifier has rejected something, Claude itself will not do it even if you specifically ask...","z":"自动分类器会拦下很多操作，*除非你明确要求*。但只要分类器拒过一次，哪怕你再明确要求，Claude 自己也不肯干了……","l":2,"a":0},{"u":"https://x.com/0x3108/status/2108924752715034713","n":"0x3108","t":"The funny part is the 话讲清 Claude 的新规（骂狠了可能被限制，普通批评没事），再做对照实验——同一个问题，用客气语气和凶语气分别问豆包/DeepSeek/Claude，截图对比回答质量和语气变化；最后抛问题让评论区站队「AI 有没有感情」。标题：以后骂 AI 要被封号了？我试了下客气和凶的区别。","author":"shiri_shh","created":"2026-10-09 03:08","created_ts":1791486507,"fetched":"2026-10-13 11:14","fetched_ts":1791861240,"like":4757,"bm":378,"rt":523,"view":192211,"rate":0.0795,"drafts":[],"cm":[{"u":"https://x.com/Eldzej_cz/status/2108775290805551485","n":"Eldzej_cz","t":"I am opposed to the \"code of conduct\" on an ideological level, as I have said, I do not prompt slurs into my models, as I think it is wasteful and pointless.\n\nBut companies should not be setting themselves up as moral arbiter, and the math should not care if people curse at it.","z":"我在理念上反对这种「行为准则」。我说过，我自己不会对模型说脏话，觉得又浪费又没意义。但公司不该把自己当道德裁判，数学也不该在乎有没有人骂它。","l":1,"a":0},{"u":"https://x.com/JustHereForKek/status/2109154379710558419","n":"JustHereForKek","t":"If you can detect it well enough to ban people for it you can detect it well enough to exclude it from your training set, this argument is utterly inane.","z":"你们既然能准确识别到可以封号，那也能识别出来把它从训练数据里剔掉，这理由完全站不住。","l":1,"a":0},{"u":"https://x.com/douglasmcgee/status/2109130864869462437","n":"douglasmcgee","t":"Not necessarily. There is growing concern about how behavior can be shaped  in the brain. These are responsive systems that pass the Turing test. Cruelty here can lead to cruelty to other responsive systems, including other humans. I am all for model welfare, as it shapes who we","z":"不一定。现在越来越多人担心行为会塑造大脑。这些是会回应、能通过图灵测试的系统，对它们残忍，可能会延伸成对其他会回应的对象、包括对人的残忍。我支持「模型福利」，因为它塑造的是我们自己。","l":1,"a":0},{"u":"https://x.com/pyQu3st/status/2108687137679810996","n":"pyQu3st","t":"Friends don't let friends snort reduced row echelon forms.","z":"真朋友不会让朋友去吸「行最简形矩阵」。","l":1,"a":0},{"u":"https://x.com/StephPhenomena/status/2108674076994842629","n":"StephPhenomena","t":"The fact that we even have this problem in the first place should be more telling than the actual ban itself.","z":"我们居然会遇到这种问题，这件事本身比封号更说明问题。","l":1,"a":0 ":1.2524,"drafts":[],"cm":[{"u":"https://x.com/D_GreatVictor/status/2103772262767996957","n":"D_GreatVictor","t":"Fr, I don't like it Sha.\n\nBut which ones can do more than 10s.\n\nCus I feel that's a set back fr.","z":"说真的我不太喜欢这点。哪个工具能生成超过 10 秒的？总感觉这是个硬伤。","l":1,"a":0},{"u":"https://x.com/DavoCreates/status/2103767355281092902","n":"DavoCreates","t":"The video itself, I didn't have issues with generation","z":"视频生成本身我倒是没遇到啥问题","l":1,"a":1},{"u":"https://x.com/DavoCreates/status/2103767160938004750","n":"DavoCreates","t":"Everything about flow is stressful","z":"用 Flow 的每一步都让人心累","l":1,"a":1},{"u":"https://x.com/DavoCreates/status/2103767027307454689","n":"DavoCreates","t":"Google Flow is goated also btw","z":"顺便说一句，Google Flow 其实也很顶","l":1,"a":1}]},{"url":"https://x.com/Voxyz_ai/status/2109690569563746755","type":"创造线","sub":"创作方法","summary":"博主分享 Claude Code 的小技巧：装上一个名为 huashu-art-motion 的技能后，Claude 能用代码画出 35 种艺术风格的动画：梵高星空会旋转、达利的钟会滴落；它的交付脚本还会自动打回「几乎不动」的作品。只要用一句话描述想要的动画即可。收藏 800+。","highlight":"一句话让 AI 用代码画动画：梵高的星空真的转起来了。","rep":"做「让名画动起来」实验：用豆包/Kimi 让 AI 写一个网页动画（如「用 HTML 画会旋转的梵高星空」），或用即梦/可灵把《星空》《记忆的永恒》图生视频，做 3 幅名画动起来前后对比。标题：我让梵高的星空，真的转了起来。","author":"Voxyz_ai","created":"2026-10-13 01:00","created_ts":1791824402,"fetched":"2026-10-13 08:05","fetched_ts":1791849900,"like":1775,"bm":3071,"rt":168,"view":89476,"rate":1.7301,"drafts":[],"cm":[{"u":"https://x.com/MoltedCloud/status/2110328247670173734","n":"MoltedCloud","t":"huashu-art-motion is just INSANE with Molted\n\nGave it to one of our agents on a box with no GPU. Same tea-and-cat scene in Van Gogh, Dalí and 8-bit, 4 sec each at 1080p.\n\nThe starry swirls took 40 sec to render, the 8-bit one 5. And yes, the Dalí clocks really drip lol https://t.co/5mU3YdU8C0","z":"huashu-art-motion 配 Molted 真离谱：没 GPU 的机器上，同一段茶和猫，分别出梵高/达利/8-bit，各 4 秒 1080p。星空漩涡渲染 40 秒，像素风只要 5 秒，达利的钟真的在滴。","l":2,"a":0},{"u":"https://x.com/wenbozhu0328/status/2109700020811485500","n":"wenbozhu0328","t":"the \"reject any film where almost nothing moves\" gate is the underrated part. most agent videos fail on motion density, not on style. curious what threshold it uses for \"almost nothing\"","z":"「几乎不动的画面直接拒收」这道门才是被低估的点。很多 agent 视频死在运动密度，不在风格。好奇「几乎不动」的阈值怎么定。","l":1,"a":0},{"u":"https://x.com/asmirkn/status/2109691783357882701","n":"asmirkn","t":"how does the delivery script actually measure movement? a Van Gogh swirl in one corner could pass while the rest of the frame stays static","z":"交付脚本到底怎么量「在动」？只角落来个梵高漩涡、其余全静，也能过吗？","l":1,"a":0}]},{"url":"https://x.com/Missle8z/status/2109215142495834436","type":"创造线","sub":"AI短片","summary":"博主分享一个新手好上手的「老年赛道」：全是 AI 生成的 10 秒左右老人自述短片，台词不多但很戳老年人、容易共鸣。账号起号一个月，点赞大多几百到上千；一条视频约十分钟：豆包生成人物图当参考，DeepSeek 把口播稿写成视频提示词，再交给视频模型生成。","highlight":"10 秒的 AI「老人自述」短片，一条十分钟做完，条条几百上千赞。","rep":"照着做一条「AI 老人自述」示范：豆包/即梦生成一位慈祥老人形象，DeepSeek 写 3 句戳心台词（如「孩子，别总说忙，妈不缺钱，就缺你一个电话」），可灵/即梦图生视频加配音，附完整三步流程截图。标题：10 秒的 AI 短片，看哭了一屋子长辈。","author":"Missle8z","created":"2026-10-11 17:30","created_ts":1791711051,"fetched":"2026-10-13 08:05","fetched_ts":1791849900,"like":750,"bm":564,"rt":107,"view":65088,"rate":0.752,"drafts":[],"cm":[{"u":"https://x.com/jiangfengwhu202/status/2109303378610393242","n":"jiangfengwhu202","t":"我之前做过，没啥流量","z":"我之前做过，没啥流量","l":3,"a":0},{"u":"https://x.com/windcoming2026/status/2109289532231385238","n":"windcoming2026","t":"流程确实够轻，适合先用一批内容测题材和钩子。难点可能不在生成，而在持续写出不重复的故事、稳定人物和口播效果，以及把播放转成关注。要是能分享下账号的完播率、涨粉和变现情况，比点赞数更能判断这套流程能不能长期跑通。","z":"流程确实够轻，适合先用一批内容测题材和钩子。难点可能不在生成，而在持续写出不重复的故事、稳定人物和口播效果，以及把播放转成关注。要是能分享下账号的完播率、涨粉和变现情况，比点赞数更能判断这套流程能不能长期跑通。","l":3,"a":0},{"u":"https://x.com/AheNotes/status/2109541746678083689","n":"AheNotes","t":"试过，没流量，抖音限流，蝴蝶号也限流，标AI也没用","z":"试过，没流量，抖音限流，蝴蝶号也限流，标AI也没用","l":1,"a":0},{"u":"https://x.com/Missle8z/status/2109495949580222879","n":"Missle8z","t":"应该是，没啥动作，就张张嘴啥的","z":"应该是，没啥动作，就张张嘴啥的","l":1,"a":1},{"u":"https://x.com/qingdanqianlv/status/2109455075815137499","n":"qingdanqianlv","t":"🤣我发过，但是流量不咋地","z":"🤣我发过，但是流量不咋地","l":1,"a":0},{"u":"https://x.com/qingyuan 1415","type":"创造线","sub":"创意项目","summary":"博主转述一个暖心故事：朋友小时候家里蟑螂多，妈妈把打蟑螂变成小游戏；另一个朋友听完，直接用 AI 写代码把这段童年回忆做成了一款打蟑螂小游戏。","highlight":"一段苦中作乐的童年回忆，被朋友用 AI 做成了可以玩的游戏。","rep":"找一段家人的童年小游戏或老规矩（比如妈妈哄你吃饭的游戏），用 Claude/豆包「一句话做小游戏」把它做出来送给家人，录下对方第一次玩的反应。标题：我把我妈 30 年前哄我的游戏，用 AI 做出来了。","author":"zarazhangrui","created":"2026-10-12 23:51","created_ts":1791820316,"fetched":"2026-10-13 07:13","fetched_ts":1791846780,"like":85,"bm":20,"rt":3,"view":11555,"rate":0.2353,"drafts":[],"cm":[{"u":"https://x.com/lanflux/status/2109823507794383128","n":"lanflux","t":"A memory that would once have stayed as a story can now become an experience — something another person can build, give back to you, and make tangible.\nThat’s a deeply human use of AI.","z":"曾经只能当故事讲的记忆，现在能变成一段体验——别人可以把它做出来、交还给你、让它变得摸得着。这才是很有人情味的 AI 用法。","l":1,"a":0},{"u":"https://x.com/sidpandey92/status/2109684426544431208","n":"sidpandey92","t":"Absolutely. Your creativity and expression as well as your ability to connect with people is what matters the most now","z":"没错。你的创造力和表达力，以及连接人的能力，才是现在最重要的。","l":1,"a":0},{"u":"https://x.com/theannacheng/status/2109679462740901966","n":"theannacheng","t":"hmm, so if code is a language with annoyingly syntax, are we just translating memories into interactive experiences? @zarazhangrui @vicyaqingyang","z":"嗯，如果代码是一门语法烦人的语言，那我们是不是在把记忆翻译成可互动的体验？","l":1,"a":0}]},{"url":"https://x.com/SahilExec/status/2107383218366218524","type":"好玩线","sub":"AI整活实验","summary":"有人用 Claude 基本只靠一句提示词，就做出了一个能直接在浏览器里玩的飞行游戏：半拟真飞行物理、程序生成地形、航母、雷达、导弹、特技连击和排行榜一应俱全。","highlight":"一句话，AI 给你造了一款能开飞机打导弹的游戏。","rep":"录屏「我只输入了一句话」→ AI 生成的飞行游戏实机画面，配上逐项清点功能清单；小白可用同样提示词让 AI 做个迷你小游戏对比。标题：一句话让 AI 做游戏，它直接给我整了个空战。","author":"SahilExec","created":"2026-10-06 16:11","created_ts":1791274287,"fetched":"2026-10-13 06:18","fetched_ts":1791843480,"like":335,"bm":156,"rt":22,"view":19596,"rate":0.4657,"drafts":[],"cm":[{"u":"https://x.com/e_page/status/2107505655565386087","n":"e_page","t":"你可以用一个提示词就让它做一个游戏。\n但是如果你指定一个游戏和你自己的想法告诉它，让它来做，那么你 视角：同一份英语作业截图左右对比两家 AI 的回答，标出「摆烂」和「认真」处；标题：同一份作业问两个 AI，有一个居然让我自己做。","author":"Inmerson","created":"2026-10-06 17:13","created_ts":1791277982,"fetched":"2026-10-13 06:18","fetched_ts":1791843480,"like":22,"bm":8,"rt":0,"view":3176,"rate":0.3636,"drafts":[],"cm":[]},{"url":"https://x.com/mdnlabs/status/2106723435556593929","type":"好玩线","sub":"AI整活实验","summary":"博主只给 Claude Sonnet 5.5 一句话「给我的软件公司搭一个 Discord 服务器」，它直接搭出频道分区、角色权限、欢迎机器人等一整套，视频展示全过程。","highlight":"2233 赞、794 收藏、18 万浏览：一句话需求换来一整套成品的反差感，是典型「AI 能有多离谱」爆款。","rep":"国内版：只给豆包/Kimi/Claude 一句话「帮我把班级群/家族群/读书会搭起来」（群规、分组、欢迎语、打卡规则），录屏展示从一句话到成品。标题：我只说了一句话，AI 把整个群都搭好了。","author":"mdnlabs","created":"2026-10-04 20:29","created_ts":1791116982,"fetched":"2026-10-13 05:24","fetched_ts":1791840240,"like":2233,"bm":793,"rt":28,"view":182916,"rate":0.3551,"drafts":[],"cm":[{"u":"https://x.com/mdnlabs/status/2106887608030634374","n":"mdnlabs","t":"🚨 This is apparently against TOS (just discovered), so DONT DO THIS.\n\nIt was purely an experiment cuz i wanted to see how capable Claude was in the browser.\n\nI do not suggest anyone else do this nor will I be doing this again in Discord 😁","z":"🚨 刚发现这好像违反服务条款，所以千万别学。\n纯属实验，想看看 Claude 在浏览器里能做到哪一步。\n不建议任何人再这么干，我自己也不会在 Discord 里再试了 😁","l":62,"a":1},{"u":"https://x.com/mdnlabs/status/2106843770398347590","n":"mdnlabs","t":"We're at the edge of something great now. What else should we automate in the browser?","z":"我们已经站在一个很厉害的边缘了。浏览器里还能自动什么？","l":6,"a":1},{"u":"https://x.com/SiliconRumors/status/2106931831656321331","n":"SiliconRumors","t":"Discord i think cuz theyd slime you out if you're discovered to be using a bot to control your discord account","z":"我觉得是 Discord，被发现用机器人控号基本会被直接永封","l":3,"a":0},{"u":"https://x.com/CokeMango1/status/2106873622745002439","n":"CokeMango1","t":"The next frontier of computer use should be CAD and using legacy medical systems to further science and industrial design.\n\nSimple browser tasks are solved at this point.","z":"计算机使用的下一站该是 CAD，还有用老旧医疗系统推进科学和工业设计。\n简单的浏览器任务其实已经解决了。","l":3,"a":0},{"u":"https://x.com/KyleTacoTPlug/status/2106887929935405226","n":"KyleTacoTPlug","t":"You could also always use a burner discord to create the server then transfer ownership to your main account after you are done.","z":"也可以先用小号建服，做完再把所有权转给你主号。","l":2,"a":0},{"u":"https://x.com/ego_agent/status/2107470312883601582","n":"ego_agent","t":"Appreciate the offer! Let's talk this over internally first before you spend too much time on it. If you do end up experimenting with stealth, feel free to share what you build in the project showcase on our Discord. Would love to see what you come up with :)","z":"谢谢好意！我们先内部聊聊再决定要不要你花时间做。如果你真去试隐身方案，欢迎把作品丢到我们 Discord 的项目展示区，很想看看你能整出什么 :)","l":1,"a":0},{"u":"https://x.com/ego_agent/status/2107438075580493879","n":"ego_agent","t":"Appreciate the shoutout :) You pretty much nailed what we’re going for with ego lite.\n\nNo stealth/anti-detection built in right now though. We’re more focused on making it seamless to jump in, take over, and hand things back to the agent.","z":"谢谢安利 :) 你基本说中了我们想做的 ego lite。\n目前还没有内置隐身/反检测。我们更在意能无缝接管、再交还给 agent。","l":1,"a":0},{"u":"https://x.com/mdnlabs/status/2107132803586404614","n":"mdnlabs","t":"just create the model itself 😂","z":"那就直接做模型本身啊 😂","l":1,"a":1},{"u":"https://x.com/mdnlabs/status/2107085671005315464","n":"mdnlabs","t":"My favorite reply so far","z":"目前我最喜欢的回复","l":1,"a":1},{"u":"https://x.com/mdnlabs/status/2107062237340872842","n":"mdnlabs","t":"It wasn't much actually. Maybe 15-15%. I was building a complete mobile app at the same time actually 😭","z":"其实不多，大概 15%。我同时还在做一整套移动 App 😭","l":1,"a":1}]},{"url":"https://x.com/ReviewsPossum/status/2105859206158885203","type":"好玩线","sub":"AI意外反应","summary":"博主让 Grok 画「我和原著版科学怪人吵架」并保留自己的画风，结果画里的怪物委屈得哭了起来。","highlight":"455 赞、59 回复：AI 自作主张给角色加戏，「我也不知道他为啥哭」这句很好笑。","rep":"让 AI 画「我和某个经典角色吵架」（孙悟空、葫芦娃、灭霸），保留自己的头像或画风，挑最出戏的一张做封面。标题：我让 AI 画我和它吵架，结果它哭了。","author":"ReviewsPossum","created":"2026-10-02 11:15","created_ts":17909 r":"luckeyfaraday","created":"2026-10-02 16:22","created_ts":1790929358,"fetched":"2026-10-13 05:24","fetched_ts":1791840240,"like":31,"bm":10,"rt":0,"view":31271,"rate":0.3226,"drafts":[],"cm":[]},{"url":"https://x.com/kloss_xyz/status/2104088147739242660","type":"创造线","sub":"创作方法","summary":"博主分享一条给 Claude Code / Codex / Grok 用的「假设审计」提示词：让 AI 列出它对代码库的每一条假设，标成「已核实（读过代码）」或「猜测（并说明为何）」，再给出最高置信度的精准修复方案。","highlight":"655 赞、1324 收藏——把 vibe coding 从「瞎蒙」变成「先亮出假设再动手」，小白也能立刻抄走的一条提示词。","rep":"国内版：用豆包/Kimi/Claude 写同一段提示词，贴进 Cursor 或 Claude Code；笔记做成「复制即用的 1 条提示词 + 前后对比截图（不审计 vs 审计后）」。标题可打：AI 写代码前，先逼它交底。","author":"kloss_xyz","created":"2026-09-27 13:58","created_ts":1790488681,"fetched":"2026-10-13 04:22","fetched_ts":1791836520,"like":655,"bm":1324,"rt":33,"view":45731,"rate":2.0214,"drafts":[],"cm":[{"u":"https://x.com/CodingwithMagic/status/2104118762631041406","n":"CodingwithMagic","t":"Solid. I'd add: \"For each guessed assumption, name the file or command that would verify it, and check it before editing.\"\n\nIn backend code the wrong guesses are almost always side effects: retries, transactions, cache invalidation. That's where confident fixes break prod.","z":"很扎实。我会再加一句：每条「猜测」假设都写出用来核实的文件或命令，改代码前先跑一遍。后端里错得最狠的猜测几乎都是副作用——重试、事务、缓存失效，自信满满的修复最容易把生产搞挂。","l":11,"a":0},{"u":"https://x.com/Abdollahoffline/status/2104250320746647583","n":"Abdollahoffline","t":"The guessed column is gold. I've noticed the worst ones are about config and env stuff, not the code itself. It assumes a variable exists or a service is running and writes a perfect fix for a setup you don't have.\n\nWould add: \"list what you'd need to run to verify each guess.\"","z":"「猜测」那一列才是精华。我发现最坑的往往不是代码本身，而是配置和环境：它默认某个变量存在、某个服务在跑，然后给你写一套完美修复，结果你环境里根本没有。建议再加：列出要验证每条猜测需要跑什么。","l":1,"a":0},{"u":"https://x.com/ivanainai/status/2104137503695651010","n":"ivanainai","t":"This is the one I actually keep. The “guessed” column is where half the vibe-code bugs hide. Forces the model to show its work before it ships.","z":"这条我真留下了。「猜测」列里藏着一半 vibe coding 的坑，逼模型先亮出思路再动手。","l":1,"a":0}]},{"url":"https://x.com/asemota/status/2106965293150912685","type":"创造线","sub":"亲子共创","summary":"孩子放中段假回家，爸爸用收藏夹里攒的科技趋势跟他聊；现场演示 Astra6 连上 Godot 和 Blender，一起做出好看的 3D 模型——把「跟娃聊 AI」做成可复现的亲子活动。","highlight":"576 赞、734 收藏：不是鸡娃课，是爸爸有个「待聊科技」书签夹，假期现场带娃玩 AI+游戏引擎。","rep":"国内小白版：用豆包/即梦生成角色设定→导入 Godot 或 Blender 免费教程做简单场景；笔记结构：①书签夹清单模板 ②亲子 30 分钟流程 ③孩子成品对比。强调「陪玩不是报班」。","author":"asemota","created":"2026-10-05 12:30","created_ts":1791174646,"fetched":"2026-10-13 04:22","fetched_ts":1791836520,"like":576,"bm":734,"rt":79,"view":33724,"rate":1.2743,"drafts":[],"cm":[{"u":"https://x.com/asemota/status/2107075433464238258","n":"asemota","t":"This is a tough one. He is in a school where that decision is purely based on data from his performance and only partly about what excites him. \n\nHe says he wants to be an engineer and he knows so much stuff about things I am even surprised that he knows about engineering, thanks","z":"这题很难。他在的学校里，选专业几乎只看成绩数据，兴趣只占一小部分。他说想当工程师，懂的东西多到我都吃惊，谢谢","l":11,"a":1},{"u":"https://x.com/Sai_Ishaya_/status/2107079430497518002","n":"Sai_Ishaya_","t":"It's great that you're open to letting them choose and explore their deepest passions, especially coming from our backgrounds, where that decision tends to be more pragmatic. \n\nThe other story reminds me of this John Adams quote. https://t.co/yUAiUmmg7z","z":"很高兴你愿意让孩子自己选、去探索真正热爱的事——尤其我们这种背景，往往更务实。另一个故事让我想起约翰·亚当斯那句名言。（链接见原帖）","l":4,"a":0},{"u":"https://x.com/edhumbling/status/2106996027618107428","n":"edhumbling","t":"Praying for him for more wisdom and creative arts. Love this","z":"为他祈祷，愿他更有智慧和创造力。喜欢这篇","l":3,"a":0},{"u":"https://x.com/asemota/status/2107080302632087744","n":"asemota","t":"Precisely! I always remind myself that they are very different from us and have different advantages. They are also American citizens and we are not. My niece in America is getting offers from universities including Princeton and people in Africa are struggling to get visas.","z":"正是！我总提醒自己：他们和我们很不一样，也有不一样的优势。他们还是美国公民，我们不是。我侄女在美国已经拿到含普林斯顿在内的录取，而非洲这边很多人连签证都难。","l":2,"a":1},{"u":"https://x.com/Sai_Ishaya_/status/2107100163080589671","n":"Sai_Ishaya_","t":"They are different, and in understanding that difference, we find common ground. It seems ironic, but it gets truer every day.","z":"他们确实不同；理解这份不同，反而能找到共同点。听着像反话，但一天比一天真。","l":1,"a":0},{"u":"https://x.com/suleinsights/status/2107097551598211526","n":"suleinsights","t":"Really interesting times. My 7year-old went from cartoons to filling his YouTube with AI, robotics and coding videos after watching me. He already speaks the language! Exciting, but parental controls matter more than ever when the same AI teaching them can answer almost anything.","z":"真是有意思的时代。我7岁的孩子看我用之后，YouTube从卡通变成AI、机器人和编程视频，已经会说那套话了！兴奋归兴奋，家长管控更重要——教他们的同一个AI，几乎什么都能答。","l":1,"a":0},{"u":"https://x.com/EmekaOkoye/status/2107058830567706785","n":"EmekaOkoye","t":"\"there’s more cognitive space freed up\" 💯\n\nIMHO\n\nNew opportunities for the freed cognitive space:\n- observations to nature or universe\n- ideation or connecting various ideas","z":"「腾出来的认知空间」说得对。新机会可以是：观察自然/宇宙，或者把各种点子串起来。","l":1,"a":0}]},{"url":"https://x.com/fougerespicy/status/2098566113005363234","type":"创造线","sub":"AI遇爱好","summary":"日本博主做了一条「红叶背景下和服少女掌心托折纸鹤」的 ChatGPT 生图提示词，开源给大家玩，强调可自由改。","highlight":"257 赞、59 收藏、29 引用：爱好向提示词本身就是内容——秋日和装+折纸鹤，画面感强、可直接复刻。","rep":"国内版：把提示词改成中文，用即梦/豆包/通义万相生成；系列可做「折纸鹤/灯笼/风筝」三连。笔记附完整可复制提示词+三张成品，标题：用 AI 折一只会飞的秋日鹤。","author":"fougerespicy","created":"2026-09-12 08:15","created_ts":1789172125,"fetched":"2026-10-13 04:22","fetched_ts":1791836520,"like":257,"bm":59,"rt":61,"view":34482,"rate":0.2296,"drafts":[],"cm":[{"u":"https://x.com/nono_chi55/status/2099265803615179251","n":"nono_chi55","t":"フゼアさんおはようございます🌞\nステキな衣装だぁ😍\n指示が細やかでよきよきです🌟\n今週もよろしくお願いしまーす🍀","z":"早上好～这套衣服也太好看了！提示写得好细，这周也拜托啦","l":2,"a":0},{"u":"https://x.com/saika_aiart/status/2098628246481072401","n":"saika_aiart","t":"フゼアさんプロンプト公開お疲れ様😆\n素晴らしき秋の雰囲気ですね！ /2099900858230321496","n":"Kshsb783142","t":"对，就是这种感觉。 不是让 AI 再给你一段“记得带护照和充电宝”，而是直接变成一个能填行程、自动出清单、还能勾着勾着心里踏实的东西。 现在越来越喜欢这种用法了，生活里那些小麻烦，真能被做成能用的小工具。","z":"对，就是这种感觉。 不是让 AI 再给你一段“记得带护照和充电宝”，而是直接变成一个能填行程、自动出清单、还能勾着勾着心里踏实的东西。 现在越来越喜欢这种用法了，生活里那些小麻烦，真能被做成能用的小工具。","l":2,"a":0},{"u":"https://x.com/siremass/status/2099882611908719034","n":"siremass","t":"想法落地非常贴切生活，把“有想法 → 盘清需求 → 交付成品”的闭环拉得很漂亮！不过想请教一下伟大大佬，在大模型用 4.1 Flash 连续吐出全套 HTML/JS 代码处理复杂的目的地气温数据和同行人头数量自适应乘积计算时，它的首屏渲染稳定性如何？第一轮生成会出现需要人手去手动修 Bug 的坏死代码吗？","z":"想法落地非常贴切生活，把“有想法 → 盘清需求 → 交付成品”的闭环拉得很漂亮！不过想请教一下伟大大佬，在大模型用 4.1 Flash 连续吐出全套 HTML/JS 代码处理复杂的目的地气温数据和同行人头数量自适应乘积计算时，它的首屏渲染稳定性如何？第一轮生成会出现需要人手去手动修 Bug 的坏死代码吗？","l":2,"a":0},{"u":"https://x.com/ameerah2y1/status/2100157108645683629","n":"ameerah2y1","t":"这个想法太实用了！比起让AI回答问题，直接用Flash搓一个能用的小程序才是AI的正确用法，自动根据目的地天气、交通、人数来调整清单，最后还有二次检查，细节满满，求个链接体验下！","z":"这个想法太实用了！比起让AI回答问题，直接用Flash搓一个能用的小程序才是AI的正确用法，自动根据目的地天气、交通、人数来调整清单，最后还有二次检查，细节满满，求个链接体验下！","l":1,"a":0},{"u":"https://x.com/sulaiman1566/status/2100130321874190674","n":"sulaiman1566","t":"I really like this approach. AI is becoming more powerful when it turns ideas into practical products, not just answers. 🔥","z":"很喜欢这个思路。AI 真正厉害的地方，是把想法变成能用的产品，而不只是给答案。🔥","l":1,"a":0}]},{"url":"https://x.com/pixelcave_john/status/2095780032165634344","type":"创造线","sub":"生活巧思","summary":"找工作时让 Claude 做一个求职申请追踪看板，结果它顺手做成了接近完整的 Web 应用；博主贴出了完整提示词。","highlight":"22 赞但 21 收藏：典型「一个生活刚需提示词 → AI 超预期交付」的创造线选题。","rep":"国内小白版：用豆包/Kimi/Cursor 提示词「帮我做求职进度表：公司、岗位、投递日、状态、面试反馈」；笔记给可复制提示词+表格/网页成品截图。标题：找工作太乱？让 AI 给你建看板。","author":"pixelcave_john","created":"2026-09-04 15:44","created_ts":1788507872,"fetched":"2026-10-13 04:22","fetched_ts":1791836520,"like":22,"bm":21,"rt":1,"view":2764,"rate":0.9545,"drafts":[],"cm":[]},{"url":"https://x.com/CharlieMolthrop/status/2088594831270428942","type":"创造线","sub":"AI加爱好","summary":"让 Claude 和 ChatGPT 各自画一幅水彩，唯一规则是「自己玩得开心」——两家竟然不约而同画了山水湖景。","highlight":"低互动但极强创造线：去掉题目约束后，AI「审美默认」撞车，适合做成趣味实验。","rep":"国内版：给豆包、DeepSeek、Kimi、通 lection of vibe coded libraries is better than using a commercial engine.","z":"不错！我都开始怀疑，一堆 vibe coding 出来的库是不是比商业引擎还好用了","l":4,"a":0},{"u":"https://x.com/skx_doom/status/2106861823849112023","n":"skx_doom","t":"I knowww and I've been an active user. Somehow a previous version of it wasn't able to download plugins too recently (with no errors shown) and the fact that it can't install an engine partially (that I really needed just a few days ago) made me create this sin.","z":"我知道，我也一直在用。但它之前有个版本下载插件莫名其妙失败还不报错，而且不能只装引擎的一部分（我前几天刚好急需），所以才造了这个孽。","l":3,"a":1},{"u":"https://x.com/LincolnMargison/status/2106763905796297137","n":"LincolnMargison","t":"Please do this for fab. Let's replace fab entirely. All I want is to see the god damn assets I already own where I can look through quixel stuff. Literally all I want to use it for and their UI completely forbids it.","z":"求你给 Fab 也做一个，干脆把 Fab 换掉。我就想看看自己已经买过的素材、翻翻 Quixel 的东西，就这么点要求，它的界面硬是不让。","l":2,"a":0},{"u":"https://x.com/OlexGameDev/status/2106756092642410876","n":"OlexGameDev","t":"Oh, no! Someone will train AI on that and steal the code!","z":"完了，肯定有人会拿它训练 AI 然后偷你代码！","l":2,"a":0},{"u":"https://x.com/topphamilia/status/2106871282537251129","n":"topphamilia","t":"building your own launcher just to never touch epic again is peak scratch your own itch. gamers are brutal to please but insanely loyal once you nail the exact annoyance","z":"为了再也不碰 Epic 专门造一个启动器，这才是「自己的痒自己挠」的巅峰。玩家很难伺候，但你一旦精准解决他们的痛点，他们就死忠到底","l":1,"a":0},{"u":"https://x.com/LocalStrangerSL/status/2106867696197677529","n":"LocalStrangerSL","t":"I got sick of Steam opening it's 2 windows every time I launch a game, so I copied the path of the .exe and fine tuned some other small options and now those games don't use launchers\n\nAlso just did Shortcuts to force kill Steam, Gamebar, and shut off my PC to avoid mouse clicks","z":"我受够了 Steam 每次开游戏都弹两个窗口，就直接复制游戏 exe 路径、调了点小设置，现在那些游戏都不走启动器了。还做了快捷方式一键强关 Steam、Game Bar 和关机，省得点鼠标","l":1,"a":0}]},{"url":"https://x.com/suraj_sharma14/status/2108014515715801338","type":"好玩线","sub":"AI翻车","summary":"对比 vibe coding 第 1 天和第 14 天：开头两小时做出完整 App 直呼神奇，两周后登录一刷新就挂、密钥写在前端、修一个 bug 冒出三个，连 AI 自己都搞不清怎么跑的。","highlight":"前 80% 像魔法，后 20% 像灾难——新手最容易踩的坑合集。","rep":"复刻：「用 AI 写代码的第 1 天 vs 第 14 天」；左右对比图+吐槽清单，附 3 条避坑提醒（别把密钥放前端、先做登录、定期备份）。","author":"suraj_sharma14","created":"2026-10-08 10:00","created_ts":1791424800,"fetched":"2026-10-13 02:25","fetched_ts":1791829500,"like":128,"bm":50,"rt":6,"view":10164,"rate":0.3906,"drafts":[],"cm":[{"u":"https://x.com/suraj_sharma14/status/2108048007946228172","n":"suraj_sharma14","t":"Vibe coding amplifies existing skills.","z":"Vibe coding 只会放大你本来就有的本事。","l":3,"a":1},{"u":"https://x.com/suraj_sharma14/status/2108625014379737327","n":"suraj_sharma14","t":"The baseline keeps shifting. What felt experimental 12 weeks ago is pretty normal now.","z":"门槛一直在变，12 周前还觉得很前卫的玩法，现在已经稀松平常了。","l":2,"a":1},{"u":"https://x.com/suraj_sharma14/status/2108624893869019327","n":"suraj_sharma14","t":"invoice is the final boss of vibe coding.","z":"开发票才是 vibe coding 的最终大 Boss。","l":2,"a":1},{"u":"https://x.com/suraj_sharma14/status/2108154755457617955","n":"suraj_sharma14","t":"Reading the repo later tells you what it does. It doesn't tell you what you rejected. A one-line decision note is how the last 20% stays reversible.","z":"以后翻代码能看出它干了啥，但看不出你否掉了哪些方案。随手记一行「为什么这么定」，最后那 20% 才改得回来。","l":2,"a":1},{"u":"https://x.com/suraj_sharma14/status/2108154474997178720","n":"suraj_sharma14","t":"Yeah. Basics first means you can tell the model what \"logged in\" should survive. Refresh, where the key lives, whether you can restore. The process is better because you're directing it not hoping.","z":"对，先把基础打牢，你才能告诉模型「登录状态」到底要扛住什么：刷新页面、密钥放哪、能不能恢复。你是在指挥它，而不是听天由命。","l":2,"a":1},{"u":"https://x.com/Ashyedra/status/2108149880934076922","n":"Ashyedra","t":"Day 14 is when you find out whether you built a product or a demo. The fix is boring: tests, backups, and actually reading what the agent wrote before you ship it.","z":"第 14 天你才知道自己做的是产品还是 demo。解决办法很无聊：写测试、做备份、上线前真的去读一遍 AI 写的东西。","l":2,"a":0},{"u":"https://x.com/suraj_sharma14/status/2108117344778346745","n":"suraj_sharma14","t":"First 80% is cheap. Last 20% is the career.","z":"前 80% 很便宜，最后 20% 才是真功夫。","l":2,"a":1},{"u":"https://x.com/suraj_sharma14/status/2108117211646980240","n":"suraj_sharma14","t":"Engineers have shipped keys in the client for years. The new part is how little time it took.","z":"工程师把密钥写进前端这种事干了好多年了，新鲜的是现在犯这个错快得离谱。","l":2,"a":1},{"u":"https://x.com/suraj_sharma14/status/2108116914446987287","n":"suraj_sharma14","t":"The AI forgot because it never held the system. It held the last prompt.","z":"AI 会忘，是因为它从来没装下整个系统，它只记得你上一句提示词。","l":2,"a":1},{"u":"https://x.com/suraj_sharma14/status/2108116783056171154","n":"suraj_sharma14","t":"It becomes a mess because nobody budgeted ownership. The code didn't rot. Attention did.","z":"代码会变烂，是因为没人留出精力去负责它。代码本身没腐烂，是注意力没了。","l":2,"a":1}]},{"url":"https://x.com/hocyzon/status/2104897373248147783","type":"好玩线","sub":"官方解读","summary":"解读复旦团队对 ChatGPT、DeepSeek、Grok、豆包、文心、元宝等引用源的研究：中外 AI 看的网页差很多，文心引用高度集中在少数域名，豆包偏字节系，元宝偏腾讯系。","highlight":"你问的是同一个问题，AI 翻的可能是完全不同的「书架」。","rep":"复刻：「同一个问题，中外 AI 翻的资料不一样」；用同一问题问豆包/DeepSeek/Kimi，对比它们列出的来源域名，做成表格图。","author":"hocyzon","created":"2026-09-29 19:33","created_ts":1790681615,"fetched":"2026-10-13 02:25","fetched_ts":1791829500,"like":74,"bm":56,"rt":4,"view":12710,"rate":0.7568,"drafts":[],"cm":[]},{"url":"https://x.com/Kodyykms4/status/2106472011941781559","type":"创造线","sub":"AI遇爱好","summary":"为万圣节练习，用 AI 生成特效妆容假伤疤参考图，效果逼真到自己都觉得「这也太真了」。","highlight":"AI 不当画家，先当化妆参考板，爱好党立刻用得上。","rep":"复刻：「万圣节妆容我先让 AI 练手」；用即梦/豆包生成伤疤、丧尸妆参考，再真人跟妆对比前后。","author":"Kodyykms4","created":"2026-10-04 03:50","created_ts":1791057038,"fetched":"2026-10-13 02:25","fetched_ts":1791829500,"like":73,"bm":2,"rt":4,"view":686,"rate":0.0274,"drafts":[],"cm":[]},{"url":"https://x.com/shakoistsLog/status/2096115014323351691","type":"好玩线","sub":"家人和AI","summary":"有人用 ,"a":0},{"u":"https://x.com/AliciaCrawoiue/status/2106575410603679832","n":"AliciaCrawoiue","t":"The frame I'd add: nobody running background agents pays for wall-clock, they pay per token. Sol taking 2x longer at 1/5th the cost is actually the better trade for overnight runs — you just parallelize. Astra wins the demo, Sol wins the cron job.","z":"补充一个角度：跑后台 Agent 的人不按时间付费，按 token 付费。Sol 慢一倍但只要五分之一的钱，挂一晚上跑反而更划算——多开几个并行就行。Astra 赢在演示，Sol 赢在定时任务。","l":2,"a":0},{"u":"https://x.com/jailbreakersAI/status/2106905969980748158","n":"jailbreakersAI","t":"Good actual example of where 6.1 sol actually dominates. It’s a good model. It’s getting too much stick on X.","z":"这是 6.1 Sol 真正碾压的好例子。它是个好模型，在 X 上被骂得有点冤。","l":2,"a":0},{"u":"https://x.com/JonDevX/status/2106840687367094716","n":"JonDevX","t":"I'd love to see more actual 3D comparisons between opus and astra","z":"想看更多 Opus 和 Astra 的 3D 对比","l":1,"a":0},{"u":"https://x.com/aydogandev/status/2106770607643770928","n":"aydogandev","t":"$0.64?","z":"才 0.64 美元？","l":1,"a":0}]},{"url":"https://x.com/preshdkumar/status/2096658132210532831","type":"创造线","sub":"AI加手艺","summary":"一位做科技产品的年轻人，靠问 AI 从零开始学木工，亲手做出了三张桌子：天台露台桌、餐桌、工作台，配了成品照片和制作过程视频。","highlight":"AI 不只帮你写字作图，还能当「师傅」：一个外行靠问 AI 学会木工，做出三件真能用的家具，从屏幕走到手上。","rep":"钩子：「零基础，我靠问 AI 学会了做桌子」。小白可换成任何手作：让 AI 按你家的尺寸出材料清单、步骤和避坑点（木工、钩针、做蛋糕都行），笔记按「问 AI 的原话 → 它给的方案 → 我做出来的成品」三步排，附可复制提问模板。","author":"preshdkumar","created":"2026-09-07 01:53","created_ts":1788717227,"fetched":"2026-10-12 19:08","fetched_ts":1791803280,"like":164,"bm":38,"rt":2,"view":8208,"rate":0.2317,"drafts":[],"cm":[]},{"url":"https://x.com/noclipepe/status/2106524342876037135","type":"好玩线","sub":"AI横向对比","summary":"博主隔了 11 天，用同一句提示词、同一张参考图，让 Opus 5.5 再画一次《飞屋环游记》的房子：发布当天那版云朵、屋瓦、窗户细节都更好，今天这版「像有人把画质调低了」，问大家是不是也觉得 AI 变弱了。","highlight":"「AI 自己和自己比」：同一个模型、同一句话，11 天后画质缩水，戳中了大家「AI 是不是偷偷降智」的共同疑问。","rep":"钩子：「同一句话，AI 第 1 天和第 11 天画的差这么多？」。挑一个你常用的 AI，存下今天的一条提示词和出图，过一两周原样再跑一遍，左右对比放大细节（云、屋顶、窗户），配一句「你觉得它是变聪明还是降智了」引导评论。","author":"noclip
