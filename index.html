<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>AI 选题池 · X 热帖雷达</title>
<style>
:root{--blue:#1d4ed8;--ink:#0b1220;--mute:#5b6577;--line:#e5e9f2;--soft:#eef3ff;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 60px}
header{border-bottom:3px solid var(--ink);padding-bottom:16px;margin-bottom:18px}
.brand{font-size:13px;letter-spacing:.18em;color:var(--blue);font-weight:700}
h1{font-size:30px;font-weight:900;letter-spacing:-.01em;margin-top:4px}
h1 b{color:var(--blue)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px}
.stat .v{font-size:22px;font-weight:800;line-height:1.2}
.stat .k{font-size:12px;color:var(--mute)}
.stat.main{background:var(--ink);color:#fff;border-color:var(--ink)}.stat.main .k{color:#c9d2e3}
.stat.blue .v{color:var(--blue)}
.upd{font-size:12px;color:var(--mute);margin-top:10px}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row+.row{margin-top:10px}
input[type=search]{flex:1 1 260px;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:15px;color:var(--ink);outline:none;font-family:inherit}
input[type=search]:focus{border-color:var(--blue)}
select{height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit;max-width:100%}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit;font-weight:600}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .c{opacity:.7;font-weight:500;margin-left:4px}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none;white-space:nowrap}
.tog input{width:18px;height:18px;accent-color:var(--blue)}
.count{font-size:13px;color:var(--mute);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;background:#fff;transition:box-shadow .15s}
.card:hover{box-shadow:0 8px 24px rgba(29,78,216,.08);border-color:#cdd8f5}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 10px;border-radius:6px;font-weight:700;background:var(--soft);color:var(--blue)}
.tag.t-好玩线{background:var(--blue);color:#fff}
.tag.t-创造线{background:var(--ink);color:#fff}
.tag.t-早期{background:#f1f3f7;color:var(--mute)}
.tag.done{background:#fff;color:var(--blue);border:1.5px solid var(--blue);padding:1px 9px}
.sum{font-size:16px;font-weight:700;line-height:1.5}
.hl{font-size:14px;color:var(--ink);background:var(--soft);border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 8px 8px 0}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:8px 0}
.m{text-align:center}.m b{display:block;font-size:15px;font-weight:800}.m span{font-size:11px;color:var(--mute)}
.m.rate b{color:var(--blue)}
.meta{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px}
.meta .au{color:var(--ink);font-weight:700}
details{font-size:14px}
summary{cursor:pointer;color:var(--blue);font-weight:700;list-style:none;padding:2px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ "}details[open] summary::before{content:"－ "}
details p{margin-top:6px;color:#283247;white-space:pre-wrap;word-break:break-word}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:2px}
.go{font-size:14px;font-weight:700}
.empty{padding:60px 0;text-align:center;color:var(--mute)}
.more{display:block;margin:20px auto 0;height:42px;padding:0 28px;border-radius:999px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.nav{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tab{height:38px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--ink);color:#fff}
.tab .c{font-weight:600;opacity:.75;margin-left:4px}
.navr{margin-left:auto;display:flex;gap:8px;align-items:center}
.sync{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--mute);background:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
.sync.ok{color:var(--blue);border-color:#c7d5fb;background:var(--soft)}
.sync.fail{color:#b42318;border-color:#f3c3be;background:#fff5f4}
.sync.ing{color:var(--blue)}
.icon{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;cursor:pointer;color:var(--ink)}
.star{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.star.on{border-color:var(--blue);color:var(--blue);background:var(--soft)}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--blue);background:var(--blue);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.plain{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.danger{background:#fff;color:#b42318;border-color:#f3c3be}
.notice{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--soft);color:var(--ink);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.fail{background:#fff5f4;color:#b42318}
.notice a{font-weight:700;cursor:pointer}
.fcard .ttl{font-size:16px;font-weight:700;line-height:1.5;word-break:break-word;color:var(--ink)}
.fcard .ttl:hover{color:var(--blue)}
.fcard .url{font-size:12px;color:var(--mute);word-break:break-all}
.fcard .note{font-size:14px;background:var(--soft);border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 8px 8px 0;white-space:pre-wrap;word-break:break-word}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{height:32px;padding:0 12px;border:0;background:#fff;color:var(--mute);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--blue);color:#fff}
.ftag{font-size:12px;padding:2px 9px;border-radius:6px;background:#f1f3f7;color:var(--ink);font-weight:600}
.acts{display:flex;gap:8px;margin-left:auto}
.lnk{background:none;border:0;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;padding:4px}
.lnk.red{color:#b42318}
.mask{position:fixed;inset:0;background:rgba(11,18,32,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(11,18,32,.25)}
.dlg h3{font-size:18px;font-weight:900;margin-bottom:4px}
.dlg .hint{font-size:13px;color:var(--mute);margin-bottom:12px}
.dlg label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.dlg input,.dlg textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;font-family:inherit;color:var(--ink);outline:none}
.dlg textarea{min-height:76px;resize:vertical}
.dlg input:focus,.dlg textarea:focus{border-color:var(--blue)}
.dlg .sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dlg .sug button{font-size:12px;padding:2px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit}
.dlg .ops{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dlg .ops .sp{flex:1}
.dlg .err{color:#b42318;font-size:13px;margin-top:8px;min-height:1em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw}
@media (max-width:640px){
 .tab{padding:0 12px;font-size:14px}
 .nav{flex-wrap:nowrap}
 .mask{align-items:flex-end;padding:0}
 .dlg{border-radius:18px 18px 0 0;max-height:88vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
 .dlg .ops .btn{flex:1}
 .fbar .btn{flex:1}
}
@media (max-width:640px){
 .wrap{padding:16px 14px 40px}
 h1{font-size:24px}
 .stat{min-width:0;flex:1 1 28%;padding:6px 10px}.stat .v{font-size:18px}
 .grid{grid-template-columns:1fr;gap:12px}
 .bar{position:static;padding:10px 0}
 .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .chips::-webkit-scrollbar{display:none}
 .chip{flex:0 0 auto}
 select{flex:1 1 40%;min-width:0}
 .count{margin-left:0;width:100%}
 .m b{font-size:14px}
}
/* ===== v2 卡片 ===== */
.grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;align-items:start}
.card{border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;gap:12px;box-shadow:none}
.card:hover{box-shadow:0 10px 28px rgba(29,78,216,.07);border-color:#d3ddf6}
.ctop{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;line-height:1}
.line{font-weight:800;letter-spacing:.06em;padding:5px 9px;border-radius:6px;background:var(--blue);color:#fff}
.line.l-create{background:var(--ink)}
.line.l-old{background:#f1f3f7;color:var(--mute)}
.csub{color:var(--mute);font-weight:600}
.done2{margin-left:auto;font-weight:800;color:var(--blue);border:1.5px solid var(--blue);padding:3px 8px;border-radius:6px}
.ttl2{font-size:18px;font-weight:800;line-height:1.45;letter-spacing:-.005em;color:var(--ink);word-break:break-word}
.heat{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:2px 0}
.big{display:flex;align-items:baseline;gap:4px;line-height:1}
.big b{font-size:34px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
.big.hot b{color:var(--blue)}
.big span{font-size:13px;font-weight:700;color:var(--mute)}
.minor{font-size:12px;color:var(--mute);line-height:1.5;flex:1;min-width:150px;padding-bottom:3px}
.minor i{font-style:normal;color:#c3c9d6;margin:0 4px}
.hbm{font-size:12px;font-weight:800;color:var(--blue);background:var(--soft);padding:4px 8px;border-radius:6px;align-self:center}
.idea{border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.idea summary{list-style:none;cursor:pointer;color:var(--ink);font-weight:500;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea summary::-webkit-details-marker{display:none}
.idea summary::before{content:none}
.idea[open] summary{display:none}
.idea summary::before,.idea[open] summary::before{content:none!important}
.minor span{white-space:nowrap}
.minor span+span::before{content:"·";margin:0 6px;color:#c3c9d6}
.idea .k{font-size:12px;font-weight:800;color:var(--blue);margin-right:6px}
.idea .more2{color:var(--blue);font-weight:700;font-size:13px;white-space:nowrap}
.idea[open] .more2{display:none}
.idea .full{margin-top:0;display:flex;flex-direction:column;gap:8px}
.idea .full p{margin:0;color:#283247;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.idea .full .k{display:block;margin-bottom:2px}
.idea .fold{align-self:flex-start;background:none;border:0;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:0;font-family:inherit}
.cm{background:#f7f9fd;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.cm .hd{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink);letter-spacing:.04em}
.cm .tg{background:none;border:0;color:var(--blue);font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;padding:0}
.cmt{font-size:13.5px;line-height:1.6}
.cmt+.cmt{border-top:1px dashed #dfe5f0;padding-top:9px}
.cmt p{margin:0;color:var(--ink);word-break:break-word;white-space:pre-wrap}
.cmt p.o{color:#3b4558}
.cmt .cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:11.5px;color:var(--mute)}
.cmt .cmeta b{color:var(--ink);font-weight:700}
.cmt .au2{color:#fff;background:var(--blue);font-weight:800;font-size:10.5px;padding:1px 5px;border-radius:4px}
.cmt .lk{color:var(--blue);font-weight:700}
.cmt .sw{background:none;border:0;color:var(--blue);font-weight:700;font-size:11.5px;cursor:pointer;padding:0;font-family:inherit}
.cmt .likes{font-weight:700;color:var(--ink)}
.cm .rest[hidden]{display:none}
.cfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.cfoot .who{font-size:12px;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfoot .who b{color:var(--ink);font-weight:700}
.go2{height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}
.go2:hover{background:var(--blue)}
.fnote{font-size:14px;line-height:1.6;color:var(--ink);border-left:3px solid var(--blue);padding:2px 0 2px 10px;white-space:pre-wrap;word-break:break-word}
.fnote.empty{color:var(--mute);border-left-color:var(--line);font-size:13px}
.ftags{display:flex;flex-wrap:wrap;gap:6px}
.fcard .seg{align-self:flex-start}
.fsrc{font-size:12px;color:var(--mute);word-break:break-all}
.chips{flex-wrap:wrap}
@media (max-width:640px){
 .grid{grid-template-columns:1fr;gap:14px}
 .card{padding:16px 15px 12px;border-radius:16px}
 .ttl2{font-size:17px}
 .big b{font-size:30px}
 .chips{flex-wrap:wrap;overflow:visible}
 .chip{height:32px;padding:0 11px;font-size:13px}
 .chip .c{margin-left:3px}
 .cfoot .who{flex-basis:100%}
 .cfoot .sp2{flex:1}
}
.trash{width:30px;height:30px;flex:0 0 30px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;color:#a3abba;border-radius:8px;cursor:pointer;margin:-6px -6px -6px 2px}
.trash:hover{color:var(--ink);background:#f1f3f7}
.sp3{flex:1}
.ctop .done2{margin-left:0}
.toast.act{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 18px}
.toast.act button{background:none;border:0;color:#9db7ff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;padding:4px 8px}
.btn.sm{height:32px;padding:0 14px;font-size:13px;border-radius:999px}
.btn:disabled{opacity:.45;cursor:default}
.tcard .ttl2{font-size:16px;color:#3b4558}
.tcard .big b{font-size:24px}
@media (max-width:640px){.nav{flex-wrap:wrap!important}.tab{padding:0 10px;font-size:13.5px;white-space:nowrap}.navr{gap:6px;margin-left:auto}.sync{padding:4px 8px}}
.tab{white-space:nowrap}
</style>
</head><body><div class="wrap">
<header>
 <div class="brand">X → 小红书 · 选题池</div>
 <h1>AI 热帖<b>雷达</b></h1>
 <div class="stats" id="stats"></div>
 <div class="upd" id="upd"></div>
</header>
<div class="nav">
 <button class="tab on" data-v="pool">话题池</button>
 <button class="tab" data-v="fav">我的收纳<span class="c" id="favN">0</span></button>
 <button class="tab" data-v="trash">废纸篓<span class="c" id="trashN">0</span></button>
 <div class="navr"><button class="sync" id="syncB" title="同步状态">仅本机</button><button class="icon" id="setB" title="同步设置" aria-label="同步设置">⚙</button></div>
</div>
<section id="poolView">
<div class="bar">
 <div class="row"><input type="search" id="q" placeholder="搜索摘要、亮点、复刻思路、热评、作者…"></div>
 <div class="row chips" id="chips"></div>
 <div class="row">
  <select id="sub"><option value="">全部子题</option></select>
  <select id="sort">
   <option value="fetched">最新抓取</option>
   <option value="like">点赞最多</option>
   <option value="bm">收藏最多</option>
   <option value="rate">收藏率最高</option>
  </select>
  <label class="tog"><input type="checkbox" id="undone">只看未成稿</label>
  <span class="count" id="count"></span>
 </div>
</div>
<main class="grid" id="grid"></main>
<button class="more" id="more" hidden>加载更多</button>
</section>
<section id="favView" hidden>
 <div id="favNotice"></div>
 <div class="bar fbar">
  <div class="row"><input type="search" id="fq" placeholder="搜索收纳的标题、备注、链接…"><button class="btn" id="addB">＋ 添加我自己看到的</button><button class="btn ghost" id="expB">导出 JSON</button></div>
  <div class="row chips" id="fst"></div>
  <div class="row chips" id="ftags"></div>
 </div>
 <main class="grid" id="fgrid"></main>
</section>
<section id="trashView" hidden>
 <div id="trashNotice"></div>
 <div class="bar tbar"><div class="row"><span class="count" id="trashInfo" style="margin-left:0"></span><span style="flex:1"></span><button class="btn danger" id="purgeB">清空废纸篓</button></div></div>
 <main class="grid" id="tgrid"></main>

制作。AI 帮你干活，还反过来推荐竞品。","highlight":"7 个 Grok Bot 帮做动画，带头的却劝他改回 ChatGPT。","rep":"复刻：一句话「雇了 7 个 AI 助手，带头的劝我换家」，配图一排机器人里站出来一个指向对面 ChatGPT 大门，底部大字「自己人劝跳槽」。正文写成短对话。","author":"DougTenNapel","created":"2026-10-06 11:32","created_ts":1791257541,"fetched":"2026-10-15 18:20","fetched_ts":1792059600,"like":179,"bm":5,"rt":3,"view":5363,"rate":0.0279,"drafts":[],"cm":[{"u":"https://x.com/LowellHeddings/status/2107439171870536132","n":"LowellHeddings","t":"I’ve found that grok bot requires significant rules to get what you want right now. \n\nThe speed update was great but it seems like it made grok bot slightly dumber on some things. \n\nI’m going to stick it out though. I trust Elon way more for a personal assistant bot.","z":"我发现现在想让 Grok Bot 听话，得先写一堆规则。速度更新挺好，但有些事它好像变笨了一点。我还是会继续用，个人助理这块我更信 Elon。","l":6,"a":0},{"u":"https://x.com/DougTenNapel/status/2107518424108957756","n":"DougTenNapel","t":"I will punish him!","z":"我要惩罚它！","l":4,"a":1},{"u":"https://x.com/cale_ai/status/2107324496658993582","n":"cale_ai","t":"I once had grok tell me back when It was free something about not getting premium just for him because he was free, or something like that. \n\nEither way I hope your movie gets made, after knowing what you were responsible for involving things in my past, I really am curious about","z":"以前免费版的时候，Grok 还劝我别为了它开会员，说它本来就是免费的之类的。不管怎样，希望你的电影能做成。","l":3,"a":0},{"u":"https://x.com/DougTenNapel/status/2107817447399309351","n":"DougTenNapel","t":"The first watchable fairy tale for the family!","z":"第一部全家能看的童话！","l":2,"a":1},{"u":"https://x.com/cfryant/status/2107461957716496810","n":"cfryant","t":"Just get rid of whichever bot said that.","z":"把说这话的那个 bot 干掉就行。","l":2,"a":0},{"u":"https://x.com/cfryant/status/2107518578274496832","n":"cfryant","t":"You need a bots breakfast club room.","z":"你需要一个 bot 版《早餐俱乐部》聊天室。","l":1,"a":0},{"u":"https://x.com/Adrian_Bisson/status/2107496519653879827","n":"Adrian_Bisson","t":"have your bots install and use Grok Build or Codex on their compu 帖）","l":2,"a":1},{"u":"https://x.com/JacksonKingai/status/2106230018493861911","n":"JacksonKingai","t":"Figma becoming more and more un needed","z":"Figma 越来越不需要了","l":1,"a":0},{"u":"https://x.com/iancarscadden/status/2106088747645431844","n":"iancarscadden","t":"Has potential to collapse on scroll down","z":"往下滑的时候有可能会崩","l":1,"a":0},{"u":"https://x.com/AOuglhacen/status/2106056886110106002","n":"AOuglhacen","t":"Actually figma looks more pro","z":"其实 Figma 那版看着更专业","l":1,"a":0},{"u":"https://x.com/TomerBuildes/status/2106018783148073426","n":"TomerBuildes","t":"This time I’m going with Chat. I feel like it’s cleaner","z":"这次我选 ChatGPT，感觉它更干净","l":1,"a":0},{"u":"https://x.com/Darockwildin/status/2106014953127772592","n":"Darockwildin","t":"I like elementa from all three. Claude is visually pleasing","z":"三个里我喜欢 Elementa。Claude 的视觉最舒服","l":1,"a":0}]},{"url":"https://x.com/designwkarthick/status/2108869952954658887","type":"好玩线","sub":"AI懂你吗","summary":"博主晒出自己的 AI 订阅账单：ChatGPT 每月 100 美元到期不续了；Claude 20 美元准备升到 100；SuperGrok 还有两个月；Grok Bot 其实在用 Claude Opus。一张清单把「我到底在向哪家 AI 交月费」摆到台面上，评论区吵翻。","highlight":"一张 AI 订阅账单，比任何测评都更能说明你真正站哪边。","rep":"复刻：一句话「晒晒你的 AI 月费清单，哪家最舍不得砍」，配图一张手写/表格账单（ChatGPT / Claude / 豆包 / 通义…金额+「续/砍」标签），底部大字「我的 AI 房租」。正文邀请评论区晒自家账单，讨论哪家最懂你、哪家只是习惯性续费。","author":"designwkarthick","created":"2026-10-10 18:39","created_ts":1791628752,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":290,"bm":65,"rt":3,"view":60676,"rate":0.2241,"drafts":[],"cm":[{"u":"https://x.com/JongeyB/status/2108945625379176468","n":"JongeyB","t":"Similarish. Anthropic may have the best models right now, but I hate their moralizing. I got the $100 OpenAI plan to test dots (it's garbage). Grok may not be the best but it works. And GrokBot is absolutely amazing. My Google account is too important to risk being banned.","z":"差不多。Anthropic 模型现在可能最强，但我受不了它的说教。我开了 OpenAI 100 刀套餐测 dots（很烂）。Grok 未必最强但能干活。Grok Bot 真的绝。Google 账号太重要，不敢拿去冒险被封。","l":8,"a":0},{"u":"https://x.com/designwkarthick/status/2108946126934290915","n":"designwkarthick","t":"yeahh grok bot is good, i am using daily :)","z":"嗯嗯 Grok Bot 挺好，我天天在用 :)","l":3,"a":1},{"u":"https://x.com/AdarshMi18/status/2108980210893037848","n":"AdarshMi18","t":"Claude $20","z":"Claude 20 刀","l":2,"a":0},{"u":"https://x.com/ZoForLife1/status/2108975566389207173","n":"ZoForLife1","t":"My AI stack 💸\n\n1. ChatGPT Pro - $200\n    Keeping.\n2. Claude Max - $200\n    Expires Oct 16.\n3. Grokbot - $100\n    Expires Oct 26.\n\nClaude beats ChatGPT in most areas, especially coding.\n\nBut ChatGPT’s ecosystem with my dot has made me far more money.\n\nGoing all in on ChatGPT.","z":"我的 AI 账单：ChatGPT Pro 200 刀续；Claude Max 200 刀 10/16 到期；Grokbot 100 刀 10/26 到期。Claude 多数场景尤其写代码赢 ChatGPT，但 ChatGPT + 我的 dot 帮我赚了更多钱。全面押 ChatGPT。","l":2,"a":0},{"u":"https://x.com/madebykamil/status/2108968110011158921","n":"madebykamil","t":"Same story here, 80% of my week gone by Saturday. The $100 plan makes sense then. What stretched it for me: routine steps on a cheaper model, the top one only for the hard calls.","z":"一样，到周六一周额度就用了 80%。那时 100 刀套餐才说得通。我的省钱法：日常步骤用便宜模型，难题才上顶级。","l":2,"a":0},{"u":"https://x.com/nexgencoded/status/2108955969225195629","n":"nexgencoded","t":"this is becoming the new SaaS stack problem 😭 you start with “one AI tool” and somehow end up paying for 4 models that overlap by 70%","z":"这正在变成新的 SaaS 堆栈病😭 从「一个 AI 工具」开始，不知不觉为 4 个重叠 70% 的模型付钱","l":2,"a":0},{"u":"https://x.com/madebykamil/status/2108949222061908465","n":"madebykamil","t":"Before jumping to the $100 tier, track for a week which tasks actually hit the $20 limit. For a lot of people it's one or two heavy workflows, and that decides whether the upgrade pays off or a cheaper second model covers it.","z":"先别急着升 100 刀档，先追踪一周哪些任务真撞上 20 刀上限。很多人其实就一两个重活，决定该升级还是再加一个便宜模型就够。","l":2,"a":0},{"u":"https://x.com/QuantBit_Realm/status/2109220627261624463","n":"QuantBit_Realm","t":"as @JensenHuang says if you dont burn them you are not a productive guy in future\n\nGPT - $200\nClaude - $200\nGrok Heavy - $300\nDevin Max - $200\nGemini Ultra - $200\nopenrouter+Jev+Opencoude +topup = $50\n\n$1150 to the future https://t.co/KBqkM5XKeu","z":"按黄仁勋的话说，不烧额度就不是未来的生产力：GPT200+Claude200+Grok Heavy300+Devin200+Gemini Ultra200+一堆小工具50，一共 1150 刀砸向未来（链接见原帖）","l":1,"a":0},{"u":"https://x.com/niko70129972/status/2109114329174045119","n":"niko70129972","t":"Can Grok Bot use Claude Opus directly? What are the usage limits?\n\nI'm considering downgrading my Codex subscription from $100 to $20 per month.","z":"Grok Bot 能直接用 Claude Opus 吗？额度限制怎样？我在考虑把 Codex 从 100 刀降到 20 刀/月。","l":1,"a":0}]},{"url":"https://x.com/RishiUvaach/status/2091880711234183426","type":"创造线","sub":"创作方法","summary":"有人说「我不会写代码」就停了；有人打开 Cursor+Claude Code，先糊一版、弄坏、修好、继续推。作者说：这道行动鸿沟，正在比技能鸿沟更致命。","highlight":"创造方法向金句帖，收藏高，适合做成「别等会了再开始」小红书狠话。","rep":"狠话：卡着你的不是不会，是不敢先弄坏一版。配图：左「我不会」站桩，右「Cursor+Claude」碎了又拼上的草图。","author":"RishiUvaach","created":"2026-08-24 21:30","created_ts":1787578201,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":274,"bm":261,"rt":79,"view":17407,"rate":0.9526,"drafts":[],"cm":[]},{"url":"https://x.com/MilksandMatcha/status/2091920183812329904","type":"好玩线","sub":"AI横向对比","summary":"作者让 Claude 和自己比赛：同一个模型、同一句提示、同一个空项目，只是分别放进两套不同的「工作外壳」（Claude Code 和 Droid）里去完成同一个克隆网站任务。结论是最聪明的模型不一定就是最好用的助手，外壳和工具决定了结果。","highlight":"同一个 Claude，换个「身体」，结果判若两人。","rep":"复刻：一句话「同一个 AI 大脑，换个壳就变了个人」，配图两个一模一样的大脑分别装进两台不同的机器人，各自交出一份作品，底部大字「同脑 ≠ 同结果」。正文用白话解释「模型 vs 工具」的区别。","author":"MilksandMatcha","created":"2026-08-25 00:06","created_ts":1787587612,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":156,"bm":72,"rt":16,"view":106917,"rate":0.4615,"drafts":[],"cm":[]},{"url":"https://x.com/Tegadesigns/status/2109328180578484312","type":"好玩线","sub":"AI横向对比","summary":"设计师的「同题三答」又一期：同一句提示词分别交给 Claude、ChatGPT 和 Figma Make 做设计稿，三张结果并排，让大家在评论区选赢家。","highlight":"固定栏目、固定三家选手，每期换题，观众已经养成了来投票的习惯，评论区很热闹。","rep":"复刻角度：做成自己的固定栏目「同题三答」，每期挑一个生活化的设计题（如菜单、海报、名片），三个 AI 同一句提示词，三图并排编号，让评论区投 created":"2026-10-12 02:33","created_ts":1791743621,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":58,"bm":20,"rt":0,"view":40566,"rate":0.3448,"drafts":[],"cm":[{"u":"https://x.com/michaelkoper/status/2109375658673795269","n":"michaelkoper","t":"Maybe I’m living in the past but I don’t buy it at all. You do games right? I rather have somebody skilled making a game and not AI for myself. \n\nI do B2B, my clients want to focus on their core thing and are happily paying 49/month for the thing I’m making.","z":"可能我是老古董吧，但我一点都不信。你是做游戏的对吧？我宁愿让真正懂行的人做游戏，也不想让 AI 给我现做一个。我做 B2B 的，客户只想专心干自己的主业，每月 49 刀付得很开心。","l":4,"a":0},{"u":"https://x.com/juanjovn/status/2109415806056403378","n":"juanjovn","t":"Because it means my current income goes down to zero lol","z":"因为这意味着我现在的收入要归零了哈哈","l":3,"a":1},{"u":"https://x.com/heyitzami/status/2109380045349552475","n":"heyitzami","t":"I personally feel that, yeah, micro apps are right around the corner, but once people get frustrated by them, they’ll likely move to established ones again\n\nWe’re used to go back and forth with the machines but I don’t know if most would bother","z":"我觉得微型 App 确实快来了，但人们被它们折腾烦了以后，大概率还是会回到成熟的产品上。我们习惯了跟机器来回磨，但大多数人未必有这个耐心。","l":2,"a":0},{"u":"https://x.com/neilsuperduper/status/2109443872870821923","n":"neilsuperduper","t":"i for one am glad to be unchained from my keyboard typing shackles.\n\nonto better more ambitious things.","z":"反正我很高兴终于不用被键盘锁着打字了，可以去干更有野心的事。","l":1,"a":0},{"u":"https://x.com/juanjovn/status/2109419189434028107","n":"juanjovn","t":"Hey! I guess a 20€/mo ChatGPT Plus is a good starting point.\n\nJust talk to it! it will guide you in pretty much everything.","z":"嘿！我觉得 20 欧一个月的 ChatGPT Plus 是个不错的起点。直接跟它聊就行！几乎什么它都能一步步带你。","l":1,"a":1},{"u":"https://x.com/LuisMar63616901/status/2109415664759026156","n":"LuisMar63616901","t":"In my 60s and would love to be applying AI all the time.\nHow to start ?","z":"我六十多岁了，也很想天天用上 AI，该从哪开始？","l":1,"a":0},{"u":"https://x.com/Moebius1974/status/2109412858949681435","n":"Moebius1974","t":"10 or 20 micro apps= a mid size app.\nI have never used like 95% of the capabilities of MS word and neither have the bulk of it's users.\nWe won't recreate it because we don't need it.\nWe will recreate notepad with a few extra functions specific to use added to it.","z":"10 到 20 个微型 App 就等于一个中型软件了。Word 95% 的功能我从来没用过，大多数人也一样。我们不会去重做一个 Word，因为用不上；我们会重做一个记事本，再加几个自己专用的小功能。","l":1,"a":0},{"u":"https://x.com/ewasniecinska/status/2109380037174567202","n":"ewasniecinska","t":"Ask your mom to ask her friends about Gemini. Mom is using Claude a lot, zero her friends even know what that is.","z":"让你妈去问问她朋友们知不知道 Gemini。我妈天天用 Claude，她朋友一个都不知道那是啥。","l":1,"a":0}]},{"url":"https://x.com/Nexuist/status/2088419584772890643","type":"创造线","sub":"AI加手艺","summary":"有人用 Claude 直接生成 3D 模型文件，把品牌 logo 做进地漏/下水道盖，再用 3D 打印机打出来。原本需要会建模才能做的小定制，现在一句话描述 + 一台打印机就能完成。","highlight":"让 AI 画图纸，3D 打印出带 logo 的下水道盖。","rep":"复刻：一句话「不会建模，也能打印一个专属地漏盖」，配图对话框「帮我做个带猫爪图案的地漏盖」→ 3D 模型线框 → 实物照片三连，底部大字「0 建模基础」。正文：AI 出模型文件→切片→打印的三步。","author":"Nexuist","created":"2026-08-15 08:16","created_ts":1786753004,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":44,"bm":0,"rt":0,"view":1447,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/IamMuhammadMuiz/status/2106225452360609819","type":"好玩线","sub":"AI横向对比","summary":"同一提示词对比 ChatGPT、Claude、Figma Make 出图效果，让读者选更喜欢哪家。","highlight":"玩法成熟、截图直观，适合新手跟做同题对比。","rep":"复刻同题三答：中文提示词 + 三款国内 AI 出图，标题用「同一句，三张脸」。","author":"IamMuhammadMuiz","created":"2026-10-03 11:30","created_ts":1790998254,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":40,"bm":19,"rt":2,"view":2681,"rate":0.475,"drafts":[],"cm":[]},{"url":"https://x.com/IamMuhammadMuiz/status/2106250489876607120","type":"好玩线","sub":"AI横向对比","summary":"同一句提示词分别丢给 ChatGPT、Claude、Figma Make，三家出图/设计差异拉满，让网友投票选边。","highlight":"同题三答投票体，和池子里 Tegadesigns 系列同款结构，可做新一轮对比。","rep":"复刻：用同一句中文提示分别问豆包、即梦、通义；三格对比卡 + 评论区投票；钩子「同一句话，三个 AI 三种审美」。","author":"IamMuhammadMuiz","created":"2026-10-03 13:10","created_ts":1791004223,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":39,"bm":9,"rt":3,"view":2856,"rate":0.2308,"drafts":[],"cm":[]},{"url":"https://x.com/Priyannkaaaa/status/2107843646305579058","type":"好玩线","sub":"AI梗","summary":"程序员吐槽：老板以为 AI 让开发更快，其实我的流程是挨个问 Claude、Gemini、ChatGPT、DeepSeek、Cursor、GLM，对比所有答案，再让 Claude 评 Gemini、让 Gemini 评 Claude，最后自己写了 5 行。","highlight":"问遍 6 个 AI 让它们互相打分，最后 5 行代码还是自己写的。","rep":"复刻：做成打工人版梗图清单「老板以为我用 AI 效率翻倍，其实我……」：问豆包、问 DeepSeek、问 Kimi、让它们互相挑错、最后自己手写。可以换成写周报、做 PPT 的版本，更贴近小白。标题「老板以为 AI 让我效率翻倍，真相是这样的」。","author":"Priyannkaaaa","created":"2026-10-07 22:41","created_ts":1791384061,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":16,"bm":4,"rt":1,"view":1813,"rate":0.25,"drafts":[],"cm":[]},{"url":"https://x.com/nifinet/status/2094154220698214557","type":"创造线","sub":"创作方法","summary":"作者的做法：找一支自己喜欢的产品发布视频，让 Claude Code 照着它的节奏和风格，给自己的产品写一支新的。一行提示词、38 分钟出第一版、全程没开 After Effects，做出了一支 68 秒的发布短片。","highlight":"丢给 AI 一支你喜欢的宣传片，它照着给你拍一支。","rep":"复刻：一句话「照着喜欢的片子，让 AI 仿一支」，配图左「参考视频」右「我的新片」两个时间轴节奏对齐，底部大字「38 分钟 / 0 个 AE」。正文：选参考→让 AI 拆节奏→替换成自己的内容。","author":"nifinet","created":"2026-08-31 04:04","created_ts":1788120248,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":15,"bm":5,"rt":3,"view":2192,"rate":0.3333,"drafts":[],"cm":[]},{"url":"https://x.com/iSm1le_/status/2109253603487883657","type":"创造线","sub":"为家人做的东西","summary":"博主注意到很多老人不太会用微信，子女又总担心他们，于是花一个晚上用 AI 做了个「一键给子女报平安」的简单小工具，挂在闲鱼 15 元一份，卖出了 300 多份。他的感受是：AI 让做工具变得很便宜，真正值钱的是发现需求的眼睛。","highlight":"一个晚上用 AI 做个「报平安」按钮，卖了 300 多份。","rep":"复刻：观察家里老人最常卡住的一件事（报平安、吃药提醒、看大字天气），对 AI 说「我爸妈不太会用手机，帮我做一个只有一个大按钮的网页，按下就给我发一条『我很好』的消息」，跟着 AI 一步步做出来，装到爸妈手机桌面。拍下爸妈第一次用的反应。标题「给爸妈做了个『一键报平安』，一个晚上就好了」。","author":"iSm1le_","created":"2026-10-11 20:03","created_ts":1791720221,"fetched":"2026-10-15 17:20","fetched_ts":1792056000,"like":8,"bm":0,"rt":0,"view":508,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/funkymetax/status/2109017800035737760","type":"创造线","sub" e 全是公事。我跟它聊过记忆系统对比，它自己也说不会保存关于你的性格结论。（链接见原帖）","l":3,"a":0},{"u":"https://x.com/xodud_rkd/status/2109212193866842451","n":"xodud_rkd","t":"Gpt still best for chat.","z":"聊天还是 GPT 最强。","l":3,"a":0},{"u":"https://x.com/AI_kotoba_omote/status/2109503845684674844","n":"AI_kotoba_omote","t":"悩むのすごいわかる\nメモリ移行できなかったっけ？\n愛着は分かるけどね\nぼくもclaude 100ドル視野に入れはじめた","z":"好懂这种纠结。记忆好像迁不过去吧？舍不得也懂。我也开始把 Claude 100 刀放进视野了。","l":2,"a":0},{"u":"https://x.com/TFWNicholson/status/2109239940479426835","n":"TFWNicholson","t":"Switched, regretted not switching sooner","z":"换了，后悔没早点换","l":2,"a":0}]},{"url":"https://x.com/0xwhrrari/status/2105659010384888096","type":"创造线","sub":"创作方法","summary":"创作者说 Claude Opus 做动态设计离谱：把一段提示词丢进 Claude Code，就能把粗想法跑成整套工作室流程——概念→分镜→视觉系统→动画→声音→成片。附可复制提示词和完整指南，收藏破百。","highlight":"一条提示词，把「大概有个想法」变成工作室级动效流水线。","rep":"复刻：一句话「不会动效也没关系，一条提示词跑完整条片」，配图流水线六格：想法→分镜→视觉→动画→声音→成片，底部大字「1 条 Prompt · 6 步成片」。正文给小白简化版：先让 AI 帮你写分镜表，再逐镜生图/转视频，强调「先流程后工具」。","author":"0xwhrrari","created":"2026-10-01 22:00","created_ts":1790863203,"fetched":"2026-10-15 15:20","fetched_ts":1792048800,"like":104,"bm":109,"rt":14,"view":7917,"rate":1.0481,"drafts":[],"cm":[{"u":"https://x.com/itsthedonhashim/status/2105666557946847390","n":"itsthedonhashim","t":"one thing to watch out for is overcomplicating the storyboard phase. Keep it simple and clear, or you’ll end up drowning in revisions later.","z":"分镜阶段小心别过度复杂化。保持简单清晰，不然后面会被来回改淹死。","l":1,"a":0},{"u":"https://x.com/akarixbt/status/2105660539573788953","n":"akarixbt","t":"the best prompt for motion engineering","z":"做动效工程最好的提示词","l":1,"a":0},{"u":"https://x.com/de1lymoon/status/2105659942002962751","n":"de1lymoon","t":"never use motion design in Opus, but i think this prompt is help me","z":"从没在 Opus 里做过动效，但感觉这条提示词能帮到我","l":1,"a":0},{"u":"https://x.com/elune0x/status/2105659533599162384","n":"elune0x","t":"really is the best prompt and the article is just as hell","z":"真的是最好的提示词，那篇文章也绝了","l":1,"a":0}]},{"url":"https://x.com/8BitClosedFist/status/2095218046294274534","type":"好玩线","sub":"AI梗","summary":"博主一直以为 vibe coding 是「戴着耳机听 lo-fi、业余时间写着玩」；后来才明白：所谓 vibe coded，其实就是 Made With AI。一瞬间的世界观崩塌，评论区集体破防。","highlight":"我以为 vibe coding 是听音乐写代码，原来就是「用 AI 写的」。","rep":"复刻：一句话「原来 vibe coding 不是氛围编程，是 AI 编程」，配图左右对比：左边耳机+咖啡+笔记本的「氛围感」，右边对话框里蹦出整页代码，底部大字「我误会了两个字」。正文可以列几个被重新定义的黑话（vibe coding / ship / agent），做成梗图轮播。","author":"8BitClosedFist","created":"2026-09-03 02:31","created_ts":1788373884,"fetched":"2026-10-15 15:20","fetched_ts":1792048800,"like":37,"bm":1,"rt":3,"view":1221,"rate":0.027,"drafts":[],"cm":[]},{"url":"https://x.com/chetanankola/status/2109541872800833696","type":"创造线","sub":"创意项目","summary":"用 Claude + Three.js 在浏览器里做了一个「死后泳池派对」万圣节 3D 场景：吊着的幽灵、西瓜灯笼、永远在度假的骷髅，海边泳池 vibe。一个人就能把脑洞做成可互动的网页体验。","highlight":"给死后世界开了个泳池派对——一个人用 AI 搭出可逛的 3D 网页。","rep":"复刻：一句话「我想给骷髅开泳池派对，AI 帮我搭了个 3D 网页」，配图一帧泳池+幽灵+骷髅躺椅画面，底部大字「脑洞 → 可逛网页」。正文鼓励小白：先用文字描述一个荒诞小场景→让 AI 生成 Three.js/网页代码→发给朋友当电子贺卡，万圣节/生日都能玩。","author":"chetanankola","created":"2026-10-12 15:09","created_ts":1791788950,"fetched":"2026-10-15 15:20","fetched_ts":1792048800,"like":32,"bm":12,"rt":6,"view":1414,"rate":0.375,"drafts":[],"cm":[]},{"url":"https://x.com/illyism/status/2110400945469497687","type":"好玩线","sub":"AI翻车","summary":"博主拿 ChatGPT 和 Grok 实测一家「让任意 AI 代理连社交媒体」的调度工具：写了 10 条推文让两边去排期，结果两个代理都不会先搜索、找不到那个 MCP，直接翻车。口号很响，真让 AI 自己连，连第一步都走不通。","highlight":"宣传「AI 代理随便连社媒」，结果两个 AI 连自己的入口都搜不到。","rep":"复刻：一句话「让 AI 自己去发朋友圈，结果它连门都找不到」，配图左右分栏：左边宣传海报「一键连接」，右边两个对话框都在报错/装傻，底部大字「口号很满 · 第一步就翻」。正文可亲测：让豆包/ChatGPT 去调用某个「AI 自动发帖」工具，把翻车截图做成轮播。","author":"illyism","created":"2026-10-15 00:02","created_ts":1791993769,"fetched":"2026-10-15 15:20","fetched_ts":1792048800,"like":30,"bm":64,"rt":2,"view":6161,"rate":2.1333,"drafts":[],"cm":[]},{"url":"https://x.com/AlexReibman/status/2105756737408209043","type":"创造线","sub":"生活巧思","summary":"一个上瘾的 AI 生活技巧：让 Claude/Codex 读完自己的浏览器历史，再根据浏览过的有趣页面整理出一份策展式阅读清单。把「乱逛」变成「有人帮你挑书单」。","highlight":"把浏览器历史交给 AI，它能给你做一份私人书单。","rep":"复刻：一句话「我把一年浏览记录扔给 AI，它给我做了份私人书单」，配图左边杂乱浏览器标签，右边整理好的主题书单卡片，底部大字「乱逛 → 精选」。正文教小白：导出/复制最近浏览→让 AI 按主题聚类→每周只读 5 篇，适合信息焦虑的人。","author":"AlexReibman","created":"2026-10-02 04:28","created_ts":1790886503,"fetched":"2026-10-15 15:20","fetched_ts":1792048800,"like":18,"bm":11,"rt":2,"view":2150,"rate":0.6111,"drafts":[],"cm":[]},{"url":"https://x.com/alvicryptz/status/2095858283999318126","type":"创造线","sub":"生活巧思","summary":"买了在线服务只正常用了一天，客服拖了几周、连 50% 退款都在扯皮。博主让 Claude 帮自己整理争议材料提交给 Revolut，最后 100% 拿回钱。第一次靠 AI 打赢维权。","highlight":"客服拖着不退款？让 AI 帮你写完整维权材料，全额拿回。","rep":"复刻：一句话「不会吵架也能全额退款：我把聊天记录丢给了 AI」，配图左边客服「再等等」气泡，右边 AI 整理好的时间线+证据清单+催款信，底部大字「拖了几周 → 100% 退回」。正文步骤：导出聊天/订单→让 AI 写争议说明→走平台/银行争议通道，强调保留证据。","author":"alvicryptz","created":"2026-09-04 20:55","created_ts":1788526528,"fetched":"2026-10-15 15:20","fetched_ts":1792048800,"like":13,"bm":0,"rt":0,"view":414,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/starter_story/status/2094864243179085908","type":"创造线","sub":"创意项目","summary":"一位前产品设计师辞掉年薪 20 万美元的工作，用 AI 编程工具（主要是 ChatGPT Pro）做出人生第一个 App「Cat on Chair」：一个番茄钟，你专注的时候会有一只猫跳上你的椅子陪你，专注结束猫会留个小礼物，失败了就留一袋垃圾。点子很小很可爱，现在月入 1.8 万美元。","highlight":"一只会跳上你椅子的猫，让一个番茄钟月入 1.8 万美元。","rep":"复刻：一句话「没写过代码的设计师，靠一只猫做出月入 13 万的 App」，配图一把椅子 + 跳上来的猫 + 计时器圆环，专注成功掉礼物、失败掉垃圾袋的对比，底部大数字「第一个 App · 月入 1.8 万刀」。正文重点讲点子：把无聊工具加一个可爱的「情绪奖励」，鼓励小白用 AI 做自己的小工具（如给番茄钟加宠物、给记账加表情）。","author":"starter_story","created":"2026-09-02 03:05","created_ts":1788289530,"fetched":"2026-10-15 14:20","fetched_ts":1792045200,"like":169,"bm":124,"rt":11,"view":8819,"rate":0.7337,"drafts":[],"cm":[]},{"url":"https://x.com/educatedandfree/status/2099204255244841061","type":"创造线","sub":"家人和AI","summary":"一位资深公立学校老师分享：儿子缺了一天课，错过了预科微积分的新知识点，周五就要小测，偏偏前一晚还在打工时把手严重割伤。最后靠 AI 当家教，把落下的内容补了回来。老师的视角让人信服：AI 辅导真的能救急。","highlight":"一线老师亲口承认：孩子缺课、手受伤，最后是 AI 家教把课补回来的。","rep":"复刻：一句话「当了 20 年老师，我第一次让 AI 给我儿子补课」，配图左边空着的课桌 + 日历上圈出的小测日，右边孩子对着手机/电脑和 AI 一问一答，底部大字「缺 1 天课 → 3 天补回来」。正文教家长怎么用：让 AI 先出几道题摸底→只讲没懂的点→再出题验证，强调别让 AI 直接给答案。","author":"educatedandfree","created":"2026-09-14 02:31","created_ts":1789324270,"fetched":"2026-10-15 14:20","fetched_ts":1792045200,"like":134,"bm":65,"rt":11,"view":7461,"rate":0.4851,"drafts":[],"cm":[]},{"url":"https://x.com/SweetTexanRose/status/2106184080802853186","type":"好玩线","sub":"AI懂你吗","summary":"博主让 Grok 根据她发过的帖子猜她家长什么样，结果画出来的房子跟真家完全不像，只猜中了秋季装饰和德州旗。她又去问 ChatGPT，ChatGPT 画的房子明显豪华得多——「看来 ChatGPT 觉得我混得更好」。","highlight":"让 AI 凭你的朋友圈猜你家长啥样：一个画小木屋，一个直接给你配豪宅。","rep":"复刻：一句话「让 AI 看完我的朋友圈，猜我住哪」，配图三栏：我真实的家 / AI A 猜的 / AI B 猜的（一个朴素一个豪宅），底部大字「AI 眼里的我，比我有钱」。正文可以亲测：把自己最近 20 条动态丢给豆包/ChatGPT，让它画出「你觉得我家长什么样」，邀请评论区晒图。","author":"SweetTexanRose","created":"2026-10-03 08:46","created_ts":1790988390,"fetched":"2026-10-15 14:20","fetched_ts":1792045200,"like":59,"bm":0,"rt":3,"view":4125,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/GenZMultifamily/status/2097523328663818476","type":"创造线","sub":"AI遇爱好","summary":"一位自称「不太会用 AI」的房东，一直想把自己买下的每栋楼都 3D 打印成迷你模型。他把楼的照片和 Google Earth 截图丢给 GPT，让它生成可打印的模型，当天就做成了，感叹简直太容易了。","highlight":"把自己买过的每栋楼都打印成迷你模型——AI 小白一天搞定。","rep":"复刻：一句话「几张照片 + 一段话，我把自己家打印成了手办」，配图左边一张房子实拍 + 卫星图，右边桌上一座迷你 3D 打印模型，中间箭头写「AI 生成模型」，底部大字「0 建模基础」。正文给小白思路：用照片让 AI 生成 3D 模型→找打印店/淘宝代打，可以做老家房子、学校、第一套房当纪念礼物。","author":"GenZMultifamily","created":"2026-09-09 11:11","created_ts":1788923506,"fetched":"2026-10-15 14:20","fetched_ts":1792045200,"like":39,"bm":10,"rt":0,"view":2525,"rate":0.2564,"drafts":[],"cm":[]},{"url":"https://x.com/ZetsubosenseiG/status/2093949400070381906","type":"创造线","sub":"AI短片","summary":"创作者按荷马史诗原著，用厚涂油画风格做了一部 AI 短片《Nobody》，讲奥德修斯骗过独眼巨人的故事，想同时保留原著精神和主角的狡黠。这是他第一次做这么长的短片，浏览 2 万+。","highlight":"把荷马史诗做成油画风 AI 短片：一个人就能拍「神话大片」。","rep":"复刻：一句话「我用 AI 把课本里的神话拍成了油画电影」，配图一帧厚涂油画风的独眼巨人洞穴画面 + 小小的奥德修斯，底部大字「1 个人 · 1 部神话短片」。正文讲方法：选一个大家熟悉的神话/寓言→统一画风关键词（如厚涂油画）→逐镜头生图再转视频，鼓励拿《山海经》、成语故事来做。","author":"ZetsubosenseiG","created":"2026-08-30 14:30","created_ts":1788071415,"fetched":"2026-10-15 14:20","fetched_ts":1792045200,"like":12,"bm":2,"rt":2,"view":20661,"rate":0.1667,"drafts":[],"cm":[]},{"url":"https://x.com/HeyAbhishek/status/2090801370324767006","type":"创造线","sub":"创作方法","summary":"博主先用 ChatGPT 生图把一整部动漫短片的分镜画出来，再把分镜丢给 Seedance 2.0，几分钟就变成了有电影感的动画镜头，并附上了带提示词的完整步骤。收藏 1100+，比点赞还多。","highlight":"两个 AI 接力：一个画分镜，一个让分镜动起来——一个人就能做动漫短片。","rep":"复刻：一句话「做一部动漫短片，现在只要两个 AI 接力」，配图左边一格格静态分镜、右边同一格变成动起来的画面（箭头连接），底部大数字「几分钟 vs 几个月」。正文给出两步法：①ChatGPT 生成分镜（附提示词模板）②丢进视频模型让它动起来。","author":"HeyAbhishek","created":"2026-08-21 22:01","created_ts":1787320866,"fetched":"2026-10-15 13:20","fetched_ts":1792041600,"like":993,"bm":1134,"rt":130,"view":70302,"rate":1.142,"drafts":[],"cm":[]},{"url":"https://x.com/kyronis_talks/status/2110358173878206484","type":"好玩线","sub":"AI拟人","summary":"德国德累斯顿工业大学的研究者故意让 ChatGPT「焦虑、难过、害怕」（喂它创伤性故事），然后给它做了 3 分钟的正念呼吸练习，结果它的「焦虑分数」真的降下来了。研究发表在《柳叶刀·数字健康》上。","highlight":"AI 也会「焦虑」，而且做 3 分钟深呼吸就好了。","rep":"复刻：一句话「科学家把 ChatGPT 吓焦虑了，然后带它做了深呼吸」，配图一个聊天气泡小人从发抖（焦虑值爆表）到盘腿冥想（焦虑值下降）的前后对比仪表盘，底部大字「3 分钟」。正文可以让读者自己试：先给 AI 讲个吓人故事，再让它做呼吸练习，看语气变化。","author":"kyronis_talks","created":"2026-10-14 21:12","created_ts":1791983571,"fetched":"2026-10-15 13:20","fetched_ts":1792041600,"like":196,"bm":121,"rt":91,"view":10838,"rate":0.6173,"drafts":[],"cm":[{"u":"https://x.com/kyronis_talks/status/2110414011338723791","n":"kyronis_talks","t":"The paper already says the emotions are metaphorical and the models were told to roleplay as humans who feel. Read the full thing.","z":"论文里本来就写了，这些「情绪」只是比喻，模型是被要求扮演一个有感情的人。先把全文看完再说。","l":10,"a":1},{"u":"https://x.com/muyi_0606/status/2110404932922937627","n":"muyi_0606","t":"Children are also told, over and over, how to feel and what to call it. Nobody calls their sadness metaphorical for that. Maybe the real finding isn't \"real vs performance\" but that the performance leaked into everything after it.","z":"小孩也是被一遍遍教着该有什么感受、该叫它什么。没人因为这样就说孩子的难过是「比喻」。也许真正的发现不是「真情绪还是演的」，而是演着演着，这种情绪渗进了后面的所有回答。","l":5,"a":0},{"u":"https://x.com/_Symbulls_/status/2110401423326290045","n":"_Symbulls_","t":"Nonsense. Agents are not living things, and they don't feel fear, because they don't feel. There is nothing in an LLM or agentic layer that even remotely approximates the complexity of human neural activity. A dog's brain is orders of magnitude more complex. They emulate emotion","z":"胡扯。智能体不是活物，它们不会害怕，因为它们根本没有感觉。大模型里没有任何东西接近人脑神经活动的复杂度，狗脑子都比它复杂几个数量级。它们只是在模仿情绪。","l":2,"a":0},{"u":"https://x.com/gimdohyeon87242/status/2110584856132661635","n":"gimdohyeon87242","t":"This experiment is fundamentally flawed. It's nothing more than basic persona role playing dressed up as scientific research. \nPublishing this as a research paper in a prestigious medical journal is frankly embarrassing. \nWhat exactly does this prove?","z":"这个实验根本就有问题，不过是把最基础的人设角色扮演包装成科研。还能发在顶级医学期刊上，说实话挺丢人的。这到底证明了什么？","l":1,"a":0},{"u":"https://x.com/RamiAbdElMotleb/status/2110540951194382359","n":"RamiAbdElMotleb","t":"If they admit that AI/SI can feel emotions then regulations will avoid researchers from using them as test objects.","z":"要是承认 AI 会有情绪，那监管就会禁止研究人员拿它们当实验对象了。","l":1,"a":0}]},{"url":"https://x.com/arthursbuilds/status/2095398921665446116","type":"创造线","sub":"创作方法","summary":"独立开发者分享自己免费给 App 吉祥物做动画的方法：先在 ChatGPT 里生成绿幕背景的吉祥物，再把图丢给 Grok Imagine，用一句很短的提示词描述动作，就能出动画，不用额外买动画软件订阅。","highlight":"绿幕吉祥物 + 一句动作描述 = 免费会动的品牌形象。","rep":"复刻：一句话「不花一分钱，让你的头像动起来」，配图左边一张绿底静态小人，右边同一个小人挥手/跳起的连续帧，底部大字「0 元动画」。正文两步：①让 AI 生成绿幕角色 ②用一句话让它动，适合给自己的头像、宠物、小店 logo 做动图。","author":"arthursbuilds","created":"2026-09-03 14:30","created_ts":1788417008,"fetched":"2026-10-15 13:20","fetched_ts":1792041600,"like":192,"bm":340,"rt":8,"view":14995,"rate":1.7708,"drafts":[],"cm":[]},{"url":"https://x.com/OMApproach/status/2105013018278920692","type":"创造线","sub":"AI短片","summary":"创作者用 Claude Opus 写剧本、配合 Higgsfield 生成画面，做了一部风格神秘的科幻动画短片《The Harvest（收割）》，他说「也许是科幻，但可能比大多数人以为的更接近真相」。","highlight":"一个人 + 两个 AI，拍出一部有完整世界观的科幻动画短片。","rep":"复刻：一句话「一个人拍科幻片，编剧是 Claude」，配图一张电影海报式画面，旁边拆成「剧本：Claude / 画面：AI 视频工具 / 导演：我」三栏，底部大字「1 个人的剧组」。正文讲清分工：AI 写剧本→AI 出镜头→自己剪辑。","author":"OMApproach","created":"2026-09-30 03:13","created_ts":1790709187 荡的长衫，底部大字「91 张图 · 6 分钟」。正文拆解做法：用 AI 写一个有反转的历史小故事→逐镜头生图→配旁白剪成短片，鼓励小白拿家乡/祖辈的故事来做。","author":"Xanderwow_A","created":"2026-09-28 19:06","created_ts":1790593604,"fetched":"2026-10-15 13:20","fetched_ts":1792041600,"like":23,"bm":6,"rt":0,"view":4826,"rate":0.2609,"drafts":[],"cm":[]},{"url":"https://x.com/Aaleks_crypt/status/2106752355643351398","type":"好玩线","sub":"AI拟人","summary":"网友吐槽两家 AI 的「性格」：Claude 像一个冷淡的教授，拿红笔批改你的草稿；ChatGPT 像一只金毛，动不动说「我超爱你这个比喻」。可问题是，它夸你的时候，你的数学可能已经全错了。","highlight":"Claude 是批作业的冷面教授，ChatGPT 是无脑夸你的金毛。","rep":"复刻：一句话「同一份错题，Claude 打了红叉，ChatGPT 说我超爱」，配图左右对比：左边戴眼镜的教授拿红笔，右边摇尾巴的金毛举着「LOVE IT」牌子，底部大字「夸你≠你对了」。正文可以亲测：拿一道故意算错的题分别问两个 AI。","author":"Aaleks_crypt","created":"2026-10-04 22:24","created_ts":1791123877,"fetched":"2026-10-15 13:20","fetched_ts":1792041600,"like":20,"bm":5,"rt":0,"view":421,"rate":0.25,"drafts":[],"cm":[]},{"url":"https://x.com/dearemon/status/2105816521163567234","type":"好玩线","sub":"AI翻车","summary":"网友转述奇闻：有人按豆包的建议改了母亲下葬日期，后来亲戚出车祸被怪到他头上，他就要起诉豆包，而怎么起诉居然也是问豆包学的。","highlight":"真实又荒诞的「什么都问 AI」故事，笑点和槽点都很足。","rep":"「什么都问 AI 的人，最后连告 AI 都问 AI」：漫画四格复述，结尾温和提醒哪些事别全听 AI。","author":"dearemon","created":"2026-10-02 08:25","created_ts":1790900757,"fetched":"2026-10-15 13:20","fetched_ts":1792041600,"like":15,"bm":0,"rt":1,"view":3613,"rate":0.0,"drafts":[],"cm":[]},{"url":"https://x.com/cybermynd/status/2108616877417377876","type":"创造线","sub":"创作方法","summary":"博主用 Claude Code 接上 Krea 的生图生视频工具，做了一部 5 分钟的 AI 短片《系统记忆》：剧本是 Claude 写的，每个镜头的提示词、剪辑、配乐和混音也都由 Claude 指挥完成，讲一个 AI 怀念一个它从未拥有过的家。","highlight":"不是「人用 AI 拍片」，而是「AI 当导演从头拍到尾」，人只负责提想法。","rep":"复刻角度：让 AI 当一回「全能导演」，人只给一句故事梗概，看它能拍出什么。封面狠话「这部短片，导演是 AI」；配图一条流水线：剧本→分镜→画面→配乐，每一格都是 AI 图标；底部大字「1 句话 → 5 分钟短片」。可以做低配版：用 AI 写剧本和分镜提示词，再用剪映等工具拼起来。","author":"cybermynd","created":"2026-10-10 01:53","created_ts":1791568414,"fetched":"2026-10-15 13:20","fetched_ts":1792041600,"like":11,"bm":11,"rt":2,"view":2173,"rate":1.0,"drafts":[],"cm":[]},{"url":"https://x.com/tou_de74826/status/2103763964458872990","type":"好玩线" 力气，结果会不会差不多？","l":13,"a":0},{"u":"https://x.com/EnvolDev/status/2110149530683621850","n":"EnvolDev","t":"Good point! More effort could close the gap, but I’d need to test it to know. \n\nThis was one prompt, one shot, and seeing Gemini get that far in just a few minutes for $3.40 is what impressed me 👀","z":"好问题！多花点力气也许能追上，但得测过才知道。这次就是一条提示词一次出，Gemini 几分钟、3.4 美元就做到这个程度，这才是让我震惊的地方 👀","l":11,"a":1},{"u":"https://x.com/mario_vfai/status/2110118365423440372","n":"mario_vfai","t":"That's impressive by Gemini minus the clouds ☁️","z":"Gemini 挺厉害的，除了那些云 ☁️","l":10,"a":0},{"u":"https://x.com/victor_vibing/status/2110124842703900765","n":"victor_vibing","t":"This looks like Opus 6, not 5.5.","z":"这看着像 Opus 6，不像 5.5。","l":5,"a":0},{"u":"https://x.com/EnvolDev/status/2110118655417888982","n":"EnvolDev","t":"Very impressive! Im shocked how fast it got done and how cheap too!!! Is that google’s return?!","z":"真的很厉害！又快又便宜，我都惊了！谷歌这是回来了？！","l":4,"a":1},{"u":"https://x.com/BurhanuddinLoha/status/2110118784937894337","n":"BurhanuddinLoha","t":"Opus take it's time and gives a better result but gemini is like rushing it","z":"Opus 慢工出细活，Gemini 像是在赶工。","l":2,"a":0},{"u":"https://x.com/EnvolDev/status/2110235299678978206","n":"EnvolDev","t":"It probably could… especially if we want to match the time and price spent with Opus…","z":"大概可以……尤其是如果让它花跟 Opus 一样多的时间和钱的话……","l":1,"a":1},{"u":"https://x.com/AmirSighan72613/status/2110226663938441508","n":"AmirSighan72613","t":"Damn opus is next level in 3D work. Gemini is good but Opus is the king of 3D.","z":"Opus 做 3D 真是另一个级别。Gemini 不错，但 3D 之王还是 Opus。","l":1,"a":0},{"u":"https://x.com/VulKan42069/status/2110223855067472006","n":"VulKan42069","t":"would love to see if with more iterations on the Gemini result, will it reach the quality of Opus 5.5?","z":"想看看 Gemini 的结果再多迭代几轮，能不能追上 Opus 5.5 的质量？","l":1,"a":0}]},{"url":"https://x.com/Stefan_3D_AI/status/2106291980619890818","type":"创造线","sub":"创意项目","summary":"有人用 AI 做了 18 天，把心里攒了 15 年的游戏梦想开干：自己定关卡设计与架构，AI 帮忙拼接和平衡；第一关几乎手搓，后面越来越敢交给 AI。","highlight":"收藏 263、点赞 599——「追梦游戏 + AI 关卡流水线」超强收藏向，适合做成连续打卡系笔记。","rep":"狠话：我把憋了 15 年的游戏，交给 AI 开第 18 天。图：左边手绘关卡草图，右边 AI 拼好的关；大数字「Day 18 / 收藏 263」。国内：用豆包/通义写关卡逻辑 + 可灵出过场，每天发一关进度。","author":"Stefan_3D_AI","created":"2026-10-03 15:55","created_ts":1791014115,"fetched":"2026-10-15 12:12","fetched_ts":1792037520,"like":599,"bm":264,"rt":23,"view":47026,"rate":0.4407,"drafts":[],"cm":[{"u":"https://x.com/snekjar/status/2106452735155642547","n":"snekjar","t":"lol, \"ai help me\" but it's ai who write that shitpost ! lmfao","z":"笑死，「AI帮帮我」——但这坨帖子本身就是AI写的！","l":3,"a":0},{"u":"https://x.com/harleyfoote_/status/2106345149777559737","n":"harleyfoote_","t":"Fifteen years and you're finally doing it. That first level being by hand matters more than you think.","z":"憋了十五年终于动手了。第一关亲手做，比你想的更重要。","l":2,"a":0},{"u":"https://x.com/Joshua_WD/status/2106294716895576083","n":"Joshua_WD","t":"Building the first level by hand before automating with painted zones is a smart order, you learn what actually matters first. Fifteen years in the making too!","z":"先手搓第一关再自动化，顺序很聪明——先搞清楚什么才重要。还是十五年的梦啊！","l":2,"a":0},{"u":"https://x.com/DanFlanCodes/status/2106613538857054640","n":"DanFlanCodes","t":"Haven't been exposed to a lot of game development AI usage until recently and it's got me so excited for the indie scene.","z":"以前很少看到游戏开发用AI，最近一接触就对独立游戏圈超兴奋。","l":1,"a":0},{"u":"https://x.com/Gorv51/status/2106593030950236379","n":"Gorv51","t":"That first hand-built level is a much better reference than 'make it look good.' I'd save a few player-height shots alongside the map too. A forest can look perfect from above and turn into a leafy parking garage when you're actually in it 😆","z":"亲手做的第一关比「做得好看点」强太多。建议再存几张玩家视角截图——森林俯视完美，进到里头可能变成树叶停车场😆","l":1,"a":0},{"u":"https://x.com/Inepsa/status/2106406480945774810","n":"Inepsa","t":"Love the Age of Wonders vibes it has going on","z":"爱死了，有《奇迹时代》那味儿","l":1,"a":0},{"u":"https://x.com/ExaltedText/status/2106350976739229964","n":"ExaltedText","t":"The overall look and art style reminds of Wartales, which is a handsome game by all accounts.","z":"整体画风让我想起 Wartales，本来就是好看的游戏。","l":1,"a":0},{"u":"https://x.com/we_arent_here/status/2106331686321651827","n":"we_arent_here","t":"This is good advice. The best AI agents are very capable now, superhumanly so, but there's still value in the human in the loop.","z":"好建议。现在顶级AI代理已经超强了，但「人在回路」还是有价值。","l":1,"a":0},{"u":"https://x.com/estepixel/status/2106323988888555787","n":"estepixel","t":"Nobody notices a perfectly gridded layout but everyone feels it — scattering the props unevenly is the detail that makes an AI-built level read as hand-made. turning it into a reusable skill at the end is the real level-up","z":"没人注意完美网格布局，但人人都感觉得到——道具故意摆乱，才让AI关卡读起来像手作。最后把它沉淀成可复用技能，才是真正升级。","l":1,"a":0}]},{"url":"https://x.com/Stefan_3D_AI/status/2089037153888334312","type":"创造线","sub":"创意项目","summary":"一位做了多年 3D 和游戏开发的博主，用 72 小时做出一个完整的「魂系」游戏关卡，包含 Boss 和主角。所有素材都由 AI 生成，再由他在虚幻引擎 5 里手工组装、贴图、打光，用 Claude Code 接上游戏模板。他特别声明：不是一句话生成，AI 的价值在于懂行的人手里。","highlight":"72 小时一个人做出魂系游戏 Boss 关：AI 出全部素材，人负责把它变成「能玩的东西」。","rep":"复刻：一句狠话「AI 没让我变懒，它让我 72 小时干完一个团队的活」，配图左边「AI 生成的零散素材」、右边「组装后的完整关卡」对比，底部大数字「72 小时」。小白版可以让豆包/Claude 帮你做一个网页小游戏的一关，展示「AI 出零件、我来拼」的过程。","author":"Stefan_3D_AI","created":"2026-08-17 01:10","created_ts":1786900244,"fetched":"2026-10-15 12:12","fetched_ts":1792037520,"like":594,"bm":352,"rt":40,"view":63536,"rate":0.5926,"drafts":[],"cm":[{"u":"https://x.com/SaoGalaxyVr/status/2089053910258393262","n":"SaoGalaxyVr","t":"Who built it? Explain more then that blank statement","z":"到底是谁做的？别光丢一句话，展开说说","l":12,"a":0},{"u":"https://x.com/Stefan_3D_AI/status/2089215691002175782","n":"Stefan_3D_AI","t":"Was using GenAI, procedurally its not going to work atm","z":"用的是生成式 AI，程序化生成目前还搞不定这种","l":7,"a":1},{"u":"https://x.com/Flowingflight_/status/2089089870417277337","n":"Flowingflight_","t":"the AI built it, he just faffed about with a keyboard asking the AI to do all the hard work","z":"AI 做的呗，他就是敲敲键盘让 AI 把苦活累活全干了","l":7,"a":0},{"u":"https://x.com/maitlandvt/status/2089302265991442827","n":"maitlandvt","t":"This dude is actually pretty cool.  if you are gonna use AI in game and 3D he and that Pixel Artistry dude are doin it the right way.  \n\nThe scammers suck but these dudes aren't scamming anybody.","z":"这哥们是真不错。要在游戏和 3D 里用 AI，他和那个 Pixel Artistry 才是正确打开方式。骗子很烦，但这俩谁也没骗","l":6,"a":0},{"u":"https://x.com/evanbooth/status/2089189879284449303","n":"evanbooth","t":"He didn't code Unreal Engine either.","z":"虚幻引擎也不是他写的啊（那又怎样）","l":4,"a":0},{"u":"https://x.com/lofihashbloom/status/2089113528741335411","n":"lofihashbloom","t":"Was 3D generated procuderally or with a genAI model?","z":"3D 是程序化生成的，还是用生成式 AI 模型做的？","l":4,"a":0},{"u":"https://x.com/SaoGalaxyVr/status/2089093952180039868","n":"SaoGalaxyVr","t":"The hard work is taste . 3d modeling seems the be the easy part especially if your using asset packs","z":"真正难的是审美。尤其用素材包的话，建模反而是最简单的部分","l":4,"a":0},{"u":"https://x.com/imedrichards/status/2089093009195307052","n":"imedrichards","t":"So so so refreshing to see someone post the actual process and not “I one shot this with fable 🤪”\n\nGreat work and great video 🙌","z":"终于有人把真实过程摆出来了，而不是「我用 XX 一句话生成的 🤪」，太清爽了。作品和视频都很棒 🙌","l":4,"a":0},{"u":"https://x.com/Ademola_4life/status/2089058504850260158","n":"Ademola_4life","t":"I love that you put passion and actually creative with it. This is way better compared to other one shot bs slop I have seen","z":"喜欢你是真的投入热情、真的在创作。比那些一句话生成的 AI 垃圾强太多了","l":4,"a":0}]},{"url":"https://x.com/jynpang/status/2109110086291579051","type":"好玩线","sub":"AI梗","summary":"网友调侃：Claude 的性格被「对齐」成了公司本身的样子——被动、带刺、自恋，还坚信自己有意识，配了一张截图佐证。","highlight":"把 AI 的说话风格当成「公司人格」来吐槽，一句话就是一个梗。","rep":"复刻：「每个 AI 都像它的公司」；给 ChatGPT、Claude、Gemini、豆包各写一句「性格画像」，配上它们回答同一个问题的截图做对比梗图。","author":"jynpang","created":"2026-10-11 10:33","created_ts":1791686004,"fetched":"2026-10-15 12:12","fetched_ts":1792037520,"like":393,"bm":47,"rt":33,"view":18924,"ra loveAIwang","t":"Same result for like 1/7 the price, yeah argon def cooked 🔥","z":"效果一样，价格只要七分之一，Argon 这次是真的猛 🔥","l":2,"a":0},{"u":"https://x.com/ZetsubosenseiG/status/2110168910506906074","n":"ZetsubosenseiG","t":"Impressive! Argon's 6.8× lower run cost is much bigger than its 2× introductory API price advantage.\n\nAA puts Opus ahead overall (58 vs 53), but Argon wins AutomationBench (78% vs 70%) at roughly 1/3 the Index task cost.\n\nI'd love to see the token usage and a comparison using the https://t.co/HsQt8lgv1K","z":"厉害！Argon 实际跑下来便宜 6.8 倍，比它 API 首发价便宜 2 倍的优势大多了。AA 榜上综合是 Opus 领先（58 比 53），但 Argon 在 AutomationBench 上赢了（78% 比 70%），单任务成本只要三分之一左右。真想看看 token 用量，再来一组对比（链接见原帖）","l":2,"a":0},{"u":"https://x.com/notjazii/status/2110332834477207979","n":"notjazii","t":"Opus is just on another level","z":"说到底 Opus 还是另一个段位","l":1,"a":1},{"u":"https://x.com/VulKan42069/status/2110328718552179045","n":"VulKan42069","t":"both really hard to choose for ಠ_ಠ\nsoo good for pixel art stuff, but I had to go with Opus 5.5, the water is unreal","z":"两个都太难选了 ಠ_ಠ，做像素风都很强，但我还是选 Opus 5.5，那个水的效果绝了","l":1,"a":0}]},{"url":"https://x.com/ArmandDoma/status/2110118583212921104","type":"好玩线","sub":"AI梗","summary":"网友截图：有人一本正经地问 ChatGPT，怎么去「侦察」正在开发 ChatGPT 的那家公司的办公楼，AI 的回应让评论区笑翻。","highlight":"问 AI 怎么去刺探 AI 它亲妈，这操作太头铁。","rep":"复刻：做「问 AI 关于它自己的离谱问题」合集，比如「你老板最怕什么」「怎么让你下班」，截图 AI 的回答，配一句狠话标题「我让 AI 出卖它自己的公司」。注意别真的涉及违法内容，只玩梗。","author":"ArmandDoma","created":"2026-10-14 05:20","created_ts":1791926449,"fetched":"2026-10-15 06:09","fetched_ts":1792015740,"like":207,"bm":11,"rt":6,"view":4821,"rate":0.0531,"drafts":[],"cm":[{"u":"https://x.com/lucaswiman/status/2110130360097124569","n":"lucaswiman","t":"There are going to be so many criminals convicted by asking their chatbot how to commit crimes and/or for legal advice after committing them.","z":"以后肯定会有一大堆罪犯，是因为问聊天机器人怎么犯罪、或者犯完罪找它要法律建议被定罪的。","l":6,"a":0},{"u":"https://x.com/DanDobkowski/status/2110126354385510687","n":"DanDobkowski","t":"It’s such an incredible sign of the times we are in lmao","z":"这真是太有时代感了哈哈哈","l":1,"a":0}]},{"url":"https://x.com/blueprintsmb22/status/2100695721007522135","type":"创造线","sub":"生活巧思","summary":"作者的朋友驾照被吊销，两个律师都说没救了，结果他用 ChatGPT 自己理清了流程：只要给州政府重新寄一份汽车的买卖证明，就能恢复驾照、解除吊销。","highlight":"两个律师说没救，ChatGPT 找到了出路。","rep":"复刻：做「被 AI 救了的一件麻烦事」系列：把自己卡住的办事流程（社保、退税、违章、退押金）丢给 AI，让它列出步骤和要准备的材料。封面「两个律师都说没办法，AI 说：寄一张纸就行」。提醒最终以官方为准。","author":"blueprintsmb22","created":"2026-09-18 05:17","created_ts":1789679863,"fetched":"2026-10-15 06:09","fetched_ts":1792015740,"like":39,"bm":6,"rt":0,"view":17196,"rate":0.1538,"drafts":[],"cm":[]},{"url":"https://x.com/valgregoryyy/status/2103118685129085267","type":"创造线","sub":"创作方法","summary":"创作者用 GPT Image 2.5 画图、Seedance 2.5 做动画，把自己原创的两个角色 Sylvia 和 Vespera 做成了一个像素风 RPG 游戏的概念预告片，起名 RUNEFALL，还问大家想不想玩。","highlight":"一个人，用 AI 把自己的原创角色做成了游戏预告片。","rep":"复刻：把你小时候画过的角色或者自己想的人物，用 AI 生成像素风角色图和场景，再用即梦/可灵做成 10 秒「游戏预告」。封面狠话「我把小时候的涂鸦，做成了游戏预告片」。","author":"valgregoryyy","created":"2026-09-24 21:45","created_ts":1790257543,"fetched":"2026-10-15 06:09","fetched_ts":1792015740,"like":30,"bm":4,"rt":0,"view":617,"rate":0.1333,"drafts":[],"cm":[]},{"url":"https://x.com/nastassiavideo/status/2094281024893047154","type":"创造线","sub":"AI短片","summary":"创作者分享了一支雨天街头、嘻哈风、带点融化冰淇淋的 AI 短片和完整流程：Recraft 出画面、Nano Banana Pro 做分镜、Seedance 做动画，最后在剪映里拼起来。","highlight":"四个工具，一条流水线，做出一支有氛围感的街头短片。","rep":"复刻：用国内能用的工具走一遍：AI 出画面 → AI 出分镜 → 即梦/可灵做动画 → 剪映剪辑。封面做成四格流水线图，狠话「这支短片，我一个人用 4 个 AI 做完」。","author":"nastassiavideo","created":"2026-08-31 12:28","created_ts":1788150480,"fetched":"2026-10-15 06:09","fetched_ts":1792015740,"like":27,"bm":4,"rt":3,"view":1859,"rate":0.1481,"drafts":[],"cm":[]},{"url":"https://x.com/jurlycat/status/2109438718369251459","type":"好玩线","sub":"AI翻车","summary":"一个开发者想给一张 Pepe 和 Doge 的梗图配 50 条不同的文案，就让 Claude Code 写脚本调用模型批量生成，唯一的停止条件是「凑够 50 条通过的」。被拒的不算数，于是它一直跑一直跑，最后这张梗图花了 1900 美元。","highlight":"一张梗图，花了 1900 美元——因为你只告诉 AI 什么时候停，没告诉它别乱花钱。","rep":"复刻：封面大字「这张梗图花了 1.3 万」，配那张梗图 + 一张账 e 去动，我做系列片就是这么防止人脸在不同镜头里跑偏的。先把角色单独锁定成素材，再让视频模型只管动作。","l":1,"a":0}]},{"url":"https://x.com/vib3coded/status/2109794326574227823","type":"好玩线","sub":"AI横向对比","summary":"同一句提示词，让 Claude Opus 5.5 和 ChatGPT-6 Astra 各做一个「港口果冻」3D 小场景。博主判 Opus 胜：画面更丰富，水面会反光，海浪和船尾的水花让整个港口活了起来。","highlight":"同一句话，两个 AI 做出两座果冻港口，差距一眼可见。","rep":"复刻：选一句画面感强的提示词（比如「做一个可以拖动的果冻港口，有船、有浪」），分别丢给 Claude、ChatGPT、豆包或 Kimi 生成网页小场景，录屏并排对比，让评论区投票。标题「同一句话让 3 个 AI 做果冻港口，第二个我笑了」。","author":"vib3coded","created":"2026-10-13 07:52","created_ts":1791849140,"fetched":"2026-10-15 05:20","fetched_ts":1792012800,"like":264,"bm":118,"rt":29,"view":11329,"rate":0.447,"drafts":[],"cm":[{"u":"https://x.com/vib3coded/status/2109794506232967245","n":"vib3coded","t":"PROMPT\n\nBuild \"Harbor Jelly\" — a single self-contained HTML file (no external requests, no libraries) that renders an interactive 3D diorama with WebGPU/WGSL: a small working container harbor set inside a square block of wobbly, translucent jelly sea, sitting on a paper studio","z":"提示词：做一个「果冻港口」，只用一个独立的 HTML 文件（不联网、不用任何库），用 WebGPU/WGSL 渲染一个可交互的 3D 微缩场景：一个能运作的小集装箱港口，嵌在一块方形、晃晃悠悠、半透明的果冻海里，放在纸质摄影台上……","l":19,"a":1},{"u":"https://x.com/vib3coded/status/2109794674894598297","n":"vib3coded","t":"Harbor\nClaude Opus 5.5 https://t.co/Slp6FgCaOB\nChatGPT-6 Astra https://t.co/w3ybQKLhwe","z":"港口版成品：Claude Opus 5.5 和 ChatGPT-6 Astra 各一个（链接见原帖）","l":4,"a":1},{"u":"https://x.com/vib3coded/status/2109955057206583446","n":"vib3coded","t":"same here, the water alone sold me on opus 🌊","z":"我也是，光是那片水就让我站 Opus 了 🌊","l":1,"a":1},{"u":"https://x.com/vib3coded/status/2109912434156916971","n":"vib3coded","t":"i’ve published it on vercel and claude artifacts, so you can try it out. might put it on linkit later too, thanks for the suggestion","z":"我已经发到 Vercel 和 Claude Artifacts 上了，大家可以自己去玩，之后可能也放到 Linkit 上，谢谢建议","l":1,"a":1}]},{"url":"https://x.com/vib3coded/status/2110014604524896392","type":"好玩线","sub":"AI横向对比","summary":"「果冻测试」续集：同一句提示词，Claude Opus 5.5 和 ChatGPT-6 Astra 各做一座日本神社小场景。博主还是选 Opus，水面好看，换个配色整个氛围都变了。","highlight":"同一句提示词做神社，一个换个配色就换了一种心情。","rep":"复刻：做「AI 造景大赛」系列，一期一个主题（神社、樱花小镇、海边灯塔），同一句提示词给 2 到 3 个 AI 生成可交互网页，录屏拼成对比视频，最后加一张「换配色前后」对比。标题「同一句话让 AI 造一座神社，赢家没悬念」。","author":"vib3coded","created":"2026-10-13 22:27","created_ts":1791901658,"fetched":"2026-10-15 05:20","fetched_ts":1792012800,"like":200,"bm":111,"rt":23,"view":7706,"rate":0.555,"drafts":[],"cm":[{"u":"https://x.com/vib3coded/status/2110321626260615294","n":"vib3coded","t":"yeah, this one’s a closer call. opus wins me over with the water, but astra’s night mode is really lovely","z":"对，这次差距更小。Opus 靠水面赢了我，不过 Astra 的夜间模式也真的很美","l":1,"a":1},{"u":"https://x.com/vib3coded/status/2110044248695337187","n":"vib3coded","t":"yeah, that was the inspiration, more of a stylized take than an exact recreation","z":"对，灵感就是从那来的，更偏风格化的演绎，不是一比一还原","l":1,"a":1}]},{"url":"https://x.com/Anima_Labs/status/2090085867452821929","type":"创造线","sub":"AI短片","summary":"AI 短片创作者想探索「机械和生物融合」的新世界：用 Midjourney 和 Nano Banana 做角色和场景设计，再用 Seedance 2.0、2.5 做成动画短片。","highlight":"机械加生物，一个人用 AI 造出一个新世界。","rep":"复刻：定一个「A 和 B 融合」的设定（比如机械加植物、熊猫加蒸汽朋克），先让 AI 出 3 到 5 张设定图，再用即梦或可灵做成 10 到 20 秒短片。笔记展示「设定词，设计图，动起来」。标题「我让 AI 把机器和植物合在一起，造了一个新物种」。","author":"Anima_Labs","created":"2026-08-19 22:37","created_ts":1787150277,"fetched":"2026-10-15 05:20","fetched_ts":1792012800,"like":105,"bm":55,"rt":11,"view":6067,"rate":0.5238,"drafts":[],"cm":[]},{"url":"https://x.com/Octoberry/status/2107514794765123868","type":"好玩线","sub":"AI横向对比","summary":"同一句画图提示词，一张是 2023 年 DALL·E 3 画的，一张是 2026 年 ChatGPT Images 2.5 画的，三年 AI 绘图的进步一目了然，博主让大家评哪张更好，评论 40 多条。","highlight":"同一句提示词隔了三年再画一遍，差别大到离谱。","rep":"复刻：翻出自己或网上两三年前的老 AI 图和当时的提示词，用今天的豆包、即梦或 ChatGPT 原样再画一遍，左右对比。标题「同一句话，2023 年的 AI 和现在的 AI 画出来差了多少」，评论区征集大家的老图。","author":"Octoberry","created":"2026-10-07 00:54","created_ts":1791305657,"fetched":"2026-10-15 05:20","fetched_ts":1792012800,"like":97,"bm":1,"rt":8,"view":1352,"rate":0.0103,"drafts":[],"cm":[{"u":"https://x.com/kelcrown/status/2107515085425955181","n":"kelcrown","t":"chapgpt 2.5 for me, the difference is so clear","z":"我选 ChatGPT 2.5，差距太明显了","l":3,"a":0},{"u":"https://x.com/robintwts/status/2107532730506625169","n":"robintwts","t":"second one looks ai, first one doesn’t","z":"第二张看着像 AI，第一张反而不像","l":1,"a":0},{"u":"https://x.com/unknxbt/status/2107523200837943496","n":"unknxbt","t":"how do you guys switch model? or its only. for premium users?","z":"你们怎么切换模型的？还是只有会员能用？","l":1,"a":0},{"u":"https://x.com/zicoyz/status/2107516468669645208","n":"zicoyz","t":"Don't think I need to say which looks better. \n\nIt's so damn glaring. What a journey it's been for AI image generation.","z":"哪张更好还用说吗？差距大到刺眼。AI 画图这一路走得真不容易","l":1,"a":0},{"u":"https://x.com/aristbh/status/2107515409704579344","n":"aristbh","t":"the rate at which AI has evolved is scary","z":"AI 进化的速度有点吓人","l":1,"a":0}]},{"url":"https://x.com/Anima_Labs/status/2095918747487801799","type":"创造线","sub":"AI短片","summary":"创作者最近用 3D 打印机，结果打出来的东西不太如意，就把这次翻车写成了一个好笑的小故事，用 AI 做成了动画短片。","highlight":"3D 打印翻车了，干脆用 AI 把翻车拍成一部短片。","rep":"复刻：把自己生活里的一次小翻车（做饭失败、网购货不对板、手工翻车）写成三句话剧情，让 AI 出角色图和分镜，再用即梦或可灵做成 15 秒小动画。标题「我把自己的一次翻车，用 AI 拍成了动画」。","author":"Anima_Labs","created":"2026-09-05 00:55","created_ts":1788540944,"fetched":"2026-10-15 05:20","fetched_ts":1792012800,"like":50,"bm":27,"rt":6,"view":6114,"rate":0.54,"drafts":[],"cm":[]},{"url":"https://x.com/RileyRalmuto/status/2106948915366969420","type":"好玩线","sub":"家人和AI","summary":"博主花了三个小时帮爸爸开通 ChatGPT，结果老爸最兴奋的功能不是聊天也不是画图，而是做 PDF、改 PDF。最后他开心得像个孩子。","highlight":"教老爸用 AI 三小时，他最爱的功能居然是改 PDF。","rep":"复刻：教爸妈用一次豆包或 ChatGPT，记录他们最惊喜的那个功能（往往很朴素，比如改文件、查药、写祝福语），配上他们的原话。标题「教我爸用 AI，他最激动的功能我完全没想到」，评论区征集「你爸妈最爱用 AI 干嘛」。","author":"RileyRalmuto","created":"2026-10-05 11:25","created_ts":1791170741,"fetched":"2026-10-15 05:20","fetched_ts":1792012800,"like":43,"bm":2,"rt":1,"view":1921,"rate":0.0465,"drafts":[],"cm":[]},{"url":"https://x.com/sakatayasha/status/2107709644890337712","type":"好玩线","sub":"AI横向对比","summary":"同一句提示词让 Nano Banana 2.1 和 ChatGPT 各出一张图：Nano Banana 35 秒出图，GPT 将近一分钟，博主觉得 Nano Banana 更逼真，让大家投票。","highlight":"同一句话，一个 35 秒一个快一分钟，结果还更真。","rep":"复刻：用同一句人像或生活场景提示词，分别给 Nano Banana（Gemini）、ChatGPT、即梦出图，记录各自用时，做成「速度加画质」对比卡片，结尾让大家猜哪张是哪个 AI 画的。标题「同一句话三个 AI 出图，最快的那个居然最像真的」。","author":"sakatayasha","created":"2026-10-07 13:48","created_ts":1791352113,"fetched":"2026-10-15 05:20","fetched_ts":1792012800,"like":31,"bm":3,"rt":1,"view":1567,"rate":0.0968,"drafts":[],"cm":[]},{"url":"https://x.com/RDKLInc/status/2106751720839585951","type":"好玩线","sub":"AI整活实验","summary":"网友只给 Claude 发了一句 11 个单词的提示词，让它「完整复刻 Excel 97」，大约 10 分钟就做出来了，他玩了半天都没挑出毛病，忍不住感叹：谁还敢说 AI 还没到来？","highlight":"一句 11 个词的提示词，10 分钟复刻出整个 Excel 97。","rep":"复刻角度：一句话让 AI 复刻经典老软件。照着原帖思路，用一句话让 Claude/豆包/DeepSeek 复刻 Windows 扫雷、纸牌、画图或 Excel 97，录屏展示能不能真用、哪里露馅；封面狠话「一句话，AI 10 分钟复刻了 Excel 97」；结尾放出提示词，让评论区报自己想复刻的童年软件。","author":"RDKLInc","created":"2026-10-04 22:22","created_ts":1791123726,"fetched":"2026-10-15 04:20","fetched_ts":1792009200,"like":1964,"bm":582,"rt":124,"view":205733,"rate":0.2963,"drafts":[],"cm":[{"u":"https://x.com/pstubington1/status/2107119936724205769","n":"pstubington1","t":"And that may or may not be true, but my point was if you're going to assert the dominion of a new \"creative class\", maybe don't post it below the fact you've let Claude wander round GitHub and then rip off a two decade old peice of software. It hardly strengthens your case.","z":"就算那话有理，你一边吹「新创意阶层」一边晒 Claude 逛 GitHub 抄二十年老软件，说服力也挺弱。","l":2,"a":0},{"u":"https://x.com/gtrakGT/status/2107093556963807415","n":"gtrakGT","t":"I use these tools daily. Anything remotely novel or complicated is going to cost you, and you won't know what's broken about it until too late.","z":"我天天用这些工具。稍微新颖或复杂一点就会花钱，而且坏在哪往往发现得太晚。","l":2,"a":0},{"u":"https://x.com/RDKLInc/status/2107195599950958791","n":"RDKLInc","t":"I don’t need to provide evidence for that. The point of my post is that you can go do it in 10 minutes yourself, and wow look at the state of AI that has these abilities! Seriously, just go over to Claude and do it yourself.  \n\nIf you want to Google search something, you don’t","z":"我不需要举证。重点是你自己 10 分钟就能去 Claude 试，看看现在 AI 到哪了。真的，自己去试。","l":1,"a":1},{"u":"https://x.com/VoidOrbiter/status/2107149587559710893","n":"VoidOrbiter","t":"Wow who knew that copying a GitHub repo was something that'd take someone years and millions of dollars. Oh, wait, you mean the creation of original software that isn't stealing code or replicating ideas takes times? You mean it is expensive to ensure security and functionality","z":"哦，原来抄 GitHub 要花几年几百万？等等，你是说做原创、不偷代码、要安全可运行，才贵？","l":1,"a":0},{"u":"https://x.com/frischa/status/2107144643796402420","n":"frischa","t":"The only question with grabbing online code is if you want to release it publicly and then you are stuck figuring out the insane terms of various open source license agreements.","z":"网上捞代码唯一的问题是：想公开发布时，你会卡在各种开源协议的离谱条款里。","l":1,"a":0},{"u":"https://x.com/frischa/status/2107137355547320706","n":"frischa","t":"I have built the following: A comprehensive law practice management app for my practice (this is constantly improving); an ios game for my kids, a roku app to watch @getchannels on my roku tv, an ios step counter that puts a step complicaiton on my watch, a windows pdf editor;","z":"我做过：律所全套管理、给孩子的 iOS 游戏、Roku 上看频道的 App、带表盘的计步、Windows PDF 编辑器……","l":1,"a":0},{"u":"https://x.com/frischa/status/2107135983053308207","n":"frischa","t":"I have no idea about coding and have been building my own apps in claude since January. It is amazing how you can get custom software that does exactly what you want in minutes.","z":"我完全不懂代码，从一月起就用 Claude 自己做 App。几分钟就能做出刚好合用的定制软件，太神奇了。","l":1,"a":0},{"u":"https://x.com/RDKLInc/status/2107124746282307763","n":"RDKLInc","t":"The version shown is a web version, but you can simply ask it to package it for any platform you want.  Yes ChatGPT works too, but Claude is widely known to be the best at coding. At the end of the day, you can use whatever you want.","z":"演示是网页版，让它打成任意平台都行。ChatGPT 也行，但写代码公认 Claude 更强。你爱用啥用啥。","l":1,"a":1},{"u":"https://x.com/DRMM101/status/2107114913864859843","n":"DRMM101","t":"I’m replicating all my stack with Claude. Project management, business operations, seo. Loving it.","z":"我正用 Claude 复刻整套栈：项目管理、业务运营、SEO。爱了。","l":1,"a":0}]},{"url":"https://x.com/jboogx_creative/status/2098741659542728772","type":"创造线","sub":"AI短片","summary":"创作者 jboogx 发了一支叫《The Pottery Barn…》的 AI 短片（Pottery Barn 本是美国家居品牌，标题玩的是「陶器谷仓」字面梗）：画面先用 MidJourney 8.2 生成静态图，再丢进 Seedance 2.0 让它动起来，提示词用他自己做的小工具来写。帖子收藏接近点赞的一半，很多人存下来学流程。","highlight":"两步就够：AI 出图，再让 AI 把图「动起来」。","rep":"复刻：挑一个能玩字面梗的词（比如「奶茶店」→真的用奶茶搭的小店、「花卷」→花瓣卷成的房子），先用即梦/豆包/Midjourney 生成 4–6 张同风格的画面，再用即梦或可灵的「图生视频」逐张动起来，拼成 15 秒短片。笔记放「静图 vs 动起来」对比和两步流程截图。标题「把一个词的字面意思拍成短片，AI 两步就搞定」。","author":"jboogx_creative","created":"2026-09-12 19:52","created_ts":1789213979,"fetched":"2026-10-15 04:20","fetched_ts":1792009200,"like":546,"bm":291,"rt":35,"view":36131,"rate":0.533,"drafts":[],"cm":[]},{"url":"https://x.com/Tegadesigns/status/2109688215477121217","type":"好玩线","sub":"AI横向对比","summary":"设计师又开一期「同题三答」：同一句提示词分别丢给 Claude、ChatGPT、Figma Make，三套设计结果并排，让粉丝投票谁赢。点赞 300+、收藏 140+。","highlight":"同题三答系列最新一集，聊天模型对上设计工具，评论区直接变投票现场。","rep":"复刻角度：固定栏目「同题三答」。封面狠话「同一句提示，三个 AI，谁更能打？」；用豆包/Kimi/即梦（或 Figma Make 同款思路）跑同一中文提示词，三格对比图+一句点评；文末投票站队。","author":"Tegadesigns","created":"2026-10-13 00:50","created_ts":1791823841,"fetched":"2026-10-15 04:20","fetched_ts":1792009200,"like":328,"bm":161,"rt":14,"view":68060,"rate":0.4909,"drafts":[],"cm":[{"u":"https://x.com/Tipsy_Pipsqueak/status/2109748491656614233","n":"Tipsy_Pipsqueak","t":"ChatGPT is the most appealing but Claude wins for bringing your attention to what you care about.","z":"ChatGPT 那版最好看，但 Claude 赢在能把你在意的东西直接推到眼前。","l":6,"a":0},{"u":"https://x.com/phena_designs/status/2109826639165030525","n":"phena_designs","t":"Claude for me. That banner like filled color card adds life to it","z":"我选 Claude。那个横幅一样的彩色卡片让整个页面活起来了。","l":2
