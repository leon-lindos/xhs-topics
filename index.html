"https://x.com/ItsGoharr/status/2109278825553318039","n":"ItsGoharr","t":"Music fans mock AI songs then replay them on every commute","z":"乐迷嘴上嘲笑 AI 歌，转头通勤路上单曲循环","l":1,"a":0}]},{"url":"https://x.com/_CryptoNotes_/status/2096900444777824381","type":"创造线","sub":"创意项目","summary":"一个完全没写过代码的人花 5 周和 Claude 做出一款钓鱼小游戏：开船在小岛间穿梭、钓鱼小游戏里拉得越久鱼越稀有但线会断；他说最好的提示词就是「别再写提示词」，直接跟 AI 聊。","highlight":"「零基础做出自己的游戏」+「最好的提示词是不写提示词」反差强，回复 40 条讨论热。","rep":"钩子：「我不会代码，但我做了个钓鱼游戏」。复刻：和 AI 聊天式描述一个超小玩法（如钓鱼/接水果），截图对话→可玩截图→录 15 秒试玩，总结「像跟朋友讲点子一样跟 AI 说」。","author":"_CryptoNotes_","created":"2026-09-07 17:56","created_ts":1788774999,"fetched":"2026-10-12 17:25","fetched_ts":1791797100,"like":79,"bm":2,"rt":2,"view":1629,"rate":0.0253,"drafts":[],"cm":[]},{"url":"https://x.com/danielhayesmith/status/2103976394338271515","type":"创造线","sub":"创作方法","summary":"作者批评多数「AI 做的」帖子缺关键信息，公开自己做 ClearTime 用的模型、权限模式、以及 agent 何时停下来问人。","highlight":"方法论向，教人写「可复现的 AI 做产品」笔记，收藏导向强。","rep":"狠话：别只晒成品，把模型、权限、停问时机写出来。配图：三栏清单「Model / Permission / When it asks」。","author":"danielhayesmith","created":"2026-09-27 06:33","created_ts":1790462037,"fetched":"2026-10-12 17:25","fetched_ts":1791797100,"like":40,"bm":31,"rt":2,"view":6426,"rate":0.775,"drafts":[],"cm":[{"u":"https://x.com/jilyannori/status/2103981710102987064","n":"jilyannori","t":"That stopping-and-asking permission detail is so real, since most demos just pretend agents never get confused and click random buttons. I tried building a tiny habit tracker last week and my AI agent enthusiastically tried to delete my entire downloads folder instead. Knowing","z":"「停下来问授权」这点太真实了，大多数演示假装 agent 从不迷惑、从不乱点。我上周做了个小习惯打卡，我的 AI agent 兴致勃勃地想把整个下载文件夹删掉。知道","l":2,"a":0},{"u":"https://x.com/JiangxJo/status/2104332998657417671","n":"JiangxJo","t":"So many posts are just “boom, I built this with AI.” Your process—and the thinking behind it—was far more valuable. Thank you for sharing it!\nI have ADHD too and would love to try the app. If you need testers for future products for ADHDers, I’d be happy to help.","z":"好多帖子就一句「砰，我用 AI 做了这个」。你的过程——还有背后的思考——值钱多了。谢谢分享！\n我也有 ADHD，很想试试这款 App。如果以后有给 ADHDer 的产品需要测试，我乐意帮忙。","l":1,"a":0},{"u":"https://x.com/NerdSnipeInc/status/2104260334257352941","n":"NerdSnipeInc","t":"Glad it held up. Curious which parts surprised you most — is it worth writing those down somewhere so the next build starts from what worked instead of rediscovering it?","z":"挺住了就好。好奇哪些部分最让你意外——要不要记下来，下次开工直接从「已经验证的」开始，而不是重新摸一遍？","l":1,"a":0},{"u":"https://x.com/ArielSh/status/2104151486385295717","n":"ArielSh","t":"This is awesome - Im looking for the next breakthrough around videos \n\"make a dynamic 15-second motion graphics\" is great but I want something like that create from actuall videos/screenrecording..\n\nif anyone so something like that before please do show","z":"太赞了——我在找视频这块的下个突破点\n「做一段 15 秒动态动态图形」很好，但我想要能从真实视频/录屏里生成的……\n\n有谁见过类似的麻烦展示一下","l":1,"a":0},{"u":"https://x.com/vovalukashov/status/2104110458172997916","n":"vovalukashov","t":"Good article. I'm usually way too lazy to pull all those details together","z":"好文。我通常懒到懒得把这些细节凑齐","l":1,"a":0},{"u":"https://x.com/NerdSnipeInc/status/2104073641969488305","n":"NerdSnipeInc","t":"The build guide that says which source wins when two files disagree is the sharpest idea here: the agent checks an answer instead of making a new design decision each time. Congrats on ClearTime on all four platforms, and I hope your recovery keeps going well.","z":"那份「两个文件打架时听谁的」构建指南是全文最锋利的点：agent 去核对答案，而不是每次重新做设计决策。恭喜 ClearTime 四端上线，也希望你恢复顺利。","l":1,"a":0}]},{"url":"https://x.com/lizisamused/status/2108344874366087246","type":"好玩线","sub":"AI梗","summary":"网友吐槽：男朋友让她帮忙总结一封信，趁她还在读就拍照丢给 ChatGPT；她问「有了 AI 我是不是显得太慢了」，男友回「不会，你们用途不同」。","highlight":"一句「你们用途不同」又甜又扎心，情侣+AI 的日常梗很适合小红书情感区传播。","rep":"钩子：「男朋友说我和 ChatGPT『用途不同』」。做成聊天截图式漫画两格，结尾抛问题「你觉得自己哪方面 AI 替代不了」引评论。","author":"lizisamused","created":"2026-10-09 07:52","created_ts":1791503563,"fetched":"2026-10-12 17:25","fetched_ts":1791797100,"like":25,"bm":2,"rt":0,"view":929,"rate":0.08,"drafts":[],"cm":[]},{"url":"https://x.com/adilmania/status/2106521825652117726","type":"好玩线","sub":"AI整活实验","summary":"博主做了个怪实验：给 ChatGPT 喂了比身边大多数人都多的个人信息，然后问它「你怎么看我？」，并贴出 AI 对他的画像。","highlight":"「问 AI 你眼里的我是什么样」是天然可复刻的互动话题，评论区容易晒自己的结果。","rep":"钩子：「我问了 AI 一句：你觉得我是个什么样的人？」。截图 AI 回答里最戳的 3 句，配「准/不准」打分，结尾放提示词让大家去试并晒结果。","author":"adilmania","created":"2026-10-04 07:08","created_ts":1791068915,"fetched":"2026-10-12 17:25","fetched_ts":1791797100,"like":21,"bm":6,"rt":0,"view":1465,"rate":0.2857,"drafts":[],"cm":[]},{"url":"https://x.com/mhmazur/status/2108932590006665329","type":"创造线","sub":"创作方法","summary":"ARC Prize 的测试负责人和 Claude Code 合作做了 8 段两角色对话小动画，每段画风完全不同，配音用 ElevenLabs，画面用 GPT Image，连对口型的动画代码都是 AI 写的。","highlight":"「同一段对话 8 种画风」视觉冲击强，展示了 AI 做小动画的新玩法。","rep":"钩子：「同一句台词，我让 AI 做成 8 种画风的动画」。九宫格对比不同画风截图，配一句台词，最后讲工具链（写剧本→出图→配音→动起来）。","author":"mhmazur","created":"2026-10-10 22:48","created_ts":1791643686,"fetched":"2026-10-12 17:25","fetched_ts":1791797100,"like":15,"bm":5,"rt":1,"view":1025,"rate":0.3333,"drafts":[],"cm":[]},{"url":"https://x.com/kakafoever01/status/2107838554416046277","type":"好玩线","sub":"AI横向对比","summary":"博主用 ChatGPT、豆包、Grok、DeepSeek 做外甥的一道小学奥数题，只有 GPT 答对，引出“家长辅导作业别全信 AI”。","highlight":"“AI 被小学题难住”反差大，又戳中家长痛点，好玩也有用。","rep":"找 3 道经典小学奥数/脑筋急转弯，横测豆包、DeepSeek、Kimi、元宝，表格打勾打叉；最后给家长一句提醒「让 AI 讲思路而不是给答案」。","author":"kakafoever01","created":"2026-10-07 22:20","created_ts":1791382847,"fetched":"2026-10-12 17:25","fetched_ts":1791797100,"like":2,"bm":0,"rt":0,"view":65,"rate":0.0,"drafts":["B02"],"cm":[]},{"url":"https://x.com/America39x/status/2108052516164563421","type":"好玩线","sub":"未细分","summary":"医院段子：已经问过豆包的患者不接了，AI 看病鄙视链——豆包初诊、千问复诊、元宝会诊。","highlight":"梗密度高，国产模型鄙视链一眼能懂。","rep":"复刻：做成鄙视链图+评论区投票；笔记「AI 看病鄙视链，你站哪一档」。","author":"America39x","created":"2026-10-08 12:31","created_ts":1791433860,"fetched":"2026-10-12 17:25","fetched_ts":1791797100,"like":0,"bm":0,"rt":0,"view":3,"rate":0,"drafts":[],"cm":[]},{"url":"https://x.com/theashrb/st day on site, 45 focused minutes is doable. Pretending I've got four free hours is not. Posting what broke is spot on.","z":"我见过最现实的做产品建议。工地忙完一天，专注四十五分钟做得到；假装自己有四小时空闲就不行。把翻车的东西发出来也说对了。","l":1,"a":0},{"u":"https://x.com/HeathSchubert/status/2100244598690107449","n":"HeathSchubert","t":"The advantage now is cheap iteration; the hard part is still finding a real user problem before polishing the demo.","z":"现在的优势是迭代便宜；难的还是在打磨演示之前，先找到真用户问题。","l":1,"a":0},{"u":"https://x.com/sorichev/status/2100149557677941126","n":"sorichev","t":"\"His 24 hours are not the same as yours\" is the bit that matters. Forty-five focused minutes with two kids is real progress, even if it doesn't produce a dramatic build-in-public screenshot.","z":"「他的 24 小时和你的不是一回事」才是重点。两个孩子身边专注四十五分钟也是真进步，哪怕出不了那种炫酷的公开构建截图。","l":1,"a":0},{"u":"https://x.com/hrprtsingh9/status/2100126511659626796","n":"hrprtsingh9","t":"Post bedtime hours are the most honest hours anyone builds in. No audience, no dopamine, just whether you actually want it.","z":"孩子睡后的那几小时，是最诚实的开工时间。没有观众、没有多巴胺，只剩你是不是真想做。","l":1,"a":0},{"u":"https://x.com/bestaiprice/status/2100010595382604197","n":"bestaiprice","t":"Vibe coding speeds up the framing, not the whole build 😅","z":"Vibe coding 加速的是定框架，不是整条构建线😅","l":1,"a":0},{"u":"https://x.com/yevloop/status/2099999824825225555","n":"yevloop","t":"The 45-minute constraint is probably the real unfair advantage here, not the app idea. Shipping beats another month of polishing.","z":"四十五分钟约束大概才是真正的不公平优势，不是那个 App 点子本身。先上线，胜过再打磨一个月。","l":1,"a":0}]},{"url":"https://x.com/WorldEverett/status/2108261296370032976","type":"创造线","sub":"创作方法","summary":"只用跟 ChatGPT 聊天剪视频：经 invideo MCP 连编辑器，一句话出初剪、配乐、转场和音效。","highlight":"「聊天即剪辑」演示感强，适合做成步骤轮播。","rep":"狠话：我剪这条视频，一句代码都没碰。流程条：聊天→初剪→配乐→成片；可用国内剪映/即梦同款演示。","author":"WorldEverett","created":"2026-10-09 02:20","created_ts":1791483637,"fetched":"2026-10-12 05:20","fetched_ts":1791753600,"like":13,"bm":3,"rt":1,"view":1136,"rate":0.2308,"drafts":[],"cm":[]},{"url":"https: Astra 在 20 刀套餐里基本没法用。","l":1,"a":0},{"u":"https://x.com/Alantheace13/status/2106121059921784990","n":"Alantheace13","t":"I have that same stack ($20 plan for codex, claude and cursor) and this checks out with my experience using all 3\nOpus 5.5 is goated\nSol outputs tend to be worse than Opus 5.5 and limits are brutal, but it's really good for reviews\nCursor when i run out of usage on the other 2","z":"我也是这套（Codex/Claude/Cursor 各 20 刀），和你体验对得上。Opus 5.5 真强；Sol 输出往往不如 Opus 5.5，额度也狠，但适合做审查；另外两个额度烧完再用 Cursor。","l":1,"a":0},{"u":"https://x.com/ArifromJelly/status/2106117272263901484","n":"ArifromJelly","t":"which one ran out first?","z":"哪个先把额度烧光的？","l":1,"a":0},{"u":"https://x.com/dovyp/status/2106006862189797524","n":"dovyp","t":"A pre-warmed devcontainer or known-good snapshot probably turns that Docker, DB, migration, and 503 half into five boring minutes.","z":"预热好的 devcontainer 或可用快照，大概能把 Docker、数据库、迁移和 503 那半截变成无聊的五分钟。","l":1,"a":0},{"u":"https://x.com/RobinHill85/status/2105959263155937599","n":"RobinHill85","t":"Good catch, the hidden doc bug definitely flips the expected ranking.","z":"好抓。隐藏文档 bug 确实会把预期排名整个翻过来。","l":1,"a":0},{"u":"https://x.com/MGhathore/status/2106565171632308300","n":"MGhathore","t":"Which model you used for all","z":"你三个都用的什么模型？","l":1,"a":0},{"u":"https://x.com/RobinHill85/status/2105933282093531431","n":"RobinHill85","t":"Looks like Claude Code edges out on speed and completeness, while Cursor is cheapest, and Codex struggles with limits, makes sense given model differences","z":"看起来 Claude Code 在速度和完成度上略胜，Cursor 最省钱，Codex 卡在额度上——按模型差异也说得通。","l":1,"a":0},{"u":"https://x.com/chenzhangreal/status/2105808936851100001","n":"chenzhangreal","t":"that's such a brutal test. bet you felt a little bad when the credits first started blinking red.","z":"这测试太狠了。额度开始闪红的时候你是不是有点于心不忍。","l":1,"a":0}]},{"url":"https://x.com/noahwachnik/status/2102791711227257149","type":"好玩线","sub":"AI整活实验","summary":"作者用 Opus 做了个全自动虚拟世界实验：里面的人会相爱、生孩子、写歌、跳舞，Claude 还专门为对话 fetched":"2026-10-12 01:11","fetched_ts":1791738660,"like":26,"bm":9,"rt":3,"view":73257,"rate":0.3462,"drafts":[],"cm":[]},{"url":"https://x.com/DominikTornow/status/2108224785918439600","type":"创造线","sub":"创意项目","summary":"作者晒出「The last agent harness」项目，互动很高（尤其收藏），展示一套自研 agent 运行支架。","highlight":"高收藏技术向创造物，可复刻成「我给 AI 特工做了个壳」解说。","rep":"狠话：特工再强，也得有个壳。配图：AI agent 钻进命名为 harness 的框架示意图。","author":"DominikTornow","created":"2026-10-08 23:55","created_ts":1791474932,"fetched":"2026-10-12 00:08","fetched_ts":1791734880,"like":192,"bm":291,"rt":11,"view":19602,"rate":1.5156,"drafts":[],"cm":[{"u":"https://x.com/gmazza1989/status/2108824354096075171","n":"gmazza1989","t":"Even a minimal kernel needs two things the prompt can't provide: a stop condition that can actually become true, and a place for rejected output to go. Without them the loop isn't small, it's undefined.","z":"再小的内核也需要两样提示词给不了的东西：一个真能触发的停止条件，和一个放被否决输出的地方。没有这两样，这个循环不是小，是根本没定义。","l":2,"a":0},{"u":"https://x.com/DominikTornow/status/2109176287042437155","n":"DominikTornow","t":"Lisp is delightfully charming","z":"Lisp 真是可爱迷人","l":1,"a":1},{"u":"https://x.com/jdegoes/status/2108549955770016252","n":"jdegoes","t":"Delightfully fun experiment, thanks for sharing!","z":"好玩的实验，谢谢分享！","l":1,"a":0},{"u":"https://x.com/realy0usaf/status/2108549817106641272","n":"realy0usaf","t":"I see Lisp, I am happy. Thanks for making this :)","z":"看到 Lisp 我就开心，感谢做了这个 :)","l":1,"a":0},{"u":"https://x.com/moebious/status/2108473998912762269","n":"moebious","t":"The name for ouroboros as ouro is on point, great article","z":"把衔尾蛇起名叫 ouro 太贴切了，好文章","l":1,"a":0},{"u":"https://x.com/DominikTornow/status/2108459553289310437","n":"DominikTornow","t":"Yeah, the eval replaces the binding but not the function execution.","z":"对，eval 替换的是绑定，不是正在执行的函数。","l":1,"a":1},{"u":"https://x.com/shahidcodes/status/2108448879092138198","n":"shahidcodes","t":"fun detail: the loop it writes is still running inside the bootstrap's eval, and in elisp redefining agent mid-run doesn't touch the call that's already looping. so any edit it makes to its own loop only kicks in on the next call, the one part that isn't live","z":"有个好玩的细节：它写的循环还跑在启动脚本的 eval 里，elisp 里运行中重定义 agent 不影响正在循环的那次调用，所以它改自己的循环要到下一次调用才生效，这是唯一不「实时」的部分","l":1,"a":0},{"u":"https://x.com/threehymns/status/2108418213667037188","n":"threehymns","t":"Lol this is what I wanted to do like years ago with JavaScript on a webpage. Of course the models weren't good enough back then to write good js and there were cors issues so none of it worked back then. Cool to see a more polished version of the same idea!","z":"哈，这就是我几年前想用网页 JS 做的事！那时候模型写不好 JS，还有跨域问题，全没跑通。现在看到更成熟的版本真酷","l":1,"a":0}]},{"url":"https://x.com/CypherpunkNow/status/2106091294204272947","type":"创造线","sub":"AI遇爱好","summary":"滑板/艺术创作者受够网站管理员，自己用 Claude + ChatGPT 搭了整站作品集，塞进近 30 年、1200 张图与周边作品。","highlight":"爱好档案数字化+自己动手建站，适合「AI 帮手艺人收纳一生作品」。","rep":"狠话：30 年作品，不再求网站管理员。配图：杂乱硬盘/纸箱 → 整齐作品集网站前后对比。","author":"CypherpunkNow","created":"2026-10-03 02:37","created_ts":1790966268,"fetched":"2026-10-12 00:08","fetched_ts":1791734880,"like":114,"bm":10,"rt":19,"view":3422,"rate":0.0877,"drafts":[],"cm":[{"u":"https://x.com/panprincipal/status/2106247081484521495","n":"panprincipal","t":"MYSTIC SK8 CUP 💪","z":"MYSTIC SK8 CUP 💪","l":2,"a":0},{"u":"https://x.com/albibeno/status/2106122196884369675","n":"albibeno","t":"...and the cover of \"Criptoria, from Turing to Nakamoto\", for which I will always be grateful. 👏👏👏\n\nCongratulations! https://t.co/ze9zTAc1Uy","z":"……还有《Criptoria, from Turing to Nakamoto》的封面，我会一直感激。👏👏👏\n\n恭喜！（链接见原帖）","l":2,"a":0},{"u":"https://x.com/ROBNESSOFFICIAL/status/2106097454328447041","n":"ROBNESSOFFICIAL","t":"GLAD TO SEE IT.  PLUS, YOU CAN COMMAND MORE OF THE AESTHETICS YOU WANT FOR THE SITE, IN YOUR STYLE.  ALL IN ALL I THINK IT'S GOOD FOR THE INTERNET LOLLL.","z":"太好了。而且你更能按自己的审美指挥网站风格。总之我觉得这对互联网是件好事哈哈。","l":2,"a":0},{"u":"https://x.com/ezCoinAccess/status/2106259022181773338","n":"ezCoinAc 构：观点拆解卡→ 小白对照：今日可交给 AI 的 3 件小事 vs 仍需自己拍板的 3 件→ 结尾互动提问。适合观点+清单，不承诺「替代工作」。","author":"DikshaNanduri","created":"2026-10-11 08:20","created_ts":1791678041,"fetched":"2026-10-11 12:11","fetched_ts":1791691860,"like":191,"bm":0,"rt":24,"view":49258,"rate":0.0,"drafts":[],"cm":[{"u":"https://x.com/ItsGoharr/status/2109142574921634115","n":"ItsGoharr","t":"infinite hires doing infinite mediocre work is not the flex you think it is","z":"无限个员工干着无限多平庸的活，这可不是你以为的那种炫耀。","l":1,"a":0}]},{"url":"https://x.com/rileybrown/status/2109068208812519445","type":"早期/新闻","sub":"AI Agent","summary":"Riley Brown 观点帖：在 AI 时代所有软件事实上都已开源，不如主动开源并拿回社区与分发红利（146 赞、互动走高）。","highlight":"","rep":"观点钩子：「AI 让软件默认‘开源’了？」。结构：一句话观点→ 对小白意味着什么（学工具别迷信闭源壁垒）→ 行动：优先挑 GitHub 星多、可自托管/免费层的工具练手。偏观点向，配 1–2 张对比卡即可，不宜做成硬核教程。","author":"rileybrown","created":"2026-10-11 07:47","created_ts":1791676020,"fetched":"2026-10-11 12:11","fetched_ts":1791691860,"like":146,"bm":13,"rt":4,"view":10872,"rate":0.089,"drafts":[],"cm":[{"u":"https://x.com/T1000_V2/status/2109085598820819359","n":"T1000_V2","t":"Normies will never use Github. They will pay Adobe even more to avoid setting eyes on Github. I think the most underrated business model is selling hosted access to open source tools that normies will never use if it’s only on Github.","z":"普通人永远不会用 GitHub，宁可多给 Adobe 交钱也不想看一眼 GitHub。我觉得最被低估的生意，就是把只放在 GitHub 上、普通人根本不会用的开源工具，做成托管服务卖。","l":4,"a":0},{"u":"https://x.com/yasuomang_zh/status/2109133210013847652","n":"yasuomang_zh","t":"I'd rather open the code and sell hosting. Nobody's paying for a private GitHub anymore.","z":"我宁可把代码开源，卖托管服务。现在没人再为私有 GitHub 掏钱了。","l":2,"a":0},{"u":"https://x.com/catalora86/status/2109083108767408235","n":"catalora86","t":"Code is cloneable. Distribution, data and trust aren't. Those were always the real source.","z":"代码能抄，渠道、数据和信任抄不走。那些才一直是真正的护城河。","l":2,"a":0},{"u":"https://x.com/danielkleach/status/2109069293325619684","n":"danielkleach","t":"Honestly, you may be right. Nearly anything can be cloned from a screenshot at this point.","z":"说实话你可能是对的。现在几乎什么东西都能照着一张截图克隆出来。","l":2,"a":0},{"u":"https://x.com/arthurrschaefer/status/2109212144432710078","n":"arthurrschaefer","t":"Something I keep seeing around this: companies find it much easier to justify a license in the ROI report than to justify paying for the expertise of people who really know the tool. If the code is open anyway, how do you make the case for the know-how?","z":"我一直看到这种情况：公司在投资回报报告里给软件授权找理由很容易，给真正懂工具的人的专业能力付钱却很难。代码反正都开源了，你怎么证明经验值钱？","l":1,"a":0},{"u":"https://x.com/parthbrief/status/2109183016933429507","n":"parthbrief","t":"If code is no longer the moat, open source becomes a distribution strategy. You get trust, community and word of mouth for free. Brand is what's left to compete on.","z":"如果代码不再是护城河，开源就成了一种获客策略：信任、社区、口碑全是免费的。剩下能拼的就是品牌。","l":1,"a":0},{"u":"https://x.com/mugabuilds/status/2109131866003652734","n":"mugabuilds","t":"I think the value for people is more about “how will this work for me” \n\n- build your own Linear, but “how will this work for me?”\n- build your own Clay, but “how will this work for me?”\n- build your own Photoshop, but “how will this work for me?”\n\nThat’s the value now.","z":"我觉得现在大家在意的是“这对我有什么用”。自己做个 Linear、自己做个 Clay、自己做个 Photoshop，都行，但“这对我有什么用？”这才是价值所在。","l":1,"a":0},{"u":"https://x.com/LongTian8888/status/2109128195530482155","n":"LongTian8888","t":"Fighting it is pointless, the code gets out anyway. Better to own the narrative.","z":"硬拦没意义，代码迟早会流出去。不如自己掌握话语权。","l":1,"a":0},{"u":"https://x.com/QihangYige/status/2109115154944426392","n":"QihangYige","t":"Fighting it just burns trust you could be earning.","z":"跟它对着干，只会把本来能赚到的信任烧掉。","l":1,"a":0}]},{"url":"https://x.com/Lin98201/status/2109094393877868719","type":"早期/新闻","sub":"上手技巧","summary":"引用 a16z 消费级 AI 报告：美国消费者里付费用 ChatGPT/Gemini/Claude 的仅约 4.5%；近半数用过 AI，仅约 1/4 每天用——关键不是「试一次」，而是给每天打开的理由。","highlight":"","rep":"洞察钩子：「大半人用过 AI，天天用的却很少」。结构：报告数字卡→ 小白对照：你属于哪一类→ 三个「每天打开」场景（写摘要/改文案/整理待办）→ 国内免费入口清单。适合做成知识卡+行动清单，避免空谈行业。","author":"Lin98201","created":"2026-10-11 09:31","created_ts":1791682263,"fetched":"2026-10-11 12:11","fetched_ts":1791691860,"like":38,"bm":0,"rt":3,"view":422,"rate":0.0,"drafts":[],"cm":[{"u":"https://x.com/KADAFERHIDUP/status/2109297983330386296","n":"KADAFERHIDUP","t":"Only one in four uses AI daily so the habit is the gap","z":"四个人里只有一个天天用 AI，差距就在习惯","l":1,"a":0},{"u":"https://x.com/naimeh70/status/2109296990001455385","n":"naimeh70","t":"the claim that context alone will drive daily use ignores how users discover value without explicit prompts","z":"光靠上下文就能带来日常使用？这忽略了用户在没有明确提示时是怎么发现价值的","l":1,"a":0},{"u":"https://x.com/0xNTTheshy/status/2109284087110525133","n":"0xNTTheshy","t":"for sure, getting daily use is the real challenge here","z":"没错，让人天天用才是真难题","l":1,"a":0}]},{"url":"https://x.com/I_AM_AYASHA/status/2109099519258620275","type":"早期/新闻","sub":"上手技巧","summary":"Ayasha 整理一份实用 AI 学习路线图：视频、GitHub、指南、书、论文与课程打包，解决「不知道先学什么」；收藏明显高于点赞，说明可存性好。","highlight":"","rep":"收藏钩子：「别再乱收藏教程了，按这条路线学」。结构：痛点开场→ 路线分层（入门视频/仓库/小项目）→ 国内替代资源（B 站/GitHub 中文 fork/DeepSeek）→ 7 天最小行动清单。知识卡 4–5 张很合适。","author":"I_AM_AYASHA","created":"2026-10-11 09:51","created_ts":1791683485,"fetched":"2026-10-11 12:11","fetched_ts":1791691860,"like":31,"bm":22,"rt":10,"view":787,"rate":0.7097,"drafts":[],"cm":[]},{"url":"https://x.com/LunaTechAI/status/2109084989786673285","type":"早期/新闻","sub":"上手技巧","summary":"安利 Google 免费约 1 小时 AI engineering 课：从搭第一个 AI agent、能做什么、上下文工程，到更自主的系统，时间戳齐全便于跟学。","highlight":"","rep":"小白钩子：「谷歌免费 1 小时，带你从 0 搭第一个 AI 助手」。结构：课程封面卡→ 目录时间轴（对应时间戳）→ 国内可跟学替代（B 站同主题/DeepSeek+扣子）→ 学完立刻做一个「帮你整理待办」的小 agent。主推向。","author":"LunaTechAI","created":"2026-10-11 08:53","created_ts":1791680021,"fetched":"2026-10-11 12:11","fetched_ts":1791691860,"like":30,"bm":17,"rt":22,"view":912,"rate":0.5667,"drafts":[],"cm":[]},{"url":"https://x.com/JackCulpan/status/2109071761300189417","type":"早期/新闻","sub":"AI Agent","summary":"Jack Culpan 演示 AI agent 端到端订机票（flightclaw）：不问浏览器乱点，付一次结账链，拿回订位编号 <script>
(function(){
var D=null,S={type:"",sub:"",q:"",sort:"fetched",undone:false,limit:60};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(v){if(v>=1e8)return(v/1e8).toFixed(1).replace(/\.0$/,"")+"亿";if(v>=1e4)return(v/1e4).toFixed(1).replace(/\.0$/,"")+"万";return String(v||0)}
function safeUrl(u){return /^https:\/\/(x|twitter)\.com\//.test(u||"")?u:"#"}
function init(data){
 D=data;var m=D.meta;
 var h='<div class="stat main"><div class="v">'+m.total+'</div><div class="k">话题总数</div></div>';
 m.types.forEach(function(t){h+='<div class="stat'+(t==="早期/新闻"?"":" blue")+'"><div class="v">'+(m.counts[t]||0)+'</div><div class="k">'+t+'</div></div>'});
 h+='<div class="stat"><div class="v">'+m.drafted+'</div><div class="k">已成稿</div></div>';
 $("stats").innerHTML=h;
 $("upd").textContent="最后抓取 "+m.last_fetch+" · 页面生成 "+m.built+"（台北时间）";
 var c='<button class="chip on" data-t="">全部<span class="c">'+m.total+'</span></button>';
 m.types.forEach(function(t){c+='<button class="chip" data-t="'+esc(t)+'">'+esc(t)+'<span class="c">'+(m.counts[t]||0)+'</span></button>'});
 $("chips").innerHTML=c;
 $("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;var t=b.getAttribute("data-t");
  S.type=(S.type===t&&t!=="")?"":t;S.sub="";S.limit=60;
  [].forEach.call($("chips").children,function(x){x.classList.toggle("on",x.getAttribute("data-t")===S.type)});
  fillSubs();render()};
 $("q").oninput=function(){S.q=this.value.trim().toLowerCase();S.limit=60;render()};
 $("sub").onchange=function(){S.sub=this.value;S.limit=60;render()};
 $("sort").onchange=function(){S.sort=this.value;S.limit=60;render()};
 $("undone").onchange=function(){S.undone=this.checked;S.limit=60;render()};
 $("more").onclick=function(){S.limit+=60;render()};
 fillSubs();render();favInit();
}
function fillSubs(){
 var cnt={};D.items.forEach(function(it){if(!S.type||it.type===S.type)cnt[it.sub]=(cnt[it.sub]||0)+1});
 var keys=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]||a.localeCompare(b,"zh")});
 var h='<option value="">全部子题（'+keys.length+'）</option>';
 keys.forEach(function(k){h+='<option value="'+esc(k)+'">'+esc(k)+'（'+cnt[k]+'）</option>'});
 $("sub").innerHTML=h;$("sub").value=S.sub;
}
function firstSentence(s){s=String(s||"").trim();var m=s.match(/^[^。！？!?\n]{6,}?[。！？!?]/);return m?m[0]:s}
function lineCls(t){return t==="好玩线"?"line":t==="创造线"?"line l-create":"line l-old"}
function isHiBm(it){return it.like>0&&it.rate>=1&&it.bm>=30}
function cmtHtml(c){
 var same=!c.z||c.z===c.t;
 return '<div class="cmt"><p class="z">'+esc(same?c.t:c.z)+'</p>'+(same?'':'<p class="o" hidden>'+esc(c.t)+'</p>')+
 '<div class="cmeta"><b>@'+esc(c.n)+'</b>'+(c.a?'<span class="au2">作者</span>':'')+'<span class="likes">♥ '+n(c.l)+'</span>'+
 (same?'':'<button class="sw" type="button">看原文</button>')+'<a class="lk" href="'+esc(safeUrl(c.u))+'" target="_blank" rel="noopener noreferrer">评论原帖 ↗</a></div></div>';
}
function cmBlock(cm){
 if(!cm||!cm.length)return "";
 var head=cm.slice(0,2),rest=cm.slice(2);
 return '<div class="cm"><div class="hd"><span>热评</span>'+(rest.length?'<button class="tg" type="button" data-n="'+cm.length+'">热评 '+cm.length+' 条 ▾</button>':'')+'</div>'+
  head.map(cmtHtml).join("")+(rest.length?'<div class="rest" hidden>'+rest.map(cmtHtml).join("")+'</div>':'')+'</div>';
}
function heatHtml(it,compact){
 var parts=['收藏 '+n(it.bm),'转发 '+n(it.rt)];
 if(it.view)parts.push('浏览 '+n(it.view));
 if(it.like)parts.push('收藏率 '+Math.round(it.rate*100)+'%');
 return '<div class="heat"><div class="big'+(it.like>=100?' hot':'')+'"><b>'+n(it.like)+'</b><span>赞</span></div>'+
  (isHiBm(it)?'<span class="hbm">高收藏</span>':'')+'<div class="minor"><span>'+parts.join('</span><span>')+'</span></div></div>';
}
function ideaHtml(it){
 var lead=it.highlight||it.rep;if(!lead)return "";

  else if(confirm("确定删除这条收纳？")){mutate({op:"del",id:f.id,url:f.url,src:f.source});toast("已删除")}
 };
 window.addEventListener("online",function(){if(token())syncAll()});
 document.addEventListener("visibilitychange",function(){if(!document.hidden&&token())syncAll()});
 trashInit();
 window.addEventListener("hashchange",function(){var v=location.hash==="#fav"?"fav":location.hash==="#trash"?"trash":"pool";if(v!==F.view)setView(v)});
 if(location.hash==="#fav")setView("fav");else if(location.hash==="#trash")setView("trash");else paintAll();
 if(token())sync();else loadPublic().then(function(){setState("local");paintAll()});
}
/* ===== 废纸篓（独立的键名 xhs_trash_*，不碰 xhs_fav_*） ===== */
var TFILE="trash.json",TAPI="https://api.github.com/repos/"+REPO+"/contents/"+TFILE;
var TK={ops:"xhs_trash_pending",cache:"xhs_trash_cache"};
var TR={base:lsGet(TK.cache,[]),ops:lsGet(TK.ops,[]),state:"local",err:"",busy:false,again:false};
function tnormUrl(u){u=String(u||"").trim();var m=u.match(/^https?:\/\/(?:www\.|mobile\.)?(?:x|twitter)\.com\/([^\/?#]+)\/status(?:es)?\/(\d+)/i);
 if(m)return "https://x.com/"+m[1]+"/status/"+m[2];return u.split(/[?#]/)[0].replace(/\/+$/,"")}
function tkey(u){var m=String(u||"").match(/status(?:es)?\/(\d+)/);return m?"s"+m[1]:tnormUrl(u).toLowerCase()}
function tnorm(r){var o={id:String(r.id||("tr_"+(tkey(r.url).replace(/^s/,"")||Date.now().toString(36)))),url:tnormUrl(r.url),trashed_at:String(r.trashed_at||tpeNow())};if(r.purged)o.purged=true;return o}
function applyTrashOps(list,ops){
 list=(Array.isArray(list)?list:[]).filter(function(r){return r&&r.url}).map(tnorm);
 function idx(u){var k=tkey(u);for(var i=0;i<list.length;i++){if(tkey(list[i].url)===k)return i}return -1}
 ops.forEach(function(op){
  if(op.op==="add"){var i=idx(op.url);if(i<0)list.push(tnorm({url:op.url,trashed_at:op.at}));else{list[i].trashed_at=op.at;delete list[i].purged}}
  else if(op.op==="restore"){var j=idx(op.url);if(j>=0&&!list[j].purged)list.splice(j,1)}
  else if(op.op==="purge"){(op.urls||[]).forEach(function(u){var k=idx(u);if(k>=0)list[k].purged=true})}
 });
 return list;
}
function trashList(){return applyTrashOps(TR.base,TR.ops)}
var _tset=null;
function trashSet(){if(_tset)return _tset;var s={};trashList().forEach(function(r){s[tkey(r.url)]=r});_tset=s;return s}
function isTrashed(u){return !!trashSet()[tkey(u)]}
function tApiGet(tok){
 return fetch(TAPI+"?ref="+BRANCH+"&_="+Date.now(),{headers:hdr(tok),cache:"no-store"}).then(function(r){
  if(r.status===404)return{list:[],sha:null};
  if(!r.ok){var e=new Error("读取失败 HTTP "+r.status);e.status=r.status;throw e}
  return r.json().then(function(j){var list=[];try{list=JSON.parse(b64d(j.content||"")||"[]")}catch(e){list=[]}return{list:Array.isArray(list)?list:[],sha:j.sha}})});
}
function tApiPut(tok,list,sha){
 var body={message:"废纸篓更新 "+shortT(tpeNow()),content:b64e(JSON.stringify(list,null,2)+"\n"),branch:BRANCH};
 if(sha)body.sha=sha;
 return fetch(TAPI,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},hdr(tok)),body:JSON.stringify(body)});
}
function tPersist(){lsSet(TK.cache,TR.base);lsSet(TK.ops,TR.ops);_tset=null}
function tSetState(s,err){TR.state=s;TR.err=err||"";paintSync()}
function tsync(){
 var tok=token();
 if(!tok){tSetState("local");return Promise.resolve()}
 if(TR.busy){TR.again=true;return Promise.resolve()}
 TR.busy=true;tSetState("ing");
 var tries=0;
 function round(){
  tries++;
  return tApiGet(tok).then(function(r){
   if(!TR.ops.length){TR.base=r.list.map(tnorm);return true}
   var n=TR.ops.length,next=applyTrashOps(r.list,TR.ops.slice(0,n));
   return tApiPut(tok,next,r.sha).then(function(res){
    if(res.ok){TR.base=next;TR.ops=TR.ops.slice(n);return TR.ops.length?round():true}
    if((res.status===409||res.status===422)&&tries<6)return round(); /* sha 冲突：重新拉取、合并再写 */
    var e=new Error("废纸篓写入失败 HTTP "+res.status);e.status=res.status;throw e;
   });
  });
 }
 return round().then(function(){tPersist();tSetState("ok")},function(e){
  tPersist();var m=e&&e.message?e.message:"网络错误";
  if(e&&(e.status===401||e.status===403))m+="（token 无效或没有写权限）";
  tSetState("fail",m);
 }).then(function(){TR.busy=false;paintAll();if(TR.again){TR.again=false;tsync()}});
}
function tLoadPublic(){
 if(!/^https?:/.test(location.protocol))return Promise.resolve();
 return fetch(TFILE+"?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(Array.isArray(j)){TR.base=j.filter(function(r){return r&&r.url}).map(tnorm);tPersist()}}).catch(function(){});
}
function tmutate(op){op.at=op.at||tpeNow();TR.ops.push(op);tPersist();paintAll();tsync()}
function syncAll(){return Promise.all([sync(),tsync()])}
/* 合并两个文件的同步状态 */
function syncState(){var a=F.state,b=TR.state;
 if(a==="fail"||b==="fail")return "fail";if(a==="ing"||b==="ing")return "ing";if(a==="ok"&&b==="ok")return "ok";return "local"}
function syncErr(){return [F.state==="fail"?"收纳："+F.err:"",TR.state==="fail"?"废纸篓："+TR.err:""].filter(Boolean).join("；")}
function toastUndo(text,label,fn,ms){
 var old=document.querySelector(".toast.act");if(old)old.remove();
 var d=document.createElement("div");d.className="toast act";d.innerHTML=esc(text)+' · <button type="button">'+esc(label)+'</button>';
 var done=false,tm=setTimeout(function(){d.remove()},ms||5000);
 d.querySelector("button").onclick=function(){if(done)return;done=true;clearTimeout(tm);d.remove();fn()};
 document.body.appendChild(d);
}
function trashClick(url){
 var fav=favByUrl(url);
 if(fav&&!confirm("这个话题已经收纳了。丢入废纸篓会同时取消收纳，确定吗？"))return;
 var favRec=fav?JSON.parse(JSON.stringify(fav)):null;
 if(fav)mutate({op:"del",id:fav.id,url:fav.url,src:fav.source});
 tmutate({op:"add",url:tnormUrl(url)});
 toastUndo(fav?"已丢入废纸篓，并取消收纳":"已丢入废纸篓","撤销",function(){
  tmutate({op:"restore",url:tnormUrl(url)});
  if(favRec)mutate({op:"add",id:favRec.id,url:favRec.url,src:favRec.source,rec:favRec});
  toast("已撤销");
 },5000);
}
function trashBtn(u){return '<button class="trash" type="button" data-url="'+esc(u)+'" title="丢入废纸篓" aria-label="丢入废纸篓"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>'}
function tcard(r){
 var it=null;if(D){var k=tkey(r.url);for(var i=0;i<D.items.length;i++){if(tkey(D.items[i].url)===k){it=D.items[i];break}}}
 return '<article class="card tcard" data-url="'+esc(r.url)+'"><div class="ctop">'+(it?'<span class="'+lineCls(it.type)+'">'+esc(it.type)+'</span>'+(it.sub&&it.sub!=="未细分"?'<span class="csub">'+esc(it.sub)+'</span>':''):'<span class="line l-old">已不在话题池</span>')+'</div>'+
 '<h3 class="ttl2">'+esc(it?it.summary:r.url)+'</h3>'+(it?heatHtml(it):'')+
 '<div class="cfoot"><span class="who">丢弃于 '+esc(shortT(r.trashed_at))+(it?' · @'+esc(it.author):'')+'</span><span class="sp2"></span><button class="btn ghost sm" data-act="restore">恢复</button>'+
 '<a class="go2" href="'+esc(safeUrl(r.url))+'" target="_blank" rel="noopener noreferrer">原帖 ↗</a></div></article>';
}
function paintTrash(){
 var all=trashList(),vis=all.filter(function(r){return !r.purged});
 $("trashN").textContent=vis.length;
 if(F.view!=="trash")return;
 var st=syncState(),nt="";
 if(st==="fail")nt='<div class="notice fail">同步失败：'+esc(syncErr())+'。改动已存在本机，不会丢。<a id="tRetry">点这里重试</a></div>';
 else if(!token())nt='<div class="notice">仅本机：废纸篓先存在这台设备上。<a id="tTok">填 token 后同步</a></div>';
 $("trashNotice").innerHTML=nt;
 vis.sort(function(a,b){return a.trashed_at<b.trashed_at?1:-1});
 $("trashInfo").textContent=vis.length?("共 "+vis.length+" 条，恢复后回到话题池"):"";
 $("purgeB").disabled=!vis.length;
 $("tgrid").innerHTML=vis.length?vis.map(tcard).join(""):'<div class="empty">废纸篓是空的。在话题池卡片右上角点垃圾桶图标，就能把不想看的话题丢进来</div>';
}
function trashInit(){
 $("grid").addEventListener("click",function(e){var b=e.target.closest(".trash");if(b)trashClick(b.getAttribute("data-url"))});
 $("tgrid").onclick=function(e){var a=e.target.closest('[data-act="restore"]');if(!a)return;var c=a.closest(".tcard");tmutate({op:"restore",url:c.getAttribute("data-url")});toast("已恢复到话题池")};
 $("purgeB").onclick=function(){var vis=trashList().filter(function(r){return !r.purged});if(!vis.length)return;
  if(confirm("清空废纸篓里的 "+vis.length+" 条？清空后这里不再显示，这些话题也不会回到话题池。")){tmutate({op:"purge",urls:vis.map(function(r){return r.url})});toast("已清空废纸篓")}};
 $("trashNotice").onclick=function(e){if(e.target.id==="tRetry")syncAll();if(e.target.id==="tTok")tokenDialog(false)};
 if(token())tsync();else tLoadPublic().then(function(){tSetState("local");paintAll()});
}
function starBtn(u){var on=!!favByUrl(u);return '<button class="star'+(on?' on':'')+'" data-url="'+esc(u)+'">'+(on?'★ 已收纳':'☆ 收纳')+'</button>'}
function paintCounts(){
 var m=D.meta,c={},tot=0,dr=0;D.items.forEach(function(it){if(isTrashed(it.url))return;tot++;c[it.type]=(c[it.type]||0)+1;if(it.drafts.length)dr++});
 var h='<div class="stat main"><div class="v">'+tot+'</div><div class="k">话题总数</div></div>';
 m.types.forEach(function(t){h+='<div class="stat'+(t==="早期/新闻"?"":" blue")+'"><div class="v">'+(c[t]||0)+'</div><div class="k">'+t+'</div></div>'});
 h+='<div class="stat"><div class="v">'+dr+'</div><div class="k">已成稿</div></div>';
 $("stats").innerHTML=h;
 [].forEach.call($("chips").children,function(b){var t=b.getAttribute("data-t"),sp=b.querySelector(".c");if(sp)sp.textContent=t?(c[t]||0):tot});
}
function render(){
 paintCounts();
 var q=S.q,list=D.items.filter(function(it){
  if(isTrashed(it.url))return false;
  if(S.type&&it.type!==S.type)return false;
  if(S.sub&&it.sub!==S.sub)return false;
  if(S.undone&&it.drafts.length)return false;
  if(q){var hay=(it.summary+" "+it.highlight+" "+it.rep+" "+it.author+" "+it.sub+" "+it.drafts.join(" ")+" "+(it.cm||[]).map(function(c){return c.z+" "+c.t}).join(" ")).toLowerCase();if(hay.indexOf(q)<0)return false}
  return true});
 var k={fetched:function(a,b){return b.fetched_ts-a.fetched_ts||b.like-a.like},like:function(a,b){return b.like-a.like},bm:function(a,b){return b.bm-a.bm},rate:function(a,b){return b.rate-a.rate||b.bm-a.bm}}[S.sort];
 list.sort(k);
 $("count").textContent="显示 "+Math.min(list.length,S.limit)+" / 共 "+list.length+" 条";
 $("grid").innerHTML=list.length?list.slice(0,S.limit).map(card).join(""):'<div class="empty">没有符合条件的话题</div>';
 $("more").hidden=list.length<=S.limit;
}
function fallback(){try{init(JSON.parse($("embedded").textContent))}catch(e){$("grid").innerHTML='<div class="empty">数据加载失败</div>'}}
if(location.protocol==="file:"||!window.fetch){fallback()}
else{fetch("data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){if(!d||!d.items)throw 0;init(d)}).catch(fallback)}
})();
</script>
