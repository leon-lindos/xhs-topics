*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row+.row{margin-top:10px}
input[type=search]{flex:1 1 260px;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:15px;color:var(--ink);outline:none;font-family:inherit}
input[type=search]:focus{border-color:var(--blue)}

.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .c{opacity:.7;font-weight:500;margin-left:4px}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;user-select:none;white-space:nowrap}
.tog input{width:18px;height:18px;accent-color:var(--blue)}
.count{font-size:13px;color:var(--mute);margin-left:auto}

.tag.t-创造线{background:var(--ink);color:#fff}

.tag.done{background:#fff;color:var(--blue);border:1.5px solid var(--blue);padding:1px 9px}
.sum{font-size:16px;font-weight:700;line-height:1.5}
.hl{font-size:14px;color:var(--ink);background:var(--soft);border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 8px 8px 0}

.m{text-align:center}.m b{display:block;font-size:15px;font-weight:800}.m span{font-size:11px;color:var(--mute)}
.m.rate b{color:var(--blue)}
.meta{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 12px}

summary{cursor:pointer;color:var(--blue);font-weight:700;list-style:none;padding:2px 0}

details p{margin-top:6px;color:#283247;white-space:pre-wrap;word-break:break-word}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:2px}
.go{font-size:14px;font-weight:700}
.empty{padding:60px 0;text-align:center;color:var(--mute)}

.sync.ok{color:var(--blue);border-color:#c7d5fb;background:var(--soft)}
.sync.fail{color:#b42318;border-color:#f3c3be;background:#fff5f4}

.icon{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:17px;cursor:pointer;color:var(--ink)}
.star{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}

 .m b{font-size:14px}
}

 $("chips").innerHTML=c;
 $("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;var t=b.getAttribute("data-t");
  S.type=(S.type===t&&t!=="")?"":t;S.sub="";S.limit=60;
  [].forEach.call($("chips").children,function(x){x.classList.toggle("on",x.getAttribute("data-t")===S.type)});

function fillSubs(){

 keys.forEach(function(k){h+='<option value="'+esc(k)+'">'+esc(k)+'（'+cnt[k]+'）</option>'});

}

 '<div class="metrics"><div class="m"><b>'+n(it.like)+'</b><span>点赞</span></div><div class="m"><b>'+n(it.bm)+'</b><span>收藏</span></div><div class="m"><b>'+n(it.rt)+'</b><span>转发</span></div><div class="m"><b>'+(it.view?n(it.view):"—")+'</b><span>浏览</span></div><div class="m rate"><b>'+rate+'</b><span>收藏率</span></div></div>'+
 (it.rep?'<details><summary>复刻思路</summary><p>'+esc(it.rep)+'</p></details>':'')+
 '<div class="meta"><span class="au">@'+esc(it.author)+'</span><span>发帖 '+esc(it.created)+'</span><span>抓取 '+esc(it.fetched)+'</span></div>'+

}

function norm(r){return{id:String(r.id||newId()),url:String(r.url||""),title:String(r.title||""),note:String(r.note||""),tags:Array.isArray(r.tags)?r.tags.map(String):parseTags(r.tags),source:r.source==="pool"?"pool":"manual",added_at:String(r.added_at||tpeNow()),status:STATUSES.indexOf(r.status)>=0?r.status:"待做",updated_at:String(r.updated_at||r.added_at||tpeNow())}}
function findIdx(list,id,url,src){for(var i=0;i<list.length;i++){if(list[i].id===id)return i}if(src==="pool"&&url){for(var j=0;j<list.length;j++){if(list[j].source==="pool"&&list[j].url===url)return j}}return -1}
/* 把待同步操作按顺序重放到一份列表上（冲突时就是在最新远端数据上重放 = 合并） */
function applyOps(list,ops){
 list=(Array.isArray(list)?list:[]).map(norm);
 ops.forEach(function(op){
  var i=findIdx(list,op.id,op.url,op.src);
  if(op.op==="add"){
   if(i<0){list.push(norm(op.rec))}
   else{var x=list[i];if(op.rec.note&&!x.note)x.note=op.rec.note;op.rec.tags.forEach(function(t){if(x.tags.indexOf(t)<0)x.tags.push(t)})}
  }else if(op.op==="upd"&&i>=0){for(var k in op.f){list[i][k]=op.f[k]}list[i].updated_at=op.at}
  else if(op.op==="del"&&i>=0){list.splice(i,1)}
 });
 return list;
}
function favs(){return applyOps(F.base,F.ops)}
function b64e(s){var b=new TextEncoder().encode(s),o="";for(var i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function b64d(s){var r=atob(String(s).replace(/\s/g,"")),b=new Uint8Array(r.length);for(var i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return new TextDecoder().decode(b)}
function hdr(tok){return{"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}
function apiGet(tok){
 return fetch(API+"?ref="+BRANCH+"&_="+Date.now(),{headers:hdr(tok),cache:"no-store"}).then(function(r){
  if(r.status===404)return{list:[],sha:null};
  if(!r.ok){var e=new Error("读取失败 HTTP "+r.status);e.status=r.status;throw e}
  return r.json().then(function(j){var list=[];try{list=JSON.parse(b64d(j.content||"")||"[]")}catch(e){list=[]}return{list:Array.isArray(list)?list:[],sha:j.sha}})});
}
function apiPut(tok,list,sha){
 var body={message:"收纳更新 "+shortT(tpeNow()),content:b64e(JSON.stringify(list,null,2)+"\n"),branch:BRANCH};
 if(sha)body.sha=sha;
 return fetch(API,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},hdr(tok)),body:JSON.stringify(body)});
}
function persist(){lsSet(K.cache,F.base);lsSet(K.ops,F.ops)}
function setState(s,err){F.state=s;F.err=err||"";paintSync()}
function sync(){
 var tok=token();
 if(!tok){setState("local");return Promise.resolve()}
 if(F.busy){F.again=true;return Promise.resolve()}
 F.busy=true;setState("ing");
 var tries=0;
 function round(){
  tries++;
  return apiGet(tok).then(function(r){
   if(!F.ops.length){F.base=r.list.map(norm);return true}
   var n=F.ops.length,next=applyOps(r.list,F.ops.slice(0,n));
   return apiPut(tok,next,r.sha).then(function(res){
    if(res.ok){F.base=next;F.ops=F.ops.slice(n);return F.ops.length?round():true}
    if((res.status===409||res.status===422)&&tries<6)return round(); /* sha 冲突：重新拉取、合并再写 */
    var e=new Error("写入失败 HTTP "+res.status);e.status=res.status;throw e;
   });
  });
 }
 return round().then(function(){persist();setState("ok")},function(e){
  persist();var m=e&&e.message?e.message:"网络错误";
  if(e&&(e.status===401||e.status===403))m+="（token 无效或没有写权限）";
  setState("fail",m);
 }).then(function(){F.busy=false;paintAll();if(F.again){F.again=false;sync()}});
}
function loadPublic(){
 if(!/^https?:/.test(location.protocol))return Promise.resolve();
 return fetch(FILE+"?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(Array.isArray(j)){F.base=j.map(norm);lsSet(K.cache,F.base)}}).catch(function(){});
}
function mutate(op){op.at=tpeNow();F.ops.push(op);persist();paintAll();sync()}
function favByUrl(url){var l=favs();for(var i=0;i<l.length;i++){if(l[i].url===url)return l[i]}return null}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function closeModal(){var m=document.querySelector(".mask");if(m)m.remove();document.removeEventListener("keydown",escClose)}
function escClose(e){if(e.key==="Escape")closeModal()}
function modal(html){closeModal();var m=document.createElement("div");m.className="mask";m.innerHTML='<div class="dlg" role="dialog" aria-modal="true">'+html+'</div>';m.addEventListener("click",function(e){if(e.target===m)closeModal()});document.body.appendChild(m);document.addEventListener("keydown",escClose);return m}
function allTags(){var c={};favs().forEach(function(f){f.tags.forEach(function(t){c[t]=(c[t]||0)+1})});return Object.keys(c).sort(function(a,b){return c[b]-c[a]})}
function tokenDialog(first,then){
 var has=!!token();
 var m=modal('<h3>'+(has?'同步设置':'跨设备同步')+'</h3><div class="hint">在这台设备上粘贴你的 GitHub token，收纳会写进仓库的 favorites.json，手机和电脑自动同步。token 只存在这台设备的浏览器里。</div>'+
  '<label>GitHub token</label><input type="password" id="tk" autocomplete="off" placeholder="'+(has?'已保存，粘贴新 token 可替换':'github_pat_… 或 ghp_…')+'">'+
  '<div class="hint" style="margin-top:6px">需要对 '+esc(REPO)+' 有 Contents 读写权限。注意：仓库是公开的，收纳内容别人也能看到。</div><div class="err" id="tkErr"></div>'+
  '<div class="ops">'+(has?'<button class="btn danger" id="tkOut">退出（清除 token）</button><span class="sp"></span>':'')+'<button class="btn plain" id="tkSkip">'+(first?'先存本机':'取消')+'</button><button class="btn" id="tkOk">保存并同步</button></div>');
 m.querySelector("#tkSkip").onclick=function(){closeModal();if(then)then()};
 if(has)m.querySelector("#tkOut").onclick=function(){try{localStorage.removeItem(K.tok)}catch(e){}closeModal();setState("local");paintAll();toast("已退出，之后的收纳先存本机")};
 m.querySelector("#tkOk").onclick=function(){
  var v=m.querySelector("#tk").value.trim(),err=m.querySelector("#tkErr");
  if(!v){err.textContent="请先粘贴 token";return}
  err.textContent="正在验证…";
  apiGet(v).then(function(){try{localStorage.setItem(K.tok,v)}catch(e){}closeModal();toast("已连接，正在同步");sync().then(function(){if(then)then()})},
   function(e){err.textContent=(e.status===401?"token 无效":e.status===404||e.status===403?"这个 token 没有该仓库的权限":"验证失败："+e.message)});
 };
 setTimeout(function(){var i=m.querySelector("#tk");if(i)i.focus()},50);
}
function tagSug(m,inputSel){
 var box=m.querySelector(".sug");if(!box)return;var ts=allTags();if(!ts.length){box.remove();return}
 box.innerHTML=ts.slice(0,16).map(function(t){return'<button type="button">'+esc(t)+'</button>'}).join("");
 box.onclick=function(e){var b=e.target.closest("button");if(!b)return;var i=m.querySelector(inputSel),cur=parseTags(i.value);if(cur.indexOf(b.textContent)<0)cur.push(b.textContent);i.value=cur.join("，")};
}
function favDialog(opt){ /* opt: {mode:'pool'|'manual'|'edit', rec, item} */
 var r=opt.rec||{},isEdit=opt.mode==="edit",isManual=opt.mode==="manual";
 var title=isEdit?"编辑收纳":isManual?"添加我自己看到的":"收纳这个话题";
 var m=modal('<h3>'+title+'</h3>'+(opt.mode==="pool"?'<div class="hint">备注和标签都可以不填</div>':'')+
  ((isManual||(isEdit&&r.source==="manual"))?'<label>链接（必填）</label><input id="fu" type="url" inputmode="url" placeholder="X、小红书、公众号文章、视频链接都行" value="'+esc(r.url||"")+'">':'')+
  '<label>标题</label><input id="ft" placeholder="'+(isManual?'选填，不填就显示链接':'')+'" value="'+esc(r.title||(opt.item?opt.item.summary:""))+'">'+
  '<label>备注</label><textarea id="fn" placeholder="一句话：为什么想做、打算怎么做">'+esc(r.note||"")+'</textarea>'+
  '<label>标签</label><input id="fg" placeholder="用逗号或空格分隔，例如：周末做，家人" value="'+esc((r.tags||[]).join("，"))+'"><div class="sug"></div>'+
  (isEdit?'<label>状态</label><div class="seg" id="fs">'+STATUSES.map(function(s){return'<button type="button" class="'+(s===r.status?"on":"")+'">'+s+'</button>'}).join("")+'</div>':'')+
  '<div class="err" id="fe"></div><div class="ops">'+(isEdit?'<button class="btn danger" id="fdel">删除</button><span class="sp"></span>':'')+'<button class="btn plain" id="fc">取消</button><button class="btn" id="fok">'+(isEdit?'保存':'收纳')+'</button></div>');
 tagSug(m,"#fg");
 var st=r.status||"待做";
 if(isEdit)m.querySelector("#fs").onclick=function(e){var b=e.target.closest("button");if(!b)return;st=b.textContent;[].forEach.call(this.children,function(x){x.classList.toggle("on",x===b)})};
 m.querySelector("#fc").onclick=closeModal;
 if(isEdit)m.querySelector("#fdel").onclick=function(){if(confirm("确定删除这条收纳？")){mutate({op:"del",id:r.id,url:r.url,src:r.source});closeModal();toast("已删除")}};
 m.querySelector("#fok").onclick=function(){
  var u=m.querySelector("#fu"),url=u?u.value.trim():(r.url||opt.item.url);
  if(u&&!/^https?:\/\/\S+\.\S+/i.test(url)){if(/^[\w-]+(\.[\w-]+)+/.test(url))url="https://"+url;else{m.querySelector("#fe").textContent="请填一个有效链接";return}}
  var f={title:m.querySelector("#ft").value.trim(),note:m.querySelector("#fn").value.trim(),tags:parseTags(m.querySelector("#fg").value)};
  if(isEdit){f.status=st;if(u)f.url=url;mutate({op:"upd",id:r.id,url:r.url,src:r.source,f:f});toast("已保存")}
  else{var rec=norm({id:newId(),url:url,title:f.title,note:f.note,tags:f.tags,source:isManual?"manual":"pool",added_at:tpeNow(),status:"待做"});mutate({op:"add",id:rec.id,url:rec.url,src:rec.source,rec:rec});toast(token()?"已收纳":"已收纳（仅本机，填 token 后同步）")}
  closeModal();
 };
 setTimeout(function(){var i=m.querySelector(isManual?"#fu":"#fn");if(i)i.focus()},50);
}
function starClick(url){
 var ex=favByUrl(url);if(ex){favDialog({mode:"edit",rec:ex});return}
 var it=null;for(var i=0;i<D.items.length;i++){if(D.items[i].url===url){it=D.items[i];break}}
 var go=function(){favDialog({mode:"pool",item:it,rec:{url:url}})};
 if(!token()&&!lsGet(K.asked,false)){lsSet(K.asked,true);tokenDialog(true,go)}else go();
}
function paintSync(){
 var b=$("syncB");if(!b)return;var p=F.ops.length;
 var t={ok:"● 已同步",local:"仅本机"+(p?" · "+p+" 条待同步":""),ing:"同步中…",fail:"同步失败 · 重试"}[F.state];
 b.textContent=t;b.className="sync "+F.state;
 b.title=F.state==="fail"?F.err+"，点击重试":F.state==="local"?"填 token 后跨设备同步":"";
}
function domainLabel(u){var h="";try{h=new URL(u).hostname}catch(e){return"链接"}
 if(/(^|\.)(x|twitter)\.com$/.test(h))return"X";if(/xiaohongshu|xhslink/.test(h))return"小红书";if(/mp\.weixin\.qq\.com/.test(h))return"公众号";
 if(/bilibili|b23\.tv|youtube|youtu\.be|douyin|v\.qq|ixigua|kuaishou|weishi/.test(h))return"视频";return h.replace(/^www\./,"")}
function safeHref(u){return /^https?:\/\//i.test(u||"")?u:"#"}
function fcard(f){
 return '<article class="card fcard" data-id="'+esc(f.id)+'"><div class="tags"><span class="tag '+(f.source==="pool"?"t-好玩线":"t-创造线")+'">'+(f.source==="pool"?"话题池":"自己看到的")+'</span><span class="tag">'+esc(domainLabel(f.url))+'</span>'+f.tags.map(function(t){return'<span class="ftag">#'+esc(t)+'</span>'}).join("")+'</div>'+
 '<a class="ttl" href="'+esc(safeHref(f.url))+'" target="_blank" rel="noopener noreferrer">'+esc(f.title||f.url)+' ↗</a>'+
 (f.title?'<div class="url">'+esc(f.url)+'</div>':'')+
 (f.note?'<div class="note">'+esc(f.note)+'</div>':'')+
 '<div class="foot" style="gap:8px;flex-wrap:wrap"><div class="seg">'+STATUSES.map(function(s){return'<button data-st="'+s+'" class="'+(s===f.status?"on":"")+'">'+s+'</button>'}).join("")+'</div>'+
 '<div class="acts"><button class="lnk" data-act="edit">编辑</button><button class="lnk red" data-act="del">删除</button></div></div>'+
 '<div class="meta"><span>收纳于 '+esc(shortT(f.added_at))+'</span></div></article>';
}
function paintFav(){
 var list=favs();$("favN").textContent=list.length;
 if(F.view!=="fav")return;
 var nt="";
 if(F.state==="fail")nt='<div class="notice fail">同步失败：'+esc(F.err)+'。改动已存在本机，不会丢。<a id="ntRetry">点这里重试</a></div>';
 else if(!token())nt='<div class="notice">仅本机：收纳先存在这台设备上。<a id="ntTok">填 token 后同步</a></div>';
 $("favNotice").innerHTML=nt;
 var sc={"":list.length};STATUSES.forEach(function(s){sc[s]=0});list.forEach(function(f){sc[f.status]++});
 $("fst").innerHTML=[""].concat(STATUSES).map(function(s){return'<button class="chip'+(F.fst===s?" on":"")+'" data-s="'+s+'">'+(s||"全部状态")+'<span class="c">'+sc[s]+'</span></button>'}).join("");
 var ts=allTags();if(F.ftag&&ts.indexOf(F.ftag)<0)F.ftag="";
 $("ftags").innerHTML=ts.length?'<button class="chip'+(F.ftag?"":" on")+'" data-g="">全部标签</button>'+ts.map(function(t){return'<button class="chip'+(F.ftag===t?" on":"")+'" data-g="'+esc(t)+'">#'+esc(t)+'</button>'}).join(""):"";
 var q=F.fq,show=list.filter(function(f){
  if(F.fst&&f.status!==F.fst)return false;if(F.ftag&&f.tags.indexOf(F.ftag)<0)return false;
  if(q&&(f.title+" "+f.note+" "+f.url+" "+f.tags.join(" ")).toLowerCase().indexOf(q)<0)return false;return true});
 show.sort(function(a,b){return a.added_at<b.added_at?1:-1});
 $("fgrid").innerHTML=show.length?show.map(fcard).join(""):'<div class="empty">'+(list.length?'没有符合条件的收纳':'还没有收纳。去「话题池」点 ☆ 收纳，或者点「＋ 添加我自己看到的」')+'</div>';
}
function paintAll(){paintSync();paintFav();if(F.view==="pool"&&D)render()}
function setView(v){F.view=v;[].forEach.call(document.querySelectorAll(".tab"),function(t){t.classList.toggle("on",t.getAttribute("data-v")===v)});
 $("poolView").hidden=v!=="pool";$("favView").hidden=v!=="fav";if(location.hash!==(v==="fav"?"#fav":"")){history.replaceState(null,"",v==="fav"?"#fav":location.pathname+location.search)}paintAll()}
function exportJson(){var b=new Blob([JSON.stringify(favs(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="xhs-favorites-"+tpeNow().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function favInit(){
 document.querySelector(".nav").onclick=function(e){var t=e.target.closest(".tab");if(t)setView(t.getAttribute("data-v"))};
 $("syncB").onclick=function(){if(F.state==="fail"||(token()&&F.state!=="ing"))sync();else if(!token())tokenDialog(false)};
 $("setB").onclick=function(){tokenDialog(false)};
 $("grid").addEventListener("click",function(e){var b=e.target.closest(".star");if(b)starClick(b.getAttribute("data-url"))});
 $("addB").onclick=function(){favDialog({mode:"manual"})};
 $("expB").onclick=exportJson;
 $("fq").oninput=function(){F.fq=this.value.trim().toLowerCase();paintFav()};
 $("fst").onclick=function(e){var b=e.target.closest(".chip");if(b){F.fst=b.getAttribute("data-s");paintFav()}};
 $("ftags").onclick=function(e){var b=e.target.closest(".chip");if(b){F.ftag=b.getAttribute("data-g");paintFav()}};
 $("favNotice").onclick=function(e){if(e.target.id==="ntRetry")sync();if(e.target.id==="ntTok")tokenDialog(false)};
 $("fgrid").onclick=function(e){
  var c=e.target.closest(".fcard");if(!c)return;var id=c.getAttribute("data-id"),f=favs().filter(function(x){return x.id===id})[0];if(!f)return;
  var s=e.target.closest("[data-st]");if(s){if(s.getAttribute("data-st")!==f.status)mutate({op:"upd",id:f.id,url:f.url,src:f.source,f:{status:s.getAttribute("data-st")}});return}
  var a=e.target.closest("[data-act]");if(!a)return;
  if(a.getAttribute("data-act")==="edit")favDialog({mode:"edit",rec:f});
  else if(confirm("确定删除这条收纳？")){mutate({op:"del",id:f.id,url:f.url,src:f.source});toast("已删除")}
 };
 window.addEventListener("online",function(){if(token())sync()});
 document.addEventListener("visibilitychange",function(){if(!document.hidden&&token())sync()});
 if(location.hash==="#fav")setView("fav");else paintAll();
 if(token())sync();else loadPublic().then(function(){setState("local");paintAll()});
}
function starBtn(u){var on=!!favByUrl(u);return '<button class="star'+(on?' on':'')+'" data-url="'+esc(u)+'">'+(on?'★ 已收纳':'☆ 收纳')+'</button>'}
function render(){
 var q=S.q,list=D.items.filter(function(it){
  if(S.type&&it.type!==S.type)return false;
  if(S.sub&&it.sub!==S.sub)return false;
  if(S.undone&&it.drafts.length)return false;
  if(q){var hay=(it.summary+" "+it.highlight+" "+it.rep+" "+it.author+" "+it.sub+" "+it.drafts.join(" ")).toLowerCase();if(hay.indexOf(q)<0)return false}
  return true});
 var k={fetched:function(a,b){return b.fetched_ts-a.fetched_ts||b.like-a.like},like:function(a,b){return b.like-a.like},bm:function(a,b){return b.bm-a.bm},rate:function(a,b){return b.rate-a.rate||b.bm-a.bm}}[S.sort];
 list.sort(k);
 $("count").textContent="显示 "+Math.min(list.length,S.limit)+" / 共 "+list.length+" 条";
 $("grid").innerHTML=list.length?list.slice(0,S.limit).map(card).join(""):'<div class="empty">没有符合条件的话题</div>';
 $("more").hidden=list.length<=S.limit;
}
function fallback(){try{init(JSON.parse($("embedded").textContent))}catch(e){$("grid").innerHTML='<div class="empty">数据加载失败</div>'}}
if(location.protocol==="file:"||!window.fetch){fallback()}
else{fetch("data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){if(!d||!d.items)throw 0;init(d)}).catch(fallback)}
})();
